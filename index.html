<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>贪吃熊</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #222;
        color: white;
        text-align: center;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
      }

      h2 {
        margin: 10px 0 6px;
        font-size: clamp(18px, 5vw, 28px);
      }

      p {
        margin: 6px 0;
        font-size: clamp(12px, 3.5vw, 16px);
      }

      canvas {
        background: #111;
        display: block;
        margin: 8px auto 0;

        /* 手机、平板、电脑自动适配 */
        width: min(92vw, 78vh, 600px);
        height: min(92vw, 78vh, 600px);

        /* 防止手指滑动时页面滚动 */
        touch-action: none;
      }
      #startBtn {
        position: fixed;

        left: 50%;
        top: 62%;

        transform: translate(-50%, -50%);

        padding: 14px 30px;

        font-size: 20px;
        font-weight: bold;

        border: none;
        border-radius: 12px;

        background: #4caf50;
        color: white;

        z-index: 999;
      }
      #restartBtn {
        margin-top: 10px;
        padding: 12px 24px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
      }

      #restartBtn {
        display: none;

        position: fixed;

        left: 50%;
        top: 62%;

        transform: translate(-50%, -50%);

        padding: 14px 30px;

        font-size: 20px;
        font-weight: bold;

        border: none;
        border-radius: 12px;

        background: #ffb800;
        color: #fff;

        cursor: pointer;

        z-index: 999;
      }

      #version {
        position: fixed;

        right: 10px;
        bottom: 10px;

        font-size: 12px;

        color: rgba(255, 255, 255, 0.5);

        z-index: 9999;

        pointer-events: none;
      }

      #topBar {
        width: min(92vw, 78vh, 600px);

        margin: 10px auto 6px;

        display: flex;

        justify-content: space-between;

        align-items: center;
      }

      #gameTitle {
        font-size: 34px;
        font-weight: bold;
      }

      #scorePanel {
        font-size: 24px;
        font-weight: bold;
      }

      #musicBtn {
        padding: 6px 12px;

        border: none;

        border-radius: 10px;

        background: rgba(0, 0, 0, 0.4);

        color: white;

        cursor: pointer;
      }

      #bottomBar {
        width: min(92vw, 78vh, 600px);

        margin: 8px auto;

        display: flex;

        justify-content: space-between;

        align-items: center;
      }

      #controlTips {
        font-size: 16px;

        color: white;
      }
    </style>
  </head>
  <body>
    <div id="topBar">
      <div id="gameTitle">贪吃熊</div>

      <div id="scorePanel">
        分数：<span id="score">0</span> 最高分：<span id="bestScore">0</span>
      </div>
    </div>
    <canvas id="game" width="384" height="384"></canvas>
    <div id="bottomBar">
      <div id="controlTips">方向键，滑动屏幕控制，空格重开</div>

      <button id="musicBtn">🔇静音</button>
    </div>
    <button id="startBtn">开始游戏</button>
    <button id="restartBtn">重新开始</button>

    <div id="version"></div>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestScoreEl = document.getElementById("bestScore");
      const restartBtn = document.getElementById("restartBtn");
      const startBtn = document.getElementById("startBtn");
      const musicBtn = document.getElementById("musicBtn");
      const versionEl = document.getElementById("version");

      const GAME_VERSION = "v1.4.3-smooth";
      versionEl.textContent = GAME_VERSION;

      // ==================== 常用调试参数 ====================

      const size = 32;

      const speed = 160;

      // 波波模式持续时间
      const speedUpDuration = 5000;

      // 波波最高叠加层数
      const maxSpeedLevel = 5;

      // 不同波波层数对应速度
      const speedLevelDelays = [160, 140, 120, 100, 85, 70];

      const eatingDuration = 200;
      const bgMask = 0.35;
      const foodPulseSize = 6;
      const foodPulseSpeed = 0.15;
      const foodGlow = 15;
      const foodStrokeWidth = 4;
      const eatHeadMinScale = 0.95;
      const eatHeadScaleRange = 1.1;

      // 普通模式
      const normalFoodRate = 0.2;
      const boboFoodRate = 0.6;
      const heheziFoodRate = 0.2;

      // 波波模式
      const speedModeNormalRate = 0.25;
      const speedModeBoboRate = 0.2;
      const speedModeHeheziRate = 0.25;
      // 剩下 30% 是 Bob

      const normalFoodCount = 1;
      const speedModeFoodCount = 4;

      const bombLifeTime = 3000;

      // ======================================================

      const count = canvas.width / size;

      const FOOD_NORMAL = "normal";
      const FOOD_SPEED = "speed";
      const FOOD_TRIPLE = "triple";
      const FOOD_BOMB = "bomb";

      const headImg = new Image();
      const headEatImg = new Image();
      const bodyImg = new Image();
      const bgImg = new Image();
      const bgSpeedImg = new Image();
      const bgBombImg = new Image();

      const boboImg = new Image();
      const heheziImg = new Image();
      const xiaobaiImg = new Image();
      const xiaomaoImg = new Image();
      const bobImg = new Image();

      headImg.src = "head.png";
      headEatImg.src = "head_eat.png";
      bodyImg.src = "body.png";
      bgImg.src = "background.jpg";
      bgSpeedImg.src = "background_speed.jpg";
      bgBombImg.src = "background_bomb.jpg";

      boboImg.src = "bobo.png";
      heheziImg.src = "hehezi.png";
      xiaobaiImg.src = "xiaobai.png";
      xiaomaoImg.src = "xiaomao.png";
      bobImg.src = "bob.png";

      const eatSound = new Audio("eat.mp3");
      const gameOverSound = new Audio("gameover.mp3");
      const bgm = new Audio("bgm.mp3");

      bgm.loop = true;
      bgm.volume = 0.4;

      let snake, foods, dir, nextDir, score, gameOver;
      let bodySkins = [];

      let bestScore = localStorage.getItem("bestScore") || 0;
      bestScoreEl.textContent = bestScore;

      let gameStarted = false;
      let animationId = null;
      let moveDelay = speed;
      let lastMoveTime = 0;
      let prevSnake = [];
      let moveProgress = 1;
      let headCurrentAngle = 0;
      let headTargetAngle = 0;
      let eatingStartTime = 0;
      let pulseTime = 0;

      let scorePopups = [];

      let speedModeEndTime = 0;
      let speedLevel = 0;
      let bombGameOver = false;

      function reset() {
        snake = [{ x: 5, y: 5 }];
        bodySkins = [];

        dir = { x: 1, y: 0 };
        nextDir = dir;

        score = 0;
        gameOver = false;
        bombGameOver = false;

        speedModeEndTime = 0;
        speedLevel = 0;

        eatingStartTime = 0;
        foods = [];

        scoreEl.textContent = score;
        restartBtn.style.display = "none";

        setGameLoop(speed);
        fillFoods();

        prevSnake = snake.map((p) => ({ ...p }));
        moveProgress = 1;
        lastMoveTime = performance.now();
        headCurrentAngle = -Math.PI / 2;
        headTargetAngle = -Math.PI / 2;

        if (!animationId) {
          animationId = requestAnimationFrame(gameFrame);
        }
      }

      function setGameLoop(delay) {
        moveDelay = delay;
      }

      function isSpeedMode() {
        return speedLevel > 0 && Date.now() <= speedModeEndTime;
      }

      function getTargetFoodCount() {
        return isSpeedMode() ? speedModeFoodCount : normalFoodCount;
      }

      function randomFoodType() {
        const r = Math.random();

        if (isSpeedMode()) {
          if (r < speedModeNormalRate) return FOOD_NORMAL;
          if (r < speedModeNormalRate + speedModeBoboRate) return FOOD_SPEED;
          if (r < speedModeNormalRate + speedModeBoboRate + speedModeHeheziRate)
            return FOOD_TRIPLE;

          return FOOD_BOMB;
        }

        if (r < normalFoodRate) return FOOD_NORMAL;
        if (r < normalFoodRate + boboFoodRate) return FOOD_SPEED;
        if (r < normalFoodRate + boboFoodRate + heheziFoodRate)
          return FOOD_TRIPLE;

        return FOOD_BOMB;
      }

      function createOneFood() {
        let newFood;

        do {
          newFood = {
            x: Math.floor(Math.random() * count),
            y: Math.floor(Math.random() * count),
            type: randomFoodType(),
            createdAt: Date.now(),
          };
        } while (
          snake.some((p) => p.x === newFood.x && p.y === newFood.y) ||
          foods.some((f) => f.x === newFood.x && f.y === newFood.y)
        );

        return newFood;
      }

      function fillFoods() {
        const targetCount = getTargetFoodCount();

        while (foods.length < targetCount) {
          foods.push(createOneFood());
        }

        while (foods.length > targetCount) {
          foods.pop();
        }
      }

      function removeExpiredBombs() {
        const now = Date.now();

        foods = foods.filter((food) => {
          if (food.type !== FOOD_BOMB) return true;

          return now - food.createdAt <= bombLifeTime;
        });
      }

      function getFoodImage(type) {
        if (type === FOOD_SPEED) return boboImg;
        if (type === FOOD_TRIPLE) return heheziImg;
        if (type === FOOD_BOMB) return bobImg;
        return bodyImg;
      }

      function getBodyImage(type) {
        if (type === "hehezi") return heheziImg;
        if (type === "xiaobai") return xiaobaiImg;
        if (type === "xiaomao") return xiaomaoImg;
        return bodyImg;
      }

      function addScore(value) {
        score += value;
        scoreEl.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          bestScoreEl.textContent = bestScore;
          localStorage.setItem("bestScore", bestScore);
        }
      }

      function startSpeedMode() {
        speedLevel = Math.min(speedLevel + 1, maxSpeedLevel);

        speedModeEndTime =
          Math.max(speedModeEndTime, Date.now()) + speedUpDuration;

        const newDelay =
          speedLevelDelays[speedLevel] || speedLevelDelays[maxSpeedLevel];

        setGameLoop(newDelay);

        fillFoods();
      }

      function checkSpeedModeEnd() {
        if (speedLevel > 0 && Date.now() > speedModeEndTime) {
          speedLevel = 0;
          speedModeEndTime = 0;

          setGameLoop(speed);
          fillFoods();
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp" && nextDir.y !== 1) nextDir = { x: 0, y: -1 };
        if (e.key === "ArrowDown" && nextDir.y !== -1) nextDir = { x: 0, y: 1 };
        if (e.key === "ArrowLeft" && nextDir.x !== 1) nextDir = { x: -1, y: 0 };
        if (e.key === "ArrowRight" && nextDir.x !== -1)
          nextDir = { x: 1, y: 0 };
        if (e.code === "Space" && gameOver) reset();
      });

      startBtn.addEventListener("click", () => {
        startBtn.style.display = "none";
        gameStarted = true;

        bgm.play();
        reset();
      });

      restartBtn.addEventListener("click", () => {
        reset();
      });

      let musicEnabled = true;

      musicBtn.addEventListener("click", () => {
        musicEnabled = !musicEnabled;

        if (musicEnabled) {
          bgm.play();
          musicBtn.textContent = "🔊音乐";
        } else {
          bgm.pause();
          musicBtn.textContent = "🔇静音";
        }
      });

      // ==================== 手机滑动控制 ====================

      let touchStartX = 0;
      let touchStartY = 0;

      document.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();

          const touchMoveX = e.touches[0].clientX;
          const touchMoveY = e.touches[0].clientY;

          const dx = touchMoveX - touchStartX;
          const dy = touchMoveY - touchStartY;

          const minSwipeDistance = 18;

          if (
            Math.abs(dx) < minSwipeDistance &&
            Math.abs(dy) < minSwipeDistance
          ) {
            return;
          }

          if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0 && nextDir.x !== -1) {
              nextDir = { x: 1, y: 0 };
            } else if (dx < 0 && nextDir.x !== 1) {
              nextDir = { x: -1, y: 0 };
            }
          } else {
            if (dy > 0 && nextDir.y !== -1) {
              nextDir = { x: 0, y: 1 };
            } else if (dy < 0 && nextDir.y !== 1) {
              nextDir = { x: 0, y: -1 };
            }
          }

          touchStartX = touchMoveX;
          touchStartY = touchMoveY;
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          e.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          e.preventDefault();

          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;

          const dx = touchEndX - touchStartX;
          const dy = touchEndY - touchStartY;

          const minSwipeDistance = 30;

          if (
            Math.abs(dx) < minSwipeDistance &&
            Math.abs(dy) < minSwipeDistance
          ) {
            return;
          }

          if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0 && nextDir.x !== -1) {
              nextDir = { x: 1, y: 0 };
            } else if (dx < 0 && nextDir.x !== 1) {
              nextDir = { x: -1, y: 0 };
            }
          } else {
            if (dy > 0 && nextDir.y !== -1) {
              nextDir = { x: 0, y: 1 };
            } else if (dy < 0 && nextDir.y !== 1) {
              nextDir = { x: 0, y: -1 };
            }
          }
        },
        { passive: false },
      );

      function drawCircleImage(img, x, y, drawSize = size) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(
          x + drawSize / 2,
          y + drawSize / 2,
          drawSize / 2,
          0,
          Math.PI * 2,
        );
        ctx.clip();
        ctx.drawImage(img, x, y, drawSize, drawSize);
        ctx.restore();
      }

      function playSound(sound) {
        if (!musicEnabled) return;

        sound.currentTime = 0;
        sound.play().catch(() => {});
      }

      function addScorePopup(x, y, text, color = "#ffffff") {
        scorePopups.push({
          x,
          y,
          text,
          color,
          life: 8,
          maxLife: 8,
        });
      }

      function drawBackground() {
        if (bombGameOver) {
          ctx.drawImage(bgBombImg, 0, 0, canvas.width, canvas.height);
        } else if (isSpeedMode()) {
          ctx.drawImage(bgSpeedImg, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        }

        ctx.fillStyle = `rgba(0,0,0,${bgMask})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawFood(food) {
        const foodX = food.x * size;
        const foodY = food.y * size;
        const pulse = Math.sin(pulseTime) * foodPulseSize;
        const foodImg = getFoodImage(food.type);

        ctx.save();

        ctx.shadowColor = food.type === FOOD_BOMB ? "#ff0000" : "#FFD700";
        ctx.shadowBlur = foodGlow;

        ctx.beginPath();
        ctx.arc(
          foodX + size / 2,
          foodY + size / 2,
          size / 2 + pulse,
          0,
          Math.PI * 2,
        );

        ctx.strokeStyle = food.type === FOOD_BOMB ? "#ff3333" : "white";
        ctx.lineWidth = foodStrokeWidth;
        ctx.stroke();

        ctx.restore();

        drawCircleImage(foodImg, foodX, foodY);
      }
      function drawRotatedCircleImage(
        img,
        x,
        y,
        drawSize = size,
        direction = { x: 1, y: 0 },
      ) {
        let angle = 0;
        if (direction.y === 1) angle = 0;
        if (direction.x === -1) angle = Math.PI / 2;
        if (direction.y === -1) angle = Math.PI;
        if (direction.x === 1) angle = -Math.PI / 2;

        ctx.save();

        ctx.translate(x + drawSize / 2, y + drawSize / 2);
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.arc(0, 0, drawSize / 2, 0, Math.PI * 2);
        ctx.clip();

        ctx.drawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);

        ctx.restore();
      }

      function drawRotatedCircleImageByAngle(
        img,
        x,
        y,
        drawSize = size,
        angle = 0,
      ) {
        ctx.save();
        ctx.translate(x + drawSize / 2, y + drawSize / 2);
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.arc(0, 0, drawSize / 2, 0, Math.PI * 2);
        ctx.clip();

        ctx.drawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
        ctx.restore();
      }

      function getAngleByDirection(direction) {
        if (direction.y === 1) return 0;
        if (direction.x === -1) return Math.PI / 2;
        if (direction.y === -1) return Math.PI;
        if (direction.x === 1) return -Math.PI / 2;
        return headCurrentAngle;
      }

      function lerpAngle(current, target, amount) {
        let diff = target - current;

        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        return current + diff * amount;
      }
      function drawPopup(popup) {
        const alpha = popup.life / popup.maxLife;

        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.fillStyle = popup.color;

        ctx.strokeStyle = "#000";

        ctx.lineWidth = 4;

        ctx.font = "bold 22px sans-serif";

        ctx.textAlign = "center";

        ctx.strokeText(popup.text, popup.x + size / 2, popup.y);

        ctx.fillText(popup.text, popup.x + size / 2, popup.y);

        ctx.restore();
      }
      function drawSpeedInfo() {
        if (!isSpeedMode()) return;

        ctx.save();

        ctx.fillStyle = "white";
        ctx.font = "22px sans-serif";
        ctx.textAlign = "left";

        ctx.fillText(`⚡ 波波的鼓励 x${speedLevel}`, 12, 30);

        ctx.restore();
      }

      function gameOverNow(isBomb = false) {
        gameOver = true;
        bombGameOver = isBomb;
        restartBtn.style.display = "inline-block";
        playSound(gameOverSound);
      }

      function updateGameLogic() {
        if (!gameStarted || gameOver) return;

        checkSpeedModeEnd();
        removeExpiredBombs();
        fillFoods();

        dir = nextDir;

        const head = {
          x: snake[0].x + dir.x,
          y: snake[0].y + dir.y,
        };

        if (head.x < 0) head.x = count - 1;
        if (head.x >= count) head.x = 0;
        if (head.y < 0) head.y = count - 1;
        if (head.y >= count) head.y = 0;

        if (snake.some((p) => p.x === head.x && p.y === head.y)) {
          gameOverNow(false);
          return;
        }

        const eatenFood = foods.find((food) => {
          return food.x === head.x && food.y === head.y;
        });

        if (eatenFood && eatenFood.type === FOOD_BOMB) {
          addScorePopup(head.x * size, head.y * size, "危！", "#FF4444");

          setTimeout(() => {
            gameOverNow(true);
          }, 300);

          return;
        }

        snake.unshift(head);

        if (eatenFood) {
          foods = foods.filter((food) => food !== eatenFood);

          eatingStartTime = Date.now();
          playSound(eatSound);

          if (eatenFood.type === FOOD_NORMAL) {
            addScore(1);
            addScorePopup(head.x * size, head.y * size, "+1", "#ffffff");
            bodySkins.push("body");
          }

          if (eatenFood.type === FOOD_SPEED) {
            addScore(1);
            addScorePopup(head.x * size, head.y * size, "⚡加速", "#4FC3F7");
            bodySkins.push("body");
            startSpeedMode();
          }

          if (eatenFood.type === FOOD_TRIPLE) {
            addScore(3);
            addScorePopup(head.x * size, head.y * size, "+3", "#FFD700");
            bodySkins.push("hehezi");
            bodySkins.push("xiaobai");
            bodySkins.push("xiaomao");
          }

          while (snake.length < bodySkins.length + 1) {
            const tail = snake[snake.length - 1];
            snake.push({ x: tail.x, y: tail.y });
          }

          fillFoods();
        } else {
          snake.pop();
        }
      }

      function getRenderPosition(p, prev) {
        let dx = p.x - prev.x;
        let dy = p.y - prev.y;

        if (dx > count / 2) dx -= count;
        if (dx < -count / 2) dx += count;
        if (dy > count / 2) dy -= count;
        if (dy < -count / 2) dy += count;

        let x = prev.x + dx * moveProgress;
        let y = prev.y + dy * moveProgress;

        if (x < 0) x += count;
        if (x >= count) x -= count;
        if (y < 0) y += count;
        if (y >= count) y -= count;

        return { x: x * size, y: y * size };
      }

      function drawGame() {
        drawBackground();

        if (gameOver) {
          ctx.fillStyle = "white";
          ctx.font = "32px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(
            bombGameOver ? "老板来了，游戏结束！" : "熊熊很大，尼吃不下~",
            canvas.width / 2,
            canvas.height / 2 - 30,
          );
          return;
        }

        foods.forEach(drawFood);
        drawSpeedInfo();

        scorePopups.forEach((popup) => {
          drawPopup(popup);
          popup.y -= 0.7;
          popup.life -= 0.8;
        });
        scorePopups = scorePopups.filter((popup) => popup.life > 0);

        snake.forEach((p, index) => {
          const prev = prevSnake[index] || p;
          const pos = getRenderPosition(p, prev);
          const headDirection = {
            x: p.x - prev.x,
            y: p.y - prev.y,
          };
          const x = pos.x;
          const y = pos.y;

          if (index === 0) {
            headTargetAngle = getAngleByDirection(headDirection);
            headCurrentAngle = lerpAngle(
              headCurrentAngle,
              headTargetAngle,
              0.25,
            );

            const elapsed = Date.now() - eatingStartTime;
            const isEating = elapsed < eatingDuration;

            if (isEating) {
              const progress = elapsed / eatingDuration;
              const wave = Math.sin(progress * Math.PI);
              const scale = eatHeadMinScale + wave * eatHeadScaleRange;
              const drawSize = size * scale;
              const offset = (size - drawSize) / 2;

              drawRotatedCircleImageByAngle(
                headEatImg,
                x + offset,
                y + offset,
                drawSize,
                headCurrentAngle,
              );
            } else {
              drawRotatedCircleImageByAngle(
                headImg,
                x,
                y,
                size,
                headCurrentAngle,
              );
            }
          } else {
            const skinType = bodySkins[index - 1] || "body";
            const prevPart = snake[index - 1];

            let bodyDx = prevPart.x - p.x;
            let bodyDy = prevPart.y - p.y;

            if (bodyDx > count / 2) bodyDx -= count;
            if (bodyDx < -count / 2) bodyDx += count;
            if (bodyDy > count / 2) bodyDy -= count;
            if (bodyDy < -count / 2) bodyDy += count;

            const bodyDirection = {
              x: Math.sign(bodyDx),
              y: Math.sign(bodyDy),
            };

            drawRotatedCircleImage(
              getBodyImage(skinType),
              x,
              y,
              size,
              bodyDirection,
            );
          }
        });

        pulseTime += foodPulseSpeed * 0.25;
      }

      function gameFrame(now) {
        if (!gameStarted) {
          animationId = requestAnimationFrame(gameFrame);
          return;
        }

        if (!gameOver && now - lastMoveTime >= moveDelay) {
          prevSnake = snake.map((p) => ({ ...p }));
          updateGameLogic();
          lastMoveTime = now;
          moveProgress = 0;
        }

        moveProgress = Math.min((now - lastMoveTime) / moveDelay, 1);
        drawGame();

        animationId = requestAnimationFrame(gameFrame);
      }

      Promise.all([
        new Promise((resolve) => (headImg.onload = resolve)),
        new Promise((resolve) => (headEatImg.onload = resolve)),
        new Promise((resolve) => (bodyImg.onload = resolve)),
        new Promise((resolve) => (bgImg.onload = resolve)),
        new Promise((resolve) => (bgSpeedImg.onload = resolve)),
        new Promise((resolve) => (bgBombImg.onload = resolve)),
        new Promise((resolve) => (boboImg.onload = resolve)),
        new Promise((resolve) => (heheziImg.onload = resolve)),
        new Promise((resolve) => (xiaobaiImg.onload = resolve)),
        new Promise((resolve) => (xiaomaoImg.onload = resolve)),
        new Promise((resolve) => (bobImg.onload = resolve)),
      ]).then(() => {
        drawBackground();
      });
    </script>
  </body>
</html>
