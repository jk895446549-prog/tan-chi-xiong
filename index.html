<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>打工人生存法则——贪吃经理</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        background: #222;
        color: white;
        text-align: center;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body.gameActive {
        align-items: center;
        justify-content: center;
      }

      body.gameActive #topBar {
        margin-top: 0;
        margin-bottom: 6px;
      }

      #gameShell {
        width: min(92vw, 78vh, 600px);
        max-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #gameArea {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        flex: 0 0 auto;
      }

      canvas {
        background: #111;
        display: block;
        margin: 0 auto;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      button {
        border: none;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #topBar,
      #bottomBar {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #topBar {
        margin-top: 10px;
        margin-bottom: 6px;
        justify-content: center;
      }

      #bottomBar {
        margin-top: 8px;
        margin-bottom: 8px;
        justify-content: center;
        flex-direction: column;
      }

      #scorePanel {
        font-size: 24px;
        font-weight: bold;
      }

      #startHint {
        position: absolute;
        left: 50%;
        top: calc(50% + 54px);
        transform: translateX(-50%);
        width: 86%;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        z-index: 998;
        pointer-events: none;
      }

      #statusBar {
        width: 100%;
        max-width: 100%;
        height: 32px;
        min-height: 32px;
        max-height: 32px;
        padding: 5px 12px;
        margin-bottom: 6px;
        box-sizing: border-box;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.42);
        color: rgba(255, 255, 255, 0.86);
        font-size: 14px;
        font-weight: bold;
        line-height: 22px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.12s linear;
        pointer-events: none;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
      }

      #controlButtons {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #pauseBtn,
      #fullscreenBtn,
      #musicBtn {
        padding: 6px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.4);
        color: white;
      }

      #startBtn,
      #restartBtn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 30px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 12px;
        color: white;
        z-index: 999;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      #startBtn {
        background: #4caf50;
      }

      #startBtn:disabled {
        background: #666;
        cursor: default;
        opacity: 0.85;
      }

      #restartBtn {
        display: none;
        background: #ffb800;
      }

      #loadingOverlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at center,
            rgba(255, 184, 0, 0.18),
            transparent 38%
          ),
          linear-gradient(180deg, #1e1e1e 0%, #101010 100%);
        color: white;
      }

      #loadingCard {
        width: min(82vw, 420px);
        padding: 26px 24px 22px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.42);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      }

      #loadingTitle {
        font-size: 34px;
        font-weight: 900;
        margin-bottom: 10px;
      }

      #loadingText {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.82);
        margin-bottom: 14px;
      }

      #loadingBarWrap {
        width: 100%;
        height: 18px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.16);
        margin-bottom: 12px;
      }

      #loadingBar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4caf50, #ffb800);
        transition: width 0.2s ease;
      }

      #loadingPercent {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      #loadingAssetList {
        display: none;
      }

      .loadingAssetDone {
        color: rgba(144, 238, 144, 0.95);
      }

      .loadingAssetFailed {
        color: rgba(255, 120, 120, 0.95);
      }

      .loadingAssetCurrent {
        color: #ffdf6e;
      }

      #loadingDevTip {
        display: none;
        margin-top: 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.48);
      }

      #version {
        position: fixed;
        right: 10px;
        bottom: 10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        z-index: 9999;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        #gameShell {
          width: min(94vw, 78vh);
        }

        #topBar {
          margin-top: 0;
          margin-bottom: 8px;
        }

        #scorePanel {
          font-size: clamp(18px, 6vw, 30px);
        }

        #statusBar {
          height: 30px;
          min-height: 30px;
          max-height: 30px;
          margin-bottom: 6px;
          font-size: 13px;
          line-height: 20px;
        }

        #controlButtons {
          width: 100%;
          justify-content: center;
        }

        #pauseBtn,
        #fullscreenBtn,
        #musicBtn {
          min-width: 54px;
          min-height: 54px;
          padding: 8px 12px;
          font-size: 16px;
          border-radius: 14px;
          white-space: normal;
        }

        #startHint {
          top: calc(50% + 52px);
          font-size: 14px;
        }
      }

      @media (orientation: landscape) and (max-height: 640px) {
        body {
          align-items: center;
          justify-content: center;
        }

        #gameShell {
          width: 100vw;
          height: 100svh;
          max-height: none;
          box-sizing: border-box;
          padding: 8px 10px;
          display: grid;
          grid-template-columns: min(72vw, calc(100svh - 76px)) auto;
          grid-template-rows: auto min(72vw, calc(100svh - 76px));
          grid-template-areas:
            "top controls"
            "game controls";
          justify-content: center;
          align-content: center;
          align-items: center;
          column-gap: 10px;
          row-gap: 6px;
        }

        #topBar {
          grid-area: top;
          width: 100%;
          margin: 0;
          gap: 16px;
        }

        #scorePanel {
          font-size: clamp(18px, 5vh, 28px);
          line-height: 1;
          white-space: nowrap;
        }

        #gameArea {
          grid-area: game;
          width: min(72vw, calc(100svh - 76px));
          height: min(72vw, calc(100svh - 76px));
        }

        #bottomBar {
          grid-area: controls;
          width: auto;
          margin: 0;
          align-self: center;
          justify-self: center;
          flex-direction: column;
        }

        #statusBar {
          width: 132px;
          max-width: 132px;
          height: 28px;
          min-height: 28px;
          max-height: 28px;
          margin-bottom: 8px;
          padding: 4px 8px;
          font-size: 12px;
          line-height: 20px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        #controlButtons {
          width: auto;
          flex-direction: column;
          justify-content: center;
          gap: 8px;
        }

        #pauseBtn,
        #fullscreenBtn,
        #musicBtn {
          width: 64px;
          min-height: 54px;
          padding: 8px 10px;
          font-size: 15px;
          line-height: 1.25;
          border-radius: 14px;
          white-space: normal;
        }

        #startBtn,
        #restartBtn {
          padding: 12px 26px;
          font-size: 18px;
        }

        #startHint {
          top: calc(50% + 50px);
          font-size: 13px;
          line-height: 1.45;
        }

        #version {
          right: 8px;
          bottom: 6px;
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <div id="gameShell">
      <div id="topBar">
        <div id="scorePanel">
          分数：<span id="score">0</span> 最高分：<span id="bestScore">0</span>
        </div>
      </div>

      <div id="statusBar">☕ 正常上班</div>

      <div id="gameArea">
        <canvas id="game" width="384" height="384"></canvas>
        <button id="startBtn" type="button">开始游戏</button>
        <button id="restartBtn" type="button">重新开始</button>
        <div id="startHint">方向键 / 滑动屏幕控制，P暂停，空格重开</div>
      </div>

      <div id="bottomBar">
        <div id="controlButtons">
          <button id="pauseBtn" type="button">⏸ 暂停</button>
          <button id="fullscreenBtn" type="button">⛶ 全屏</button>
          <button id="musicBtn" type="button">🔇静音</button>
        </div>
      </div>
    </div>

    <div id="loadingOverlay">
      <div id="loadingCard">
        <div id="loadingTitle">👔 打工人生存法则——贪吃经理</div>
        <div id="loadingText">正在加载游戏资源...</div>
        <div id="loadingBarWrap"><div id="loadingBar"></div></div>
        <div id="loadingPercent">0%</div>
        <div id="loadingAssetList"></div>
        <div id="loadingDevTip">开发模式：已开启强制加载延迟</div>
      </div>
    </div>

    <div id="version"></div>

      // ==================== 调试参数 / Game Balance ====================

      const count = canvas.width / size;
      const FOOD_NORMAL = "normal";
      const FOOD_SPEED = "speed"; // 咖啡，加班模式
      const FOOD_TRIPLE = "triple"; // 美女职员，沿用原贺贺子系统
      const FOOD_BOMB = "bomb"; // 老板
      const FOOD_HR = "hr"; // 裁员通知
      const FOOD_AZHU = "azhu"; // 外包组长
      const FOOD_AI = "ai";
      const FOOD_INTERN = "intern";
      const FOOD_DOG = "dog";
      const FOOD_POT = "pot";
      const FOOD_DICE = "dice";

      // ==================== 资源 ====================
      const images = {
        head: loadImage("head.png"),
        headEat: loadImage("head_eat.png"),
        body: loadImage("body.png"),
        bg: loadImage("background.jpg"),
        bgSpeed: loadImage("background_speed.jpg"),
        bgBomb: loadImage("background_bomb.jpg"),
        coffee: loadImage("coffee.png"),
        hehezi: loadImage("hehezi.png"),
        xiaobai: loadImage("xiaobai.png"),
        xiaomao: loadImage("xiaomao.png"),
        bob: loadImage("bob.png"),
        layoff: loadImage("layoff.png"),
        azhu: loadImage("azhu.png"),
        outsource: loadImage("outsource.png"),
        ai: loadImage("ai.png"),
        intern: loadImage("intern.png"),
        dog: loadImage("dog.png"),
        pot: loadImage("pot.png"),
        dice: loadImage("dice.png"),
      };

      const eatSound = new Audio("eat.mp3");
      const gameOverSound = new Audio("gameover.mp3");
      const bgm = new Audio("bgm.mp3");
      bgm.loop = true;
      bgm.volume = 0.4;

      // ==================== 状态 ====================
      let snake = [];
      let prevSnake = [];
      let bodySkins = [];
      let foods = [];
      let score = 0;
      let bestScore = Number(localStorage.getItem("bestScore") || 0);

      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };

      let gameStarted = false;
      let gameOver = false;
      let gamePaused = false;
      let pauseStartTime = 0;
      let bombGameOver = false;
      let deathPending = false;
      let deathStartTime = 0;
      let deathIsBomb = false;
      let musicEnabled = true;
      let assetsLoaded = false;
      musicBtn.textContent = "🔊音乐";

      let animationId = null;
      let moveDelay = speed;
      let lastMoveTime = 0;
      let moveProgress = 1;

      let eatingStartTime = 0;
      let pulseTime = 0;
      let scorePopups = [];
      let teamAbsorbAnimations = [];
      let teamImpactWaves = [];

      let speedModeEndTime = 0;
      let speedLevel = 0;

      let hrModeEndTime = 0;
      let lastHrModeTick = 0;
      let shieldModeEndTime = 0;
      let teamModeEndTime = 0;

      let headCurrentAngle = -Math.PI / 2;
      let headTargetAngle = -Math.PI / 2;

      let touchStartX = 0;
      let touchStartY = 0;
      let directionChangedThisStep = false;
      bestScoreEl.textContent = bestScore;

      // ==================== 初始化 ====================
      function loadImage(src) {
        const img = new Image();
        img.src = src;
        return img;
      }

      function reset() {
        snake = [{ x: 5, y: 5 }];
        prevSnake = snake.map(copyPoint);
        bodySkins = [];
        foods = [];
        scorePopups = [];
        teamAbsorbAnimations = [];
        teamImpactWaves = [];

        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        moveDelay = speed;
        moveProgress = 1;
        lastMoveTime = performance.now();

        score = 0;
        gameOver = false;
        gamePaused = false;
        pauseStartTime = 0;
        updatePauseButton();
        bombGameOver = false;
        deathPending = false;
        deathStartTime = 0;
        deathIsBomb = false;
        speedModeEndTime = 0;
        speedLevel = 0;
        hrModeEndTime = 0;
        lastHrModeTick = 0;
        shieldModeEndTime = 0;
        teamModeEndTime = 0;
        eatingStartTime = 0;
        headCurrentAngle = -Math.PI / 2;
        headTargetAngle = -Math.PI / 2;
        directionChangedThisStep = false;

        scoreEl.textContent = score;
        restartBtn.style.display = "none";
        fillFoods();

        if (!animationId) {
          animationId = requestAnimationFrame(gameFrame);
        }
      }

      async function startGame() {
        if (!assetsLoaded) return;
        if (gameStarted && !gameOver) return;
        startBtn.style.display = "none";
        startHint.style.display = "none";
        document.body.classList.add("gameActive");
        gameStarted = true;
        requestFullscreenIfPossible();
        setTimeout(requestFullscreenIfPossible, 80);
        await requestFullscreenIfPossible();
        bgm.play().catch(() => {});
        reset();
      }

      function restartGame() {
        reset();
      }

      function toggleMusic() {
        musicEnabled = !musicEnabled;
        if (musicEnabled) {
          bgm.play().catch(() => {});
          musicBtn.textContent = "🔊音乐";
        } else {
          bgm.pause();
          musicBtn.textContent = "🔇静音";
        }
      }

      function togglePause() {
        if (!gameStarted || gameOver || deathPending || !assetsLoaded) return;

        gamePaused = !gamePaused;

        if (gamePaused) {
          pauseStartTime = Date.now();
          bgm.pause();
        } else {
          lastMoveTime = performance.now();
          if (musicEnabled) bgm.play().catch(() => {});
        }

        updatePauseButton();
      }

      function updatePauseButton() {
        pauseBtn.textContent = gamePaused ? "▶ 继续" : "⏸ 暂停";
      }

      function getGameTime() {
        return gamePaused ? pauseStartTime : Date.now();
      }

      async function requestFullscreenIfPossible() {
        if (document.fullscreenElement) return;

        try {
          if (document.fullscreenEnabled) {
            await document.documentElement.requestFullscreen();
          }

          if (
            screen.orientation &&
            screen.orientation.lock &&
            window.innerWidth < 900
          ) {
            await screen.orientation.lock("landscape").catch(() => {});
          }
        } catch (e) {
          console.log("全屏请求被浏览器拒绝", e);
        }
      }

      async function toggleFullscreen() {
        if (!document.fullscreenEnabled) return;
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch (e) {
          console.log("全屏切换失败", e);
        }
      }

      function updateFullscreenButton() {
        fullscreenBtn.textContent = document.fullscreenElement
          ? "↙ 退出"
          : "⛶ 全屏";
      }

      // ==================== 输入控制 ====================
      function bindTap(button, handler) {
        button.addEventListener("click", handler);
        button.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            e.stopPropagation();
            handler();
          },
          { passive: false },
        );
      }

      bindTap(startBtn, startGame);
      bindTap(restartBtn, restartGame);
      bindTap(pauseBtn, togglePause);
      bindTap(fullscreenBtn, toggleFullscreen);
      bindTap(musicBtn, toggleMusic);

      if (!document.fullscreenEnabled) {
        fullscreenBtn.style.display = "none";
      }
      document.addEventListener("fullscreenchange", updateFullscreenButton);
      updateFullscreenButton();
      updatePauseButton();

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp") setNextDirection(0, -1);
        if (e.key === "ArrowDown") setNextDirection(0, 1);
        if (e.key === "ArrowLeft") setNextDirection(-1, 0);
        if (e.key === "ArrowRight") setNextDirection(1, 0);
        if (e.code === "Space" && gameOver) restartGame();
        if (e.key === "p" || e.key === "P") togglePause();
      });

      document.addEventListener(
        "touchstart",
        (e) => {
          if (isButtonTouch(e)) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        },
        { passive: true },
      );

      document.addEventListener(
        "touchmove",
        (e) => {
          if (isButtonTouch(e)) return;
          if (!gameStarted || gameOver || deathPending) return;
          e.preventDefault();

          const touchMoveX = e.touches[0].clientX;
          const touchMoveY = e.touches[0].clientY;
          const dx = touchMoveX - touchStartX;
          const dy = touchMoveY - touchStartY;
          const minSwipeDistance = 18;

          if (
            Math.abs(dx) < minSwipeDistance &&
            Math.abs(dy) < minSwipeDistance
          )
            return;

          if (Math.abs(dx) > Math.abs(dy)) {
            setNextDirection(Math.sign(dx), 0);
          } else {
            setNextDirection(0, Math.sign(dy));
          }

          touchStartX = touchMoveX;
          touchStartY = touchMoveY;
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          if (isButtonTouch(e)) return;
          if (gameStarted) e.preventDefault();
        },
        { passive: false },
      );

      function isButtonTouch(e) {
        return Boolean(e.target.closest && e.target.closest("button"));
      }

      function setNextDirection(x, y) {
        if (directionChangedThisStep) return;
        if (x !== 0 && dir.x === -x) return;
        if (y !== 0 && dir.y === -y) return;
        if (x === dir.x && y === dir.y) return;

        nextDir = { x, y };
        directionChangedThisStep = true;
      }

      // ==================== 游戏逻辑 ====================
      function isSpeedMode() {
        return speedLevel > 0 && getGameTime() <= speedModeEndTime;
      }

      function isHrMode() {
        return getGameTime() <= hrModeEndTime;
      }

      function isShieldMode() {
        return getGameTime() <= shieldModeEndTime;
      }

      function isTeamMode() {
        return getGameTime() <= teamModeEndTime;
      }

      function startShieldMode() {
        shieldModeEndTime = getGameTime() + shieldModeDuration;
      }

      function startTeamMode() {
        teamModeEndTime = getGameTime() + teamModeDuration;
      }

      function startHrMode() {
        if (isHrMode()) return;
        hrModeEndTime = getGameTime() + hrModeDuration;
        lastHrModeTick = getGameTime();
      }

      function pauseSpeedModeDuringHr() {
        if (!isHrMode()) {
          lastHrModeTick = 0;
          return;
        }

        if (speedLevel <= 0) return;

        const now = getGameTime();

        if (lastHrModeTick > 0) {
          speedModeEndTime += now - lastHrModeTick;
        }

        lastHrModeTick = now;
      }

      function getScoreMultiplier() {
        return scoreMultipliers[speedLevel] || 1;
      }

      function isMaxSpeedMode() {
        return speedLevel >= maxSpeedLevel && isSpeedMode();
      }

      function getRainbowColor() {
        const hue = (getGameTime() * 0.18) % 360;
        return `hsl(${hue}, 100%, 62%)`;
      }

      function resolveDrawColor(color) {
        return color === "rainbow" ? getRainbowColor() : color;
      }

      function getMultiplierColor() {
        if (isMaxSpeedMode()) return "rainbow";
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreColors[level];
      }

      function getMultiplierFontSize() {
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreFontSizes[level];
      }

      function getTargetFoodCount() {
        if (!isSpeedMode()) return normalFoodCount;

        return (
          speedModeFoodCounts[speedLevel] || speedModeFoodCounts[maxSpeedLevel]
        );
      }

      function randomFoodType() {
        const level = Math.min(Math.max(speedLevel, 0), maxSpeedLevel);
        const rates = stageSpawnRates[level] || stageSpawnRates[0];
        const r = Math.random();
        let t = 0;

        t += rates.normal || 0;
        if (r < t) return FOOD_NORMAL;
        t += rates.coffee || 0;
        if (r < t) return FOOD_SPEED;
        t += rates.triple || 0;
        if (r < t) return FOOD_TRIPLE;
        t += rates.azhu || 0;
        if (r < t) return FOOD_AZHU;
        t += rates.ai || 0;
        if (r < t) return FOOD_AI;
        t += rates.intern || 0;
        if (r < t) return FOOD_INTERN;
        t += rates.dog || 0;
        if (r < t) return FOOD_DOG;
        t += rates.layoff || 0;
        if (r < t) return FOOD_HR;
        t += rates.pot || 0;
        if (r < t) return FOOD_POT;
        t += rates.dice || 0;
        if (r < t) return FOOD_DICE;
        return FOOD_BOMB;
      }

      function createOneFood() {
        let food;
        do {
          const type = randomFoodType();
          const now = getGameTime();
          food = {
            x: Math.floor(Math.random() * count),
            y: Math.floor(Math.random() * count),
            type,
            createdAt:
              type === FOOD_BOMB
                ? now
                : now - Math.random() * foodLifeRandomOffset,
            warningStartedAt: type === FOOD_BOMB ? now : 0,
          };
        } while (isOccupied(food.x, food.y));
        return food;
      }

      function isOccupied(x, y) {
        return (
          snake.some((p) => p.x === x && p.y === y) ||
          foods.some((f) => f.x === x && f.y === y)
        );
      }

      function isEmployeeFood(type) {
        return [
          FOOD_NORMAL,
          FOOD_TRIPLE,
          FOOD_AZHU,
          FOOD_AI,
          FOOD_INTERN,
          FOOD_DOG,
        ].includes(type);
      }

      function isItemFood(type) {
        return [FOOD_SPEED, FOOD_HR, FOOD_POT, FOOD_DICE].includes(type);
      }

      function getEmployeeShrinkCount(type) {
        if (type === FOOD_NORMAL) return 1;
        if (type === FOOD_TRIPLE) return 3;
        if (type === FOOD_AZHU) return azhuBodyCount + outsourceBodyCount;
        if (type === FOOD_AI) return 0;
        if (type === FOOD_INTERN) return 1;
        if (type === FOOD_DOG) return 1;
        return 0;
      }

      function getGridDistance(a, b) {
        const dx = Math.abs(getWrappedDelta(a.x, b.x));
        const dy = Math.abs(getWrappedDelta(a.y, b.y));
        return Math.max(dx, dy);
      }

      function absorbNearbyEmployees() {
        if (!isTeamMode() || snake.length <= 0) return;

        const head = snake[0];
        const nearbyEmployees = foods.filter(
          (food) =>
            !food.removingAt &&
            isEmployeeFood(food.type) &&
            getGridDistance(food, head) <= teamAbsorbRange,
        );

        nearbyEmployees.forEach((food) => {
          foods = foods.filter((f) => f !== food);

          teamAbsorbAnimations.push({
            food,
            fromX: food.x * size,
            fromY: food.y * size,
            startedAt: getGameTime(),
            handled: false,
          });
        });
      }

      function updateTeamAbsorbAnimations() {
        if (teamAbsorbAnimations.length === 0) return;

        teamAbsorbAnimations.forEach((anim) => {
          if (anim.handled) return;

          const elapsed = getGameTime() - anim.startedAt;
          if (elapsed < teamAbsorbDuration) return;

          anim.handled = true;
          handleEatenFood(anim.food, snake[0], true);
          teamImpactWaves.push({
            x: snake[0].x * size + size / 2,
            y: snake[0].y * size + size / 2,
            startedAt: getGameTime(),
          });
          addScorePopup(
            snake[0].x * size,
            snake[0].y * size,
            "团建+",
            teamInfoColor,
            popupFontSize,
            "公司团建",
          );
        });

        teamAbsorbAnimations = teamAbsorbAnimations.filter(
          (anim) => getGameTime() - anim.startedAt < teamAbsorbDuration + 80,
        );
      }

      function drawTeamVacuumEffect() {
        if (!isTeamMode() || snake.length <= 0) return;

        const headPos = getRenderPosition(snake[0], prevSnake[0] || snake[0]);
        const cx = headPos.x + size / 2;
        const cy = headPos.y + size / 2;
        const t = getGameTime() * 0.006;
        const radius =
          teamVacuumRingRadius + Math.sin(t * 2.4) * teamVacuumRingPulse;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t);

        for (let i = 0; i < 3; i++) {
          const r = radius + i * 8;
          const alpha = 0.34 - i * 0.08;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0.25 + i * 0.9, Math.PI * 1.55 + i * 0.9);
          ctx.strokeStyle = `rgba(77, 208, 225, ${alpha})`;
          ctx.lineWidth = 3 - i * 0.45;
          ctx.shadowColor = teamInfoColor;
          ctx.shadowBlur = 9;
          ctx.stroke();
        }

        ctx.rotate(-t * 1.8);
        ctx.beginPath();
        ctx.arc(0, 0, 8 + Math.sin(t * 5) * 2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.34)";
        ctx.shadowColor = teamInfoColor;
        ctx.shadowBlur = 14;
        ctx.fill();

        ctx.restore();
      }

      function drawTeamAbsorbTrail(fromX, fromY, toX, toY, progress) {
        const startX = fromX + size / 2;
        const startY = fromY + size / 2;
        const endX = toX + size / 2;
        const endY = toY + size / 2;

        ctx.save();
        ctx.globalAlpha = Math.max(0.15, 0.7 * (1 - progress * 0.55));
        ctx.strokeStyle = teamInfoColor;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = teamInfoColor;
        ctx.shadowBlur = 8;

        for (let i = 0; i < 3; i++) {
          const offset = (i - 1) * 5;
          const midX =
            (startX + endX) / 2 + Math.sin(progress * Math.PI + i) * 12;
          const midY =
            (startY + endY) / 2 -
            14 -
            i * 4 +
            Math.cos(progress * Math.PI + i) * 6;

          ctx.beginPath();
          ctx.moveTo(startX + offset, startY - offset);
          ctx.quadraticCurveTo(midX, midY, endX, endY);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawTeamImpactWaves() {
        if (teamImpactWaves.length === 0) return;

        teamImpactWaves.forEach((wave) => {
          const progress = Math.min(
            (getGameTime() - wave.startedAt) / teamImpactDuration,
            1,
          );
          const radius = 6 + progress * 22;
          const alpha = 1 - progress;

          ctx.save();
          ctx.globalAlpha = alpha * 0.7;
          ctx.beginPath();
          ctx.arc(wave.x, wave.y, radius, 0, Math.PI * 2);
          ctx.strokeStyle = teamInfoColor;
          ctx.lineWidth = 3;
          ctx.shadowColor = teamInfoColor;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        });

        teamImpactWaves = teamImpactWaves.filter(
          (wave) => getGameTime() - wave.startedAt < teamImpactDuration,
        );
      }

      function drawTeamAbsorbAnimations() {
        drawTeamVacuumEffect();

        if (teamAbsorbAnimations.length === 0 || snake.length <= 0) {
          drawTeamImpactWaves();
          return;
        }

        const headPos = getRenderPosition(snake[0], prevSnake[0] || snake[0]);
        const targetX = headPos.x;
        const targetY = headPos.y;

        teamAbsorbAnimations.forEach((anim) => {
          const elapsed = getGameTime() - anim.startedAt;
          const rawProgress = Math.min(elapsed / teamAbsorbDuration, 1);
          const progress = 1 - Math.pow(1 - rawProgress, 3);
          const arcLift = Math.sin(rawProgress * Math.PI) * 14;

          const x = anim.fromX + (targetX - anim.fromX) * progress;
          const y = anim.fromY + (targetY - anim.fromY) * progress - arcLift;
          const scale = 1 - rawProgress * 0.22;

          drawTeamAbsorbTrail(
            anim.fromX,
            anim.fromY,
            targetX,
            targetY,
            rawProgress,
          );

          ctx.save();
          ctx.globalAlpha = 1 - rawProgress * 0.12;
          ctx.translate(x + size / 2, y + size / 2);
          ctx.scale(scale, scale);
          ctx.rotate(Math.sin(rawProgress * Math.PI) * 0.22);
          drawCircleImage(getFoodImage(anim.food.type), -size / 2, -size / 2);
          ctx.restore();
        });

        drawTeamImpactWaves();
      }

      function getActiveFoodCount() {
        return foods.filter((food) => !food.removingAt).length;
      }

      function fillFoods() {
        const targetCount = getTargetFoodCount();

        if (foods.length < targetCount) {
          while (foods.length < targetCount) {
            foods.push(createOneFood());
          }
        }

        while (getActiveFoodCount() > targetCount) {
          const activeFoods = foods.filter((food) => !food.removingAt);
          markFoodRemoving(activeFoods[activeFoods.length - 1]);
        }
      }

      function markExpiredFoods() {
        const now = getGameTime();

        foods.forEach((food) => {
          if (food.removingAt) return;

          const lifeTime =
            food.type === FOOD_BOMB ? bombLifeTime : normalFoodLifeTime;

          const age = now - food.createdAt;

          if (age >= lifeTime - foodDisappearDuration) {
            markFoodRemoving(food);
          }
        });

        removeFinishedDisappearingFoods();
      }

      function markFoodRemoving(food) {
        if (!food || food.removingAt) return;
        food.removingAt = getGameTime();
      }

      function removeFinishedDisappearingFoods() {
        const now = getGameTime();
        foods = foods.filter(
          (food) =>
            !food.removingAt || now - food.removingAt < foodDisappearDuration,
        );
      }

      function removeTailSegments(count) {
        for (let i = 0; i < count; i++) {
          if (snake.length <= 1) break;
          snake.pop();
        }

        while (bodySkins.length > snake.length - 1) {
          bodySkins.pop();
        }
      }

      function shrinkAfterEating(shrinkCount) {
        removeTailSegments(1 + shrinkCount);
      }

      function addScore(value) {
        score += value;
        scoreEl.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          bestScoreEl.textContent = bestScore;
          localStorage.setItem("bestScore", bestScore);
        }
      }

      function startSpeedMode() {
        speedLevel = Math.min(speedLevel + 1, maxSpeedLevel);
        speedModeEndTime = getGameTime() + getSpeedLevelDuration(speedLevel);
        updateSpeedModeDelay();
        updateModeStatus();
        fillFoods();
      }

      function getSpeedLevelDuration(level) {
        return speedLevelDurations[level] || speedLevelDurations[maxSpeedLevel];
      }

      function checkSpeedModeEnd() {
        if (speedLevel <= 0 || getGameTime() <= speedModeEndTime) return;

        if (speedLevel >= maxSpeedLevel) {
          speedLevel = 0;
        } else {
          speedLevel -= 1;
        }

        if (speedLevel <= 0) {
          speedLevel = 0;
          speedModeEndTime = 0;
          moveDelay = speed;
        } else {
          speedModeEndTime = getGameTime() + getSpeedLevelDuration(speedLevel);
          updateSpeedModeDelay();
        }

        updateModeStatus();
        fillFoods();
      }

      function updateSpeedModeDelay() {
        moveDelay =
          speedLevelDelays[speedLevel] || speedLevelDelays[maxSpeedLevel];
      }

      function updateGameLogic() {
        if (!gameStarted || gameOver || gamePaused) return;

        pauseSpeedModeDuringHr();
        checkSpeedModeEnd();
        markExpiredFoods();
        fillFoods();

        dir = nextDir;
        directionChangedThisStep = false;

        const head = wrapPoint({
          x: snake[0].x + dir.x,
          y: snake[0].y + dir.y,
        });

        const foundFood = foods.find(
          (food) => food.x === head.x && food.y === head.y,
        );

        // 老板淡入预警期内只是危险提示，不会致死，也不会被吃掉。
        const eatenFood =
          foundFood &&
          foundFood.type === FOOD_BOMB &&
          !isBobDangerous(foundFood)
            ? null
            : foundFood;

        // 碰撞检测要放在食物判断之后：
        // 没吃东西时，尾巴这一帧会离开，所以允许蛇头走到当前尾巴格子。
        // 吃到食物时，尾巴不会离开，所以需要检查整条蛇。
        const bodyToCheck = eatenFood ? snake : snake.slice(0, -1);

        if (
          bodyToCheck.some((p) => p.x === head.x && p.y === head.y) &&
          !isShieldMode()
        ) {
          snake.unshift(head);
          if (!eatenFood) snake.pop();
          startDeath(false);
          return;
        }

        if (eatenFood && eatenFood.type === FOOD_BOMB) {
          snake.unshift(head);
          snake.pop();

          if (isShieldMode()) {
            foods = foods.filter((f) => f !== eatenFood);
            addScorePopup(
              head.x * size,
              head.y * size,
              "挡住！",
              shieldInfoColor,
              popupFontSize,
              popupLabelShieldBlock,
            );
            fillFoods();
          } else {
            addScorePopup(
              head.x * size,
              head.y * size,
              "危！",
              "#FF4444",
              popupFontSize,
              getPopupLabel(FOOD_BOMB),
            );
            startDeath(true);
          }

          return;
        }

        snake.unshift(head);

        if (eatenFood) {
          handleEatenFood(eatenFood, head);
        } else {
          snake.pop();
        }

        absorbNearbyEmployees();
      }

      function getPopupLabel(foodType, scoreValue = 0) {
        if (foodType === FOOD_NORMAL) return popupLabelNormal;
        if (foodType === FOOD_TRIPLE) return popupLabelBeauty;
        if (foodType === FOOD_AZHU) return popupLabelOutsource;
        if (foodType === FOOD_AI) return popupLabelAI;
        if (foodType === FOOD_INTERN)
          return scoreValue >= 0 ? popupLabelInternGood : popupLabelInternBad;
        if (foodType === FOOD_DOG) return popupLabelDog;
        if (foodType === FOOD_SPEED) return popupLabelCoffee;
        if (foodType === FOOD_HR) return popupLabelLayoff;
        if (foodType === FOOD_POT) return popupLabelPot;
        if (foodType === FOOD_DICE) return popupLabelDice;
        if (foodType === FOOD_BOMB) return popupLabelBoss;
        return "";
      }

      function handleEatenFood(food, head, fromTeamAbsorb = false) {
        foods = foods.filter((f) => f !== food);
        eatingStartTime = getGameTime();
        playSound(eatSound);

        // 物品：只负责进入状态，不加分、不加身体。
        if (food.type === FOOD_SPEED) {
          startSpeedMode();
          addScorePopup(
            head.x * size,
            head.y * size,
            "☕",
            getMultiplierColor(),
            popupFontSize,
            getPopupLabel(FOOD_SPEED),
          );
          fillFoods();
          return;
        }

        if (food.type === FOOD_HR) {
          startHrMode();
          shrinkAfterEating(hrShrinkOnEat);
          addScorePopup(
            head.x * size,
            head.y * size,
            "📉",
            hrInfoColor,
            popupFontSize,
            getPopupLabel(FOOD_HR),
          );
          fillFoods();
          return;
        }

        if (food.type === FOOD_POT) {
          startShieldMode();
          addScorePopup(
            head.x * size,
            head.y * size,
            "🛡️",
            shieldInfoColor,
            popupFontSize,
            getPopupLabel(FOOD_POT),
          );
          fillFoods();
          return;
        }

        if (food.type === FOOD_DICE) {
          startTeamMode();
          addScorePopup(
            head.x * size,
            head.y * size,
            "🎲",
            teamInfoColor,
            popupFontSize,
            getPopupLabel(FOOD_DICE),
          );
          fillFoods();
          return;
        }

        // 裁员模式：员工不再加分和加身体，而是减少身体。
        if (isHrMode() && isEmployeeFood(food.type)) {
          const shrinkCount = getEmployeeShrinkCount(food.type);
          shrinkAfterEating(shrinkCount);
          addScorePopup(
            head.x * size,
            head.y * size,
            shrinkCount > 0 ? `-${shrinkCount}` : "AI替代",
            hrInfoColor,
            popupFontSize,
            popupLabelLayoffMode,
          );
          fillFoods();
          return;
        }

        const multiplier = getScoreMultiplier();

        if (food.type === FOOD_NORMAL) {
          const point = normalFoodScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_NORMAL),
          );
          bodySkins.push("body");
        }

        if (food.type === FOOD_TRIPLE) {
          const point = heheziScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_TRIPLE),
          );
          bodySkins.push("hehezi", "xiaobai", "xiaomao");
        }

        if (food.type === FOOD_AZHU) {
          const point = azhuScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_AZHU),
          );

          for (let i = 0; i < azhuBodyCount; i++) {
            bodySkins.push("azhu");
          }

          for (let i = 0; i < outsourceBodyCount; i++) {
            bodySkins.push("outsource");
          }
        }

        if (food.type === FOOD_AI) {
          const point = aiScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_AI),
          );
        }

        if (food.type === FOOD_INTERN) {
          const basePoint =
            Math.random() < 0.5 ? internGoodScore : internBadScore;
          const point = basePoint * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            point >= 0 ? `+${point}` : `${point}`,
            point >= 0 ? getMultiplierColor() : "#FF7777",
            getMultiplierFontSize(),
            getPopupLabel(FOOD_INTERN, point),
          );
          bodySkins.push("intern");
        }

        if (food.type === FOOD_DOG) {
          const point = dogScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `${point}`,
            "#FF7777",
            popupFontSize,
            getPopupLabel(FOOD_DOG),
          );
          bodySkins.push("dog");
        }

        while (snake.length < bodySkins.length + 1) {
          const tail = snake[snake.length - 1];
          snake.push(copyPoint(tail));
        }

        fillFoods();
      }

      function startDeath(isBomb = false) {
        if (deathPending || gameOver) return;

        deathPending = true;
        deathStartTime = getGameTime();
        deathIsBomb = isBomb;
        bombGameOver = false;
        restartBtn.style.display = "none";
        playSound(gameOverSound);
      }

      function finishDeath() {
        deathPending = false;
        bombGameOver = deathIsBomb;
        gameOver = true;
        restartBtn.style.display = "inline-block";
      }

      function gameOverNow(isBomb = false) {
        bombGameOver = isBomb;
        finishDeath();
      }

      // ==================== 绘制 ====================
      function drawGame() {
        drawBackground();

        if (gameOver) {
          drawGameOverText();
          return;
        }

        updateTeamAbsorbAnimations();
        foods.forEach(drawFood);
        updateModeStatus();
        drawSnake();
        drawShieldEffect();
        drawTeamAbsorbAnimations();
        drawScorePopups();

        if (gamePaused) {
          drawPauseOverlay();
          return;
        }

        if (deathPending) {
          drawDeathOverlay();

          if (getGameTime() - deathStartTime >= deathFreezeTime) {
            finishDeath();
          }

          return;
        }

        pulseTime += foodPulseSpeed * 0.25;
      }

      function drawBackground() {
        const bg = bombGameOver
          ? images.bgBomb
          : isSpeedMode()
            ? images.bgSpeed
            : images.bg;
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = `rgba(0,0,0,${bgMask})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawGameOverText() {
        ctx.fillStyle = "white";
        ctx.font = "32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          bombGameOver ? "" : "队伍不好带啊~",
          canvas.width / 2,
          canvas.height / 2 - 30,
        );
      }

      function drawDeathOverlay() {
        const elapsed = getGameTime() - deathStartTime;
        const progress = Math.min(elapsed / deathFreezeTime, 1);
        const alpha = deathOverlayMaxAlpha * progress;

        ctx.save();
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function drawPauseOverlay() {
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("已暂停", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "16px sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.fillText(
          "点击继续按钮恢复游戏",
          canvas.width / 2,
          canvas.height / 2 + 24,
        );
        ctx.restore();
      }

      function getDeathShakeOffset() {
        if (!deathPending) return { x: 0, y: 0 };

        const elapsed = getGameTime() - deathStartTime;
        if (elapsed > deathShakeDuration) return { x: 0, y: 0 };

        const strength =
          deathShakeStrength * (1 - elapsed / deathShakeDuration);
        return {
          x: (Math.random() * 2 - 1) * strength,
          y: (Math.random() * 2 - 1) * strength,
        };
      }

      function drawFood(food) {
        const x = food.x * size;
        const y = food.y * size;
        const pulse = Math.sin(pulseTime) * foodPulseSize;
        const alpha = getFoodAlpha(food);
        const ringColor = resolveDrawColor(getFoodRingColor(food));

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = ringColor;
        ctx.shadowBlur = foodGlow;
        ctx.beginPath();
        ctx.arc(x + size / 2, y + size / 2, size / 2 + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = foodStrokeWidth;
        ctx.stroke();
        drawCircleImage(getFoodImage(food.type), x, y);
        ctx.restore();
      }

      function getFoodRingColor(food) {
        if (food.type === FOOD_BOMB)
          return isShieldMode() ? shieldInfoColor : "#FF4444";
        if (food.type === FOOD_HR) return hrInfoColor;
        if (food.type === FOOD_POT) return shieldInfoColor;
        if (food.type === FOOD_DICE) return teamInfoColor;
        if (food.type === FOOD_SPEED) return getMultiplierColor();
        if (isHrMode() && isEmployeeFood(food.type)) return hrInfoColor;
        return getMultiplierColor();
      }

      function getFoodAlpha(food) {
        let alpha = 1;

        if (food.type === FOOD_BOMB) {
          alpha *= getBobWarningAlpha(food);
        }

        if (!food.removingAt) return alpha;

        const elapsed = getGameTime() - food.removingAt;
        const fadeAlpha = Math.max(
          1 - elapsed / foodDisappearDuration,
          foodMinAlpha,
        );
        const blinkOn = Math.floor(getGameTime() / foodBlinkSpeed) % 2 === 0;
        return alpha * (blinkOn ? fadeAlpha : foodMinAlpha);
      }

      function getBobWarningAlpha(food) {
        if (food.type !== FOOD_BOMB) return 1;

        const elapsed =
          getGameTime() - (food.warningStartedAt || food.createdAt);
        const progress = Math.min(elapsed / bobWarningDuration, 1);
        return bobWarningMinAlpha + (1 - bobWarningMinAlpha) * progress;
      }

      function isBobDangerous(food) {
        if (!food || food.type !== FOOD_BOMB) return false;
        return (
          getGameTime() - (food.warningStartedAt || food.createdAt) >=
          bobWarningDuration
        );
      }

      function getWorkStageName(level) {
        if (level === 1) return "☕ 提提神";
        if (level === 2) return "🔥 轻度加班";
        if (level === 3) return "🔥 中度加班";
        if (level === 4) return "🔥 疯狂加班";
        if (level >= 5) return "🌈 通宵爆肝";
        return "☕ 正常上班";
      }

      function getWorkStageShortName(level) {
        if (level === 1) return "☕提神";
        if (level === 2) return "🔥轻";
        if (level === 3) return "🔥中";
        if (level === 4) return "🔥疯";
        if (level >= 5) return "🌈通宵";
        return "☕正常";
      }

      function updateModeStatus() {
        if (!statusBar) return;

        const fullParts = [];
        const shortParts = [];
        let color = "rgba(255, 255, 255, 0.78)";

        if (isSpeedMode()) {
          const remain = Math.max(
            0,
            Math.ceil((speedModeEndTime - getGameTime()) / 1000),
          );
          const multiplier = getScoreMultiplier();
          const stageName = getWorkStageName(speedLevel);
          const shortName = getWorkStageShortName(speedLevel);

          fullParts.push(`${stageName} 工资×${multiplier} ${remain}s`);
          shortParts.push(`${shortName}×${multiplier} ${remain}s`);

          if (isMaxSpeedMode()) {
            color = getRainbowColor();
          } else {
            color = resolveDrawColor(getMultiplierColor());
          }
        }

        if (isShieldMode()) {
          const remain = Math.max(
            0,
            Math.ceil((shieldModeEndTime - getGameTime()) / 1000),
          );
          fullParts.push(`🛡️ 背锅中 ${remain}s`);
          shortParts.push(`🛡️${remain}s`);
          if (!isSpeedMode()) color = shieldInfoColor;
        }

        if (isTeamMode()) {
          const remain = Math.max(
            0,
            Math.ceil((teamModeEndTime - getGameTime()) / 1000),
          );
          fullParts.push(`🎲 团建中 ${remain}s`);
          shortParts.push(`🎲${remain}s`);
          if (!isSpeedMode() && !isShieldMode()) color = teamInfoColor;
        }

        if (isHrMode()) {
          const remain = Math.max(
            0,
            Math.ceil((hrModeEndTime - getGameTime()) / 1000),
          );
          fullParts.push(`📉 裁员中 ${remain}s`);
          shortParts.push(`📉${remain}s`);
          if (!isSpeedMode() && !isShieldMode() && !isTeamMode())
            color = hrInfoColor;
        }

        if (fullParts.length === 0) {
          fullParts.push("☕ 正常上班");
          shortParts.push("☕ 正常");
        }

        const fullText = fullParts.join("  ");
        const shortText = shortParts.join("  ");
        statusBar.textContent = fullText;

        requestAnimationFrame(() => {
          if (!statusBar) return;
          statusBar.textContent = fullText;
          if (statusBar.scrollWidth > statusBar.clientWidth) {
            statusBar.textContent = shortText;
          }
        });

        statusBar.style.color = color;
      }

      function drawScorePopups() {
        scorePopups.forEach((popup) => {
          drawPopup(popup);
          popup.y -= popupRiseSpeed;
          popup.life -= 0.8;
        });
        scorePopups = scorePopups.filter((popup) => popup.life > 0);
      }

      function drawShieldEffect() {
        if (!isShieldMode() || snake.length <= 0) return;

        const remain = shieldModeEndTime - getGameTime();
        const isWarning = remain <= shieldWarningTime;
        const blink = isWarning
          ? Math.floor(getGameTime() / 120) % 2 === 0
          : true;

        if (!blink) return;

        const headPos = getRenderPosition(snake[0], prevSnake[0] || snake[0]);
        const cx = headPos.x + size / 2;
        const cy = headPos.y + size / 2;
        const t = getGameTime() * 0.007;
        const radius = shieldRingRadius + Math.sin(t * 2.5) * shieldRingPulse;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t);

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.strokeStyle = isWarning
          ? "rgba(52, 226, 122, 0.95)"
          : "rgba(52, 226, 122, 0.68)";
        ctx.lineWidth = isWarning ? 4 : 3;
        ctx.shadowColor = shieldInfoColor;
        ctx.shadowBlur = isWarning ? 22 : 14;
        ctx.stroke();

        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(
            0,
            0,
            radius + 4,
            i * Math.PI * 0.5 + 0.12,
            i * Math.PI * 0.5 + 0.55,
          );
          ctx.strokeStyle = "rgba(180,255,205,0.72)";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawSnake() {
        const shake = getDeathShakeOffset();

        snake.forEach((p, index) => {
          const prev = prevSnake[index] || p;
          const pos = getRenderPosition(p, prev);
          const x = pos.x + shake.x;
          const y = pos.y + shake.y;

          if (index === 0) {
            drawHead(x, y, getDirectionFromTo(prev, p));
          } else {
            drawBodyPart(p, index, x, y);
          }
        });
      }

      function drawHead(x, y, direction) {
        headTargetAngle = getAngleByDirection(direction);
        headCurrentAngle = lerpAngle(headCurrentAngle, headTargetAngle, 0.25);

        const elapsed = getGameTime() - eatingStartTime;
        const isEating = elapsed < eatingDuration;
        const img = isEating ? images.headEat : images.head;
        let drawSize = size;
        let offset = 0;

        if (isEating) {
          const progress = elapsed / eatingDuration;
          const wave = Math.sin(progress * Math.PI);
          drawSize = size * (eatHeadMinScale + wave * eatHeadScaleRange);
          offset = (size - drawSize) / 2;
        }

        if (isMaxSpeedMode()) {
          ctx.save();
          ctx.shadowColor = getRainbowColor();
          ctx.shadowBlur = 25;
          drawRotatedCircleImageByAngle(
            img,
            x + offset,
            y + offset,
            drawSize,
            headCurrentAngle,
          );
          ctx.restore();
          return;
        }

        drawRotatedCircleImageByAngle(
          img,
          x + offset,
          y + offset,
          drawSize,
          headCurrentAngle,
        );
      }

      function drawBodyPart(p, index, x, y) {
        const skinType = bodySkins[index - 1] || "body";
        const prevPart = snake[index - 1];
        const direction = getDirectionFromTo(p, prevPart);
        drawRotatedCircleImage(getBodyImage(skinType), x, y, size, direction);
      }

      function drawCircleImage(img, x, y, drawSize = size) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(
          x + drawSize / 2,
          y + drawSize / 2,
          drawSize / 2,
          0,
          Math.PI * 2,
        );
        ctx.clip();
        ctx.drawImage(img, x, y, drawSize, drawSize);
        ctx.restore();
      }

      function drawRotatedCircleImage(
        img,
        x,
        y,
        drawSize = size,
        direction = { x: 1, y: 0 },
      ) {
        drawRotatedCircleImageByAngle(
          img,
          x,
          y,
          drawSize,
          getAngleByDirection(direction),
        );
      }

      function drawRotatedCircleImageByAngle(
        img,
        x,
        y,
        drawSize = size,
        angle = 0,
      ) {
        ctx.save();
        ctx.translate(x + drawSize / 2, y + drawSize / 2);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.arc(0, 0, drawSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
        ctx.restore();
      }

      function drawPopup(popup) {
        const alpha = popup.life / popup.maxLife;
        const ageProgress = 1 - alpha;
        const popScale = 0.82 + 0.18 * Math.min(ageProgress / 0.18, 1);
        const x = popup.x + size / 2;
        const y = popup.y + popupYOffset;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.scale(popScale, popScale);

        ctx.fillStyle = resolveDrawColor(popup.color);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = popupStrokeWidth;
        ctx.font = `bold ${popup.fontSize || popupFontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.strokeText(popup.text, 0, 0);
        ctx.fillText(popup.text, 0, 0);

        if (popup.subText) {
          ctx.globalAlpha = alpha * popupSubTextAlpha;
          ctx.fillStyle = popupSubTextColor;
          ctx.strokeStyle = "rgba(0,0,0,0.85)";
          ctx.lineWidth = Math.max(2, popupStrokeWidth - 2);
          ctx.font = `bold ${popupSubTextFontSize}px sans-serif`;
          ctx.strokeText(popup.subText, 0, popupSubTextOffsetY);
          ctx.fillText(popup.subText, 0, popupSubTextOffsetY);
        }

        ctx.restore();
      }

      function addScorePopup(
        x,
        y,
        text,
        color = "#ffffff",
        fontSize = popupFontSize,
        subText = "",
      ) {
        scorePopups.push({
          x,
          y,
          text,
          subText,
          color,
          fontSize,
          life: popupLife,
          maxLife: popupLife,
        });
      }

      // ==================== 工具函数 ====================
      function copyPoint(p) {
        return { x: p.x, y: p.y };
      }

      function wrapPoint(p) {
        return {
          x: (p.x + count) % count,
          y: (p.y + count) % count,
        };
      }

      function getWrappedDelta(to, from) {
        let d = to - from;
        if (d > count / 2) d -= count;
        if (d < -count / 2) d += count;
        return d;
      }

      function getDirectionFromTo(from, to) {
        const dx = getWrappedDelta(to.x, from.x);
        const dy = getWrappedDelta(to.y, from.y);
        return { x: Math.sign(dx), y: Math.sign(dy) };
      }

      function getRenderPosition(p, prev) {
        const dx = getWrappedDelta(p.x, prev.x);
        const dy = getWrappedDelta(p.y, prev.y);
        let x = prev.x + dx * moveProgress;
        let y = prev.y + dy * moveProgress;

        if (x < 0) x += count;
        if (x >= count) x -= count;
        if (y < 0) y += count;
        if (y >= count) y -= count;

        return { x: x * size, y: y * size };
      }

      function getAngleByDirection(direction) {
        if (direction.y === 1) return 0;
        if (direction.x === -1) return Math.PI / 2;
        if (direction.y === -1) return Math.PI;
        if (direction.x === 1) return -Math.PI / 2;
        return headCurrentAngle;
      }

      function lerpAngle(current, target, amount) {
        let diff = target - current;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        return current + diff * amount;
      }

      function getFoodImage(type) {
        if (type === FOOD_SPEED) return images.coffee;
        if (type === FOOD_TRIPLE) return images.hehezi;
        if (type === FOOD_BOMB) return images.bob;
        if (type === FOOD_HR) return images.layoff;
        if (type === FOOD_AZHU) return images.azhu;
        if (type === FOOD_AI) return images.ai;
        if (type === FOOD_INTERN) return images.intern;
        if (type === FOOD_DOG) return images.dog;
        if (type === FOOD_POT) return images.pot;
        if (type === FOOD_DICE) return images.dice;
        return images.body;
      }

      function getBodyImage(type) {
        if (type === "hehezi") return images.hehezi;
        if (type === "xiaobai") return images.xiaobai;
        if (type === "xiaomao") return images.xiaomao;
        if (type === "azhu") return images.azhu;
        if (type === "outsource") return images.outsource;
        if (type === "intern") return images.intern;
        if (type === "dog") return images.dog;
        return images.body;
      }

      function playSound(sound) {
        if (!musicEnabled) return;
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }

      // ==================== 动画循环 ====================
      function gameFrame(now) {
        if (
          gameStarted &&
          !gameOver &&
          !deathPending &&
          !gamePaused &&
          now - lastMoveTime >= moveDelay
        ) {
          prevSnake = snake.map(copyPoint);
          updateGameLogic();
          lastMoveTime = now;
          moveProgress = 0;
        }

        if (gamePaused) {
          moveProgress = moveProgress;
        } else if (deathPending) {
          moveProgress = Math.min(
            ((now - lastMoveTime) / moveDelay) * deathSlowMotionScale,
            1,
          );
        } else {
          moveProgress = Math.min((now - lastMoveTime) / moveDelay, 1);
        }

        if (gameStarted) drawGame();
        animationId = requestAnimationFrame(gameFrame);
      }

      // ==================== 资源加载 ====================
      const assetLoadingTips = {
        head: "整理领带中",
        headEat: "正在练习微笑",
        body: "员工打卡中",
        hehezi: "员工打卡中",
        xiaobai: "员工打卡中",
        xiaomao: "员工打卡中",
        azhu: "员工打卡中",
        outsource: "员工打卡中",
        ai: "员工打卡中",
        intern: "员工打卡中",
        dog: "员工打卡中",
        bg: "正在打扫工位",
        bgSpeed: "正在开灯",
        bgBomb: "咖啡机预热中",
        coffee: "咖啡机预热中",
        pot: "正在进行心理建设",
        dice: "整理桌游",
        layoff: "打印机连接中",
        bob: "咖啡机预热中",
      };

      function getLoadingTip(assetKey) {
        return assetLoadingTips[assetKey] || "正在整理办公桌";
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function drawLoadingScreen(progress, currentTip = "") {
        ctx.save();
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(255,184,0,0.12)";
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2 - 30, 115, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          "打工人生存法则",
          canvas.width / 2,
          canvas.height / 2 - 68,
        );
        ctx.font = "bold 24px sans-serif";
        ctx.fillText("贪吃经理", canvas.width / 2, canvas.height / 2 - 42);

        ctx.font = "16px sans-serif";
        ctx.fillText(
          currentTip || "正在整理办公桌",
          canvas.width / 2,
          canvas.height / 2 - 16,
        );

        const barX = 72;
        const barY = canvas.height / 2 + 4;
        const barW = canvas.width - barX * 2;
        const barH = 14;
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        roundRect(barX, barY, barW, barH, 7);
        ctx.fill();
        ctx.fillStyle = "#ffb800";
        roundRect(barX, barY, barW * (progress / 100), barH, 7);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(`${progress}%`, canvas.width / 2, canvas.height / 2 + 45);

        if (currentTip) {
          ctx.font = "12px sans-serif";
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fillText(
            "请稍等，员工马上到岗",
            canvas.width / 2,
            canvas.height / 2 + 68,
          );
        }

        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function updateLoadingUI(progress, assetKey = "") {
        const tip =
          progress >= 100 ? "全员到岗，准备开工！" : getLoadingTip(assetKey);

        startBtn.textContent = `资源加载中 ${progress}%`;
        loadingBar.style.width = `${progress}%`;
        loadingPercent.textContent = `${progress}%`;
        loadingText.textContent = tip;
        loadingAssetList.innerHTML = "";
        drawLoadingScreen(progress, tip);
      }

      function preloadImages() {
        const imageList = Object.entries(images);
        const total = imageList.length;
        const assetStates = {};
        let loaded = 0;

        updateLoadingUI(0, "");

        return Promise.all(
          imageList.map(
            ([name, img]) =>
              new Promise((resolve) => {
                assetStates[name] = "current";
                updateLoadingUI(Math.round((loaded / total) * 100), name);

                function finish(success) {
                  loaded += 1;
                  assetStates[name] = success ? "done" : "failed";
                  const progress = Math.round((loaded / total) * 100);
                  updateLoadingUI(progress, name);
                  resolve();
                }

                if (img.complete && img.naturalWidth > 0) {
                  finish(true);
                  return;
                }

                img.onload = () => finish(true);
                img.onerror = () => {
                  console.warn(`图片加载失败: ${name}`, img.src);
                  finish(false);
                };
              }),
          ),
        );
      }

      preloadImages().then(async () => {
        updateLoadingUI(100);

        if (DEBUG_LOADING) {
          await sleep(DEBUG_LOADING_DELAY);
        } else {
          await sleep(350);
        }

        assetsLoaded = true;
        startBtn.disabled = false;
        startBtn.textContent = "开始游戏";
        loadingOverlay.style.display = "none";
        drawBackground();
      });
    </script>
  </body>
</html>
