<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>贪吃熊</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #222;
        color: white;
        text-align: center;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }

      canvas {
        background: #111;
        display: block;
        margin: 8px auto 0;
        width: min(92vw, 78vh, 600px);
        height: min(92vw, 78vh, 600px);
        touch-action: none;
      }

      button {
        border: none;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #topBar,
      #bottomBar {
        width: min(92vw, 78vh, 600px);
        margin-left: auto;
        margin-right: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #topBar {
        margin-top: 10px;
        margin-bottom: 6px;
      }

      #bottomBar {
        margin-top: 8px;
        margin-bottom: 8px;
      }

      #gameTitle {
        font-size: 34px;
        font-weight: bold;
      }

      #scorePanel {
        font-size: 24px;
        font-weight: bold;
      }

      #controlTips {
        font-size: 16px;
      }

      #musicBtn {
        padding: 6px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.4);
        color: white;
      }

      #startBtn,
      #restartBtn {
        position: fixed;
        left: 50%;
        top: 62%;
        transform: translate(-50%, -50%);
        padding: 14px 30px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 12px;
        color: white;
        z-index: 999;
      }

      #startBtn {
        background: #4caf50;
      }

      #restartBtn {
        display: none;
        background: #ffb800;
      }

      #version {
        position: fixed;
        right: 10px;
        bottom: 10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        z-index: 9999;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="topBar">
      <div id="gameTitle">贪吃熊</div>
      <div id="scorePanel">
        分数：<span id="score">0</span> 最高分：<span id="bestScore">0</span>
      </div>
    </div>

    <canvas id="game" width="384" height="384"></canvas>

    <div id="bottomBar">
      <div id="controlTips">方向键，滑动屏幕控制，空格重开</div>
      <button id="musicBtn" type="button">🔇静音</button>
    </div>

    <button id="startBtn" type="button">开始游戏</button>
    <button id="restartBtn" type="button">重新开始</button>
    <div id="version"></div>

    <script>
      const GAME_VERSION = "v1.5.3d";

      // ==================== 调试参数 / Game Balance ====================

      // 地图
      const size = 32; // 单格大小(px)

      // 游戏节奏
      const speed = 200; // 普通速度，越小越快
      const speedUpDuration = 3000; // 波波持续时间(ms)
      const maxSpeedModeTime = 6000; // 波波模式最多剩余10秒
      const maxSpeedLevel = 5; // 最大加速层数
      const speedLevelDelays = [200, 190, 180, 160, 130, 100]; // 每层速度
      const scoreMultipliers = [1, 1, 2, 2, 3, 3]; // 得分倍率：第0项普通，1~5项波波层数
      const speedInfoFontSize = 12; // 波波提示字体大小

      // HR裁员模式
      const hrModeDuration = 5000; // 裁员模式持续时间(ms)
      const hrShrinkOnEat = 0; // 吃到HR时立即减少的身体长度
      const hrShrinkNormal = 1; // 裁员模式吃普通食物减少长度
      const hrShrinkBobo = 1; // 裁员模式吃波波减少长度
      const hrShrinkHehezi = 3; // 裁员模式吃贺贺子减少长度
      const hrShrinkHr = 1; // 裁员模式再次吃HR减少长度，不延长时间
      const hrInfoColor = "#B388FF"; // HR裁员提示颜色

      // 阿朱食物
      const azhuScore = 3; // 阿朱基础得分
      const azhuBodyCount = 1; // 吃阿朱增加几个阿朱身体
      const outsourceBodyCount = 5; // 吃阿朱增加几个外包身体

      // 死亡反馈
      const deathFreezeTime = 2000; // 死亡后冻结停留时间(ms)
      const deathSlowMotionScale = 0.35; // 死亡瞬间慢动作比例，越小越慢
      const deathOverlayMaxAlpha = 1.0; // 死亡黑色遮罩最大透明度
      const deathShakeDuration = 450; // 撞击后身体震动时长(ms)
      const deathShakeStrength = 4; // 身体震动强度(px)

      // 食物概率（普通模式）

      const normalFoodRate = 0.3; // 普通
      const heheziFoodRate = 0.15; // 贺贺子
      const azhuFoodRate = 0.1; // 阿朱
      const boboFoodRate = 0.25; // 波波
      const hrFoodRate = 0.05; // HR，进入裁员模式
      // Bob = 0.15

      // 食物概率（波波模式）
      const speedModeNormalRate = 0.15; // 普通
      const speedModeHeheziRate = 0.1; // 贺贺子
      const speedModeAzhuRate = 0.05; // 阿朱
      const speedModeBoboRate = 0.3; // 波波
      const speedModeHrRate = 0.1; // HR
      // Bob = 0.3

      // 食物数量
      const normalFoodCount = 3; // 普通模式食物数量
      const speedModeFoodCounts = [3, 4, 6, 8, 10, 15]; // 第0项普通，1~5项波波层数

      // 食物消失
      const foodLifeRandomOffset = 5000; // 食物出生时间随机偏移，避免一起消失
      const bombLifeTime = 6000; // Bob存活时间(ms)
      const normalFoodLifeTime = 12000; // 普通食物存在时间(ms)
      const foodDisappearDuration = 800; // 消失动画时长(ms)
      const foodBlinkSpeed = 160; // 闪烁速度
      const foodMinAlpha = 0.15; // 最低透明度

      // 吃东西动画
      const eatingDuration = 200; // 动画时长(ms)
      const eatHeadMinScale = 0.95; // 最小缩放
      const eatHeadScaleRange = 1.1; // 最大放大倍率

      // 食物光效
      const bgMask = 0.35; // 背景遮罩
      const foodPulseSize = 6; // 呼吸幅度
      const foodPulseSpeed = 0.15; // 呼吸速度
      const foodGlow = 15; // 发光强度
      const foodStrokeWidth = 4; // 外圈粗细

      // 飘字
      const popupLife = 80; // 持续时间
      const popupRiseSpeed = 0.7; // 上升速度
      const popupFontSize = 22; // 字体大小
      const popupStrokeWidth = 4; // 描边粗细
      const popupYOffset = 0; // Y轴偏移
      const popupScoreColors = [
        "#FFFFFF",
        "#FFFFFF",
        "#4FC3F7",
        "#4FC3F7",
        "#FFD700",
        "#FFD700",
      ];
      const popupScoreFontSizes = [22, 22, 28, 28, 32, 32];

      // ==================== DOM ====================
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestScoreEl = document.getElementById("bestScore");
      const restartBtn = document.getElementById("restartBtn");
      const startBtn = document.getElementById("startBtn");
      const musicBtn = document.getElementById("musicBtn");
      const versionEl = document.getElementById("version");
      versionEl.textContent = GAME_VERSION;

      // ==================== 常量 ====================
      const count = canvas.width / size;
      const FOOD_NORMAL = "normal";
      const FOOD_SPEED = "speed";
      const FOOD_TRIPLE = "triple";
      const FOOD_BOMB = "bomb";
      const FOOD_HR = "hr";
      const FOOD_AZHU = "azhu";

      // ==================== 资源 ====================
      const images = {
        head: loadImage("head.png"),
        headEat: loadImage("head_eat.png"),
        body: loadImage("body.png"),
        bg: loadImage("background.jpg"),
        bgSpeed: loadImage("background_speed.jpg"),
        bgBomb: loadImage("background_bomb.jpg"),
        bobo: loadImage("bobo.png"),
        hehezi: loadImage("hehezi.png"),
        xiaobai: loadImage("xiaobai.png"),
        xiaomao: loadImage("xiaomao.png"),
        bob: loadImage("bob.png"),
        hr: loadImage("hr.png"),
        azhu: loadImage("azhu.png"),
        outsource: loadImage("outsource.png"),
      };

      const eatSound = new Audio("eat.mp3");
      const gameOverSound = new Audio("gameover.mp3");
      const bgm = new Audio("bgm.mp3");
      bgm.loop = true;
      bgm.volume = 0.4;

      // ==================== 状态 ====================
      let snake = [];
      let prevSnake = [];
      let bodySkins = [];
      let foods = [];
      let score = 0;
      let bestScore = Number(localStorage.getItem("bestScore") || 0);

      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };

      let gameStarted = false;
      let gameOver = false;
      let bombGameOver = false;
      let deathPending = false;
      let deathStartTime = 0;
      let deathIsBomb = false;
      let musicEnabled = true;
      musicBtn.textContent = "🔊音乐";

      let animationId = null;
      let moveDelay = speed;
      let lastMoveTime = 0;
      let moveProgress = 1;

      let eatingStartTime = 0;
      let pulseTime = 0;
      let scorePopups = [];

      let speedModeEndTime = 0;
      let speedLevel = 0;

      let hrModeEndTime = 0;
      let lastHrModeTick = 0;

      let headCurrentAngle = -Math.PI / 2;
      let headTargetAngle = -Math.PI / 2;

      let touchStartX = 0;
      let touchStartY = 0;
      let directionChangedThisStep = false;
      bestScoreEl.textContent = bestScore;

      // ==================== 初始化 ====================
      function loadImage(src) {
        const img = new Image();
        img.src = src;
        return img;
      }

      function reset() {
        snake = [{ x: 5, y: 5 }];
        prevSnake = snake.map(copyPoint);
        bodySkins = [];
        foods = [];
        scorePopups = [];

        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        moveDelay = speed;
        moveProgress = 1;
        lastMoveTime = performance.now();

        score = 0;
        gameOver = false;
        bombGameOver = false;
        deathPending = false;
        deathStartTime = 0;
        deathIsBomb = false;
        speedModeEndTime = 0;
        speedLevel = 0;
        hrModeEndTime = 0;
        lastHrModeTick = 0;
        eatingStartTime = 0;
        headCurrentAngle = -Math.PI / 2;
        headTargetAngle = -Math.PI / 2;
        directionChangedThisStep = false;

        scoreEl.textContent = score;
        restartBtn.style.display = "none";
        fillFoods();

        if (!animationId) {
          animationId = requestAnimationFrame(gameFrame);
        }
      }

      function startGame() {
        if (gameStarted && !gameOver) return;
        startBtn.style.display = "none";
        gameStarted = true;
        bgm.play().catch(() => {});
        reset();
      }

      function restartGame() {
        reset();
      }

      function toggleMusic() {
        musicEnabled = !musicEnabled;
        if (musicEnabled) {
          bgm.play().catch(() => {});
          musicBtn.textContent = "🔊音乐";
        } else {
          bgm.pause();
          musicBtn.textContent = "🔇静音";
        }
      }

      // ==================== 输入控制 ====================
      function bindTap(button, handler) {
        button.addEventListener("click", handler);
        button.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            e.stopPropagation();
            handler();
          },
          { passive: false },
        );
      }

      bindTap(startBtn, startGame);
      bindTap(restartBtn, restartGame);
      bindTap(musicBtn, toggleMusic);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp") setNextDirection(0, -1);
        if (e.key === "ArrowDown") setNextDirection(0, 1);
        if (e.key === "ArrowLeft") setNextDirection(-1, 0);
        if (e.key === "ArrowRight") setNextDirection(1, 0);
        if (e.code === "Space" && gameOver) restartGame();
      });

      document.addEventListener(
        "touchstart",
        (e) => {
          if (isButtonTouch(e)) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        },
        { passive: true },
      );

      document.addEventListener(
        "touchmove",
        (e) => {
          if (isButtonTouch(e)) return;
          if (!gameStarted || gameOver || deathPending) return;
          e.preventDefault();

          const touchMoveX = e.touches[0].clientX;
          const touchMoveY = e.touches[0].clientY;
          const dx = touchMoveX - touchStartX;
          const dy = touchMoveY - touchStartY;
          const minSwipeDistance = 18;

          if (
            Math.abs(dx) < minSwipeDistance &&
            Math.abs(dy) < minSwipeDistance
          )
            return;

          if (Math.abs(dx) > Math.abs(dy)) {
            setNextDirection(Math.sign(dx), 0);
          } else {
            setNextDirection(0, Math.sign(dy));
          }

          touchStartX = touchMoveX;
          touchStartY = touchMoveY;
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          if (isButtonTouch(e)) return;
          if (gameStarted) e.preventDefault();
        },
        { passive: false },
      );

      function isButtonTouch(e) {
        return Boolean(e.target.closest && e.target.closest("button"));
      }

      function setNextDirection(x, y) {
        if (directionChangedThisStep) return;
        if (x !== 0 && dir.x === -x) return;
        if (y !== 0 && dir.y === -y) return;
        if (x === dir.x && y === dir.y) return;

        nextDir = { x, y };
        directionChangedThisStep = true;
      }

      // ==================== 游戏逻辑 ====================
      function isSpeedMode() {
        return speedLevel > 0 && Date.now() <= speedModeEndTime;
      }

      function isHrMode() {
        return Date.now() <= hrModeEndTime;
      }

      function startHrMode() {
        if (isHrMode()) return;
        hrModeEndTime = Date.now() + hrModeDuration;
        lastHrModeTick = Date.now();
      }

      function pauseSpeedModeDuringHr() {
        if (!isHrMode()) {
          lastHrModeTick = 0;
          return;
        }

        if (speedLevel <= 0) return;

        const now = Date.now();

        if (lastHrModeTick > 0) {
          speedModeEndTime += now - lastHrModeTick;
        }

        lastHrModeTick = now;
      }

      function getScoreMultiplier() {
        return scoreMultipliers[speedLevel] || 1;
      }

      function getMultiplierColor() {
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreColors[level];
      }

      function getMultiplierFontSize() {
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreFontSizes[level];
      }

      function getTargetFoodCount() {
        if (!isSpeedMode()) return normalFoodCount;

        return (
          speedModeFoodCounts[speedLevel] || speedModeFoodCounts[maxSpeedLevel]
        );
      }

      function randomFoodType() {
        const r = Math.random();

        if (isSpeedMode()) {
          if (r < speedModeNormalRate) return FOOD_NORMAL;
          if (r < speedModeNormalRate + speedModeBoboRate) return FOOD_SPEED;
          if (r < speedModeNormalRate + speedModeBoboRate + speedModeHeheziRate)
            return FOOD_TRIPLE;
          if (
            r <
            speedModeNormalRate +
              speedModeBoboRate +
              speedModeHeheziRate +
              speedModeHrRate
          )
            return FOOD_HR;
          if (
            r <
            speedModeNormalRate +
              speedModeBoboRate +
              speedModeHeheziRate +
              speedModeHrRate +
              speedModeAzhuRate
          )
            return FOOD_AZHU;
          return FOOD_BOMB;
        }

        if (r < normalFoodRate) return FOOD_NORMAL;
        if (r < normalFoodRate + boboFoodRate) return FOOD_SPEED;
        if (r < normalFoodRate + boboFoodRate + heheziFoodRate)
          return FOOD_TRIPLE;
        if (r < normalFoodRate + boboFoodRate + heheziFoodRate + hrFoodRate)
          return FOOD_HR;
        if (
          r <
          normalFoodRate +
            boboFoodRate +
            heheziFoodRate +
            hrFoodRate +
            azhuFoodRate
        )
          return FOOD_AZHU;
        return FOOD_BOMB;
      }

      function createOneFood() {
        let food;
        do {
          food = {
            x: Math.floor(Math.random() * count),
            y: Math.floor(Math.random() * count),
            type: randomFoodType(),
            createdAt: Date.now() - Math.random() * foodLifeRandomOffset,
          };
        } while (isOccupied(food.x, food.y));
        return food;
      }

      function isOccupied(x, y) {
        return (
          snake.some((p) => p.x === x && p.y === y) ||
          foods.some((f) => f.x === x && f.y === y)
        );
      }

      function getActiveFoodCount() {
        return foods.filter((food) => !food.removingAt).length;
      }

      function fillFoods() {
        const targetCount = getTargetFoodCount();

        if (foods.length < targetCount) {
          while (foods.length < targetCount) {
            foods.push(createOneFood());
          }
        }

        while (getActiveFoodCount() > targetCount) {
          const activeFoods = foods.filter((food) => !food.removingAt);
          markFoodRemoving(activeFoods[activeFoods.length - 1]);
        }
      }

      function markExpiredFoods() {
        const now = Date.now();

        foods.forEach((food) => {
          if (food.removingAt) return;

          const lifeTime =
            food.type === FOOD_BOMB ? bombLifeTime : normalFoodLifeTime;

          const age = now - food.createdAt;

          if (age >= lifeTime - foodDisappearDuration) {
            markFoodRemoving(food);
          }
        });

        removeFinishedDisappearingFoods();
      }

      function markFoodRemoving(food) {
        if (!food || food.removingAt) return;
        food.removingAt = Date.now();
      }

      function removeFinishedDisappearingFoods() {
        const now = Date.now();
        foods = foods.filter(
          (food) =>
            !food.removingAt || now - food.removingAt < foodDisappearDuration,
        );
      }

      function removeTailSegments(count) {
        for (let i = 0; i < count; i++) {
          if (snake.length <= 1) break;
          snake.pop();
        }

        while (bodySkins.length > snake.length - 1) {
          bodySkins.pop();
        }
      }

      function shrinkAfterEating(shrinkCount) {
        removeTailSegments(1 + shrinkCount);
      }

      function addScore(value) {
        score += value;
        scoreEl.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          bestScoreEl.textContent = bestScore;
          localStorage.setItem("bestScore", bestScore);
        }
      }

      function startSpeedMode() {
        speedLevel = Math.min(speedLevel + 1, maxSpeedLevel);

        const now = Date.now();
        const remain = Math.max(speedModeEndTime - now, 0);

        const newRemain = Math.min(remain + speedUpDuration, maxSpeedModeTime);

        speedModeEndTime = now + newRemain;

        moveDelay =
          speedLevelDelays[speedLevel] || speedLevelDelays[maxSpeedLevel];

        fillFoods();
      }

      function checkSpeedModeEnd() {
        if (speedLevel > 0 && Date.now() > speedModeEndTime) {
          speedLevel = 0;
          speedModeEndTime = 0;
          moveDelay = speed;
          fillFoods();
        }
      }

      function updateGameLogic() {
        if (!gameStarted || gameOver) return;

        pauseSpeedModeDuringHr();
        checkSpeedModeEnd();
        markExpiredFoods();
        fillFoods();

        dir = nextDir;
        directionChangedThisStep = false;

        const head = wrapPoint({
          x: snake[0].x + dir.x,
          y: snake[0].y + dir.y,
        });

        const eatenFood = foods.find(
          (food) => food.x === head.x && food.y === head.y,
        );

        // 碰撞检测要放在食物判断之后：
        // 没吃东西时，尾巴这一帧会离开，所以允许蛇头走到当前尾巴格子。
        // 吃到食物时，尾巴不会离开，所以需要检查整条蛇。
        const bodyToCheck = eatenFood ? snake : snake.slice(0, -1);

        if (bodyToCheck.some((p) => p.x === head.x && p.y === head.y)) {
          snake.unshift(head);
          if (!eatenFood) snake.pop();
          startDeath(false);
          return;
        }

        if (eatenFood && eatenFood.type === FOOD_BOMB) {
          snake.unshift(head);
          snake.pop();
          addScorePopup(head.x * size, head.y * size, "危！", "#FF4444");
          startDeath(true);
          return;
        }

        snake.unshift(head);

        if (eatenFood) {
          handleEatenFood(eatenFood, head);
        } else {
          snake.pop();
        }
      }

      function handleEatenFood(food, head) {
        foods = foods.filter((f) => f !== food);
        eatingStartTime = Date.now();
        playSound(eatSound);

        if (food.type === FOOD_AZHU) {
          if (isHrMode()) {
            const shrinkCount = azhuBodyCount + outsourceBodyCount;
            shrinkAfterEating(shrinkCount);
            addScorePopup(
              head.x * size,
              head.y * size,
              `-${shrinkCount}`,
              hrInfoColor,
              popupFontSize,
            );
            fillFoods();
            return;
          }

          const point = azhuScore * getScoreMultiplier();
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );

          for (let i = 0; i < azhuBodyCount; i++) {
            bodySkins.push("azhu");
          }

          for (let i = 0; i < outsourceBodyCount; i++) {
            bodySkins.push("outsource");
          }

          while (snake.length < bodySkins.length + 1) {
            const tail = snake[snake.length - 1];
            snake.push(copyPoint(tail));
          }

          fillFoods();
          return;
        }

        if (food.type === FOOD_HR) {
          if (!isHrMode()) {
            startHrMode();
            shrinkAfterEating(hrShrinkOnEat);
            addScorePopup(
              head.x * size,
              head.y * size,
              "HR裁员",
              hrInfoColor,
              popupFontSize,
            );
          } else {
            shrinkAfterEating(hrShrinkHr);
            addScorePopup(
              head.x * size,
              head.y * size,
              `-${hrShrinkHr}`,
              hrInfoColor,
              popupFontSize,
            );
          }

          fillFoods();
          return;
        }

        if (isHrMode()) {
          let shrinkCount = hrShrinkNormal;

          if (food.type === FOOD_SPEED) shrinkCount = hrShrinkBobo;
          if (food.type === FOOD_TRIPLE) shrinkCount = hrShrinkHehezi;
          if (food.type === FOOD_AZHU)
            shrinkCount = azhuBodyCount + outsourceBodyCount;

          shrinkAfterEating(shrinkCount);
          addScorePopup(
            head.x * size,
            head.y * size,
            `-${shrinkCount}`,
            hrInfoColor,
            popupFontSize,
          );
          fillFoods();
          return;
        }

        const multiplier = getScoreMultiplier();

        if (food.type === FOOD_NORMAL) {
          const point = 1 * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );
          bodySkins.push("body");
        }

        if (food.type === FOOD_SPEED) {
          const point = 1 * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );
          bodySkins.push("body");
          startSpeedMode();
        }

        if (food.type === FOOD_TRIPLE) {
          const point = 2 * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );
          bodySkins.push("hehezi", "xiaobai", "xiaomao");
        }

        while (snake.length < bodySkins.length + 1) {
          const tail = snake[snake.length - 1];
          snake.push(copyPoint(tail));
        }

        fillFoods();
      }

      function startDeath(isBomb = false) {
        if (deathPending || gameOver) return;

        deathPending = true;
        deathStartTime = Date.now();
        deathIsBomb = isBomb;
        bombGameOver = false;
        restartBtn.style.display = "none";
        playSound(gameOverSound);
      }

      function finishDeath() {
        deathPending = false;
        bombGameOver = deathIsBomb;
        gameOver = true;
        restartBtn.style.display = "inline-block";
      }

      function gameOverNow(isBomb = false) {
        bombGameOver = isBomb;
        finishDeath();
      }

      // ==================== 绘制 ====================
      function drawGame() {
        drawBackground();

        if (gameOver) {
          drawGameOverText();
          return;
        }

        foods.forEach(drawFood);
        drawSpeedInfo();
        drawScorePopups();
        drawSnake();

        if (deathPending) {
          drawDeathOverlay();

          if (Date.now() - deathStartTime >= deathFreezeTime) {
            finishDeath();
          }

          return;
        }

        pulseTime += foodPulseSpeed * 0.25;
      }

      function drawBackground() {
        const bg = bombGameOver
          ? images.bgBomb
          : isSpeedMode()
            ? images.bgSpeed
            : images.bg;
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = `rgba(0,0,0,${bgMask})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawGameOverText() {
        ctx.fillStyle = "white";
        ctx.font = "32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          bombGameOver ? "" : "熊熊很大，尼吃不下~",
          canvas.width / 2,
          canvas.height / 2 - 30,
        );
      }

      function drawDeathOverlay() {
        const elapsed = Date.now() - deathStartTime;
        const progress = Math.min(elapsed / deathFreezeTime, 1);
        const alpha = deathOverlayMaxAlpha * progress;

        ctx.save();
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function getDeathShakeOffset() {
        if (!deathPending) return { x: 0, y: 0 };

        const elapsed = Date.now() - deathStartTime;
        if (elapsed > deathShakeDuration) return { x: 0, y: 0 };

        const strength =
          deathShakeStrength * (1 - elapsed / deathShakeDuration);
        return {
          x: (Math.random() * 2 - 1) * strength,
          y: (Math.random() * 2 - 1) * strength,
        };
      }

      function drawFood(food) {
        const x = food.x * size;
        const y = food.y * size;
        const pulse = Math.sin(pulseTime) * foodPulseSize;
        const alpha = getFoodAlpha(food);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = food.type === FOOD_BOMB ? "#ff0000" : "#FFD700";
        ctx.shadowBlur = foodGlow;
        ctx.beginPath();
        ctx.arc(x + size / 2, y + size / 2, size / 2 + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = food.type === FOOD_BOMB ? "#ff3333" : "white";
        ctx.lineWidth = foodStrokeWidth;
        ctx.stroke();
        drawCircleImage(getFoodImage(food.type), x, y);
        ctx.restore();
      }

      function getFoodAlpha(food) {
        if (!food.removingAt) return 1;

        const elapsed = Date.now() - food.removingAt;
        const fadeAlpha = Math.max(
          1 - elapsed / foodDisappearDuration,
          foodMinAlpha,
        );
        const blinkOn = Math.floor(Date.now() / foodBlinkSpeed) % 2 === 0;
        return blinkOn ? fadeAlpha : foodMinAlpha;
      }

      function drawSpeedInfo() {
        ctx.save();
        ctx.font = `${speedInfoFontSize}px sans-serif`;
        ctx.textAlign = "left";

        if (isHrMode()) {
          const remain = Math.max(
            0,
            Math.ceil((hrModeEndTime - Date.now()) / 1000),
          );
          ctx.fillStyle = hrInfoColor;
          ctx.fillText(`👔 HR裁员中  ${remain}s`, 12, 30);
          ctx.restore();
          return;
        }

        if (!isSpeedMode()) {
          ctx.restore();
          return;
        }

        const remain = Math.max(
          0,
          Math.ceil((speedModeEndTime - Date.now()) / 1000),
        );
        const multiplier = getScoreMultiplier();

        ctx.fillStyle = getMultiplierColor();
        ctx.fillText(
          `⚡ 波波 Lv.${speedLevel}  倍率 x${multiplier}  ${remain}s`,
          12,
          30,
        );
        ctx.restore();
      }

      function drawScorePopups() {
        scorePopups.forEach((popup) => {
          drawPopup(popup);
          popup.y -= popupRiseSpeed;
          popup.life -= 0.8;
        });
        scorePopups = scorePopups.filter((popup) => popup.life > 0);
      }

      function drawSnake() {
        const shake = getDeathShakeOffset();

        snake.forEach((p, index) => {
          const prev = prevSnake[index] || p;
          const pos = getRenderPosition(p, prev);
          const x = pos.x + shake.x;
          const y = pos.y + shake.y;

          if (index === 0) {
            drawHead(x, y, getDirectionFromTo(prev, p));
          } else {
            drawBodyPart(p, index, x, y);
          }
        });
      }

      function drawHead(x, y, direction) {
        headTargetAngle = getAngleByDirection(direction);
        headCurrentAngle = lerpAngle(headCurrentAngle, headTargetAngle, 0.25);

        const elapsed = Date.now() - eatingStartTime;
        const isEating = elapsed < eatingDuration;
        const img = isEating ? images.headEat : images.head;
        let drawSize = size;
        let offset = 0;

        if (isEating) {
          const progress = elapsed / eatingDuration;
          const wave = Math.sin(progress * Math.PI);
          drawSize = size * (eatHeadMinScale + wave * eatHeadScaleRange);
          offset = (size - drawSize) / 2;
        }

        drawRotatedCircleImageByAngle(
          img,
          x + offset,
          y + offset,
          drawSize,
          headCurrentAngle,
        );
      }

      function drawBodyPart(p, index, x, y) {
        const skinType = bodySkins[index - 1] || "body";
        const prevPart = snake[index - 1];
        const direction = getDirectionFromTo(p, prevPart);
        drawRotatedCircleImage(getBodyImage(skinType), x, y, size, direction);
      }

      function drawCircleImage(img, x, y, drawSize = size) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(
          x + drawSize / 2,
          y + drawSize / 2,
          drawSize / 2,
          0,
          Math.PI * 2,
        );
        ctx.clip();
        ctx.drawImage(img, x, y, drawSize, drawSize);
        ctx.restore();
      }

      function drawRotatedCircleImage(
        img,
        x,
        y,
        drawSize = size,
        direction = { x: 1, y: 0 },
      ) {
        drawRotatedCircleImageByAngle(
          img,
          x,
          y,
          drawSize,
          getAngleByDirection(direction),
        );
      }

      function drawRotatedCircleImageByAngle(
        img,
        x,
        y,
        drawSize = size,
        angle = 0,
      ) {
        ctx.save();
        ctx.translate(x + drawSize / 2, y + drawSize / 2);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.arc(0, 0, drawSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
        ctx.restore();
      }

      function drawPopup(popup) {
        const alpha = popup.life / popup.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = popup.color;
        ctx.strokeStyle = "#000";
        ctx.lineWidth = popupStrokeWidth;
        ctx.font = `bold ${popup.fontSize || popupFontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.strokeText(popup.text, popup.x + size / 2, popup.y + popupYOffset);
        ctx.fillText(popup.text, popup.x + size / 2, popup.y + popupYOffset);
        ctx.restore();
      }

      function addScorePopup(
        x,
        y,
        text,
        color = "#ffffff",
        fontSize = popupFontSize,
      ) {
        scorePopups.push({
          x,
          y,
          text,
          color,
          fontSize,
          life: popupLife,
          maxLife: popupLife,
        });
      }

      // ==================== 工具函数 ====================
      function copyPoint(p) {
        return { x: p.x, y: p.y };
      }

      function wrapPoint(p) {
        return {
          x: (p.x + count) % count,
          y: (p.y + count) % count,
        };
      }

      function getWrappedDelta(to, from) {
        let d = to - from;
        if (d > count / 2) d -= count;
        if (d < -count / 2) d += count;
        return d;
      }

      function getDirectionFromTo(from, to) {
        const dx = getWrappedDelta(to.x, from.x);
        const dy = getWrappedDelta(to.y, from.y);
        return { x: Math.sign(dx), y: Math.sign(dy) };
      }

      function getRenderPosition(p, prev) {
        const dx = getWrappedDelta(p.x, prev.x);
        const dy = getWrappedDelta(p.y, prev.y);
        let x = prev.x + dx * moveProgress;
        let y = prev.y + dy * moveProgress;

        if (x < 0) x += count;
        if (x >= count) x -= count;
        if (y < 0) y += count;
        if (y >= count) y -= count;

        return { x: x * size, y: y * size };
      }

      function getAngleByDirection(direction) {
        if (direction.y === 1) return 0;
        if (direction.x === -1) return Math.PI / 2;
        if (direction.y === -1) return Math.PI;
        if (direction.x === 1) return -Math.PI / 2;
        return headCurrentAngle;
      }

      function lerpAngle(current, target, amount) {
        let diff = target - current;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        return current + diff * amount;
      }

      function getFoodImage(type) {
        if (type === FOOD_SPEED) return images.bobo;
        if (type === FOOD_TRIPLE) return images.hehezi;
        if (type === FOOD_BOMB) return images.bob;
        if (type === FOOD_HR) return images.hr;
        if (type === FOOD_AZHU) return images.azhu;
        return images.body;
      }

      function getBodyImage(type) {
        if (type === "hehezi") return images.hehezi;
        if (type === "xiaobai") return images.xiaobai;
        if (type === "xiaomao") return images.xiaomao;
        if (type === "azhu") return images.azhu;
        if (type === "outsource") return images.outsource;
        return images.body;
      }

      function playSound(sound) {
        if (!musicEnabled) return;
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }

      // ==================== 动画循环 ====================
      function gameFrame(now) {
        if (
          gameStarted &&
          !gameOver &&
          !deathPending &&
          now - lastMoveTime >= moveDelay
        ) {
          prevSnake = snake.map(copyPoint);
          updateGameLogic();
          lastMoveTime = now;
          moveProgress = 0;
        }

        if (deathPending) {
          moveProgress = Math.min(
            ((now - lastMoveTime) / moveDelay) * deathSlowMotionScale,
            1,
          );
        } else {
          moveProgress = Math.min((now - lastMoveTime) / moveDelay, 1);
        }

        if (gameStarted) drawGame();
        animationId = requestAnimationFrame(gameFrame);
      }

      // ==================== 资源加载 ====================
      Promise.all(
        Object.values(images).map(
          (img) => new Promise((resolve) => (img.onload = resolve)),
        ),
      ).then(() => {
        drawBackground();
      });
    </script>
  </body>
</html>
