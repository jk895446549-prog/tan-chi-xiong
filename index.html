<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>贪吃熊</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        background: #222;
        color: white;
        text-align: center;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #gameShell {
        width: min(92vw, 78vh, 600px);
        max-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #gameArea {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        flex: 0 0 auto;
      }

      canvas {
        background: #111;
        display: block;
        margin: 0 auto;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      button {
        border: none;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #topBar,
      #bottomBar {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #topBar {
        margin-top: 10px;
        margin-bottom: 6px;
      }

      #bottomBar {
        margin-top: 8px;
        margin-bottom: 8px;
        justify-content: center;
        flex-direction: column;
      }

      #gameTitle {
        font-size: 34px;
        font-weight: bold;
      }

      #scorePanel {
        font-size: 24px;
        font-weight: bold;
      }

      #startHint {
        position: absolute;
        left: 50%;
        top: calc(50% + 54px);
        transform: translateX(-50%);
        width: 86%;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        z-index: 998;
        pointer-events: none;
      }

      #statusBar {
        min-height: 26px;
        padding: 4px 12px;
        margin-bottom: 6px;
        box-sizing: border-box;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.32);
        color: rgba(255, 255, 255, 0.78);
        font-size: 14px;
        font-weight: bold;
        line-height: 18px;
        text-align: center;
        white-space: nowrap;
        transition: color 0.12s linear;
      }

      #controlButtons {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #pauseBtn,
      #fullscreenBtn,
      #musicBtn {
        padding: 6px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.4);
        color: white;
      }

      #startBtn,
      #restartBtn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 30px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 12px;
        color: white;
        z-index: 999;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      #startBtn {
        background: #4caf50;
      }

      #startBtn:disabled {
        background: #666;
        cursor: default;
        opacity: 0.85;
      }

      #restartBtn {
        display: none;
        background: #ffb800;
      }

      #loadingOverlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at center,
            rgba(255, 184, 0, 0.18),
            transparent 38%
          ),
          linear-gradient(180deg, #1e1e1e 0%, #101010 100%);
        color: white;
      }

      #loadingCard {
        width: min(82vw, 420px);
        padding: 26px 24px 22px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.42);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      }

      #loadingTitle {
        font-size: 34px;
        font-weight: 900;
        margin-bottom: 10px;
      }

      #loadingText {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.82);
        margin-bottom: 14px;
      }

      #loadingBarWrap {
        width: 100%;
        height: 18px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.16);
        margin-bottom: 12px;
      }

      #loadingBar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4caf50, #ffb800);
        transition: width 0.2s ease;
      }

      #loadingPercent {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      #loadingAssetList {
        max-height: 150px;
        overflow: hidden;
        text-align: left;
        font-size: 13px;
        line-height: 1.75;
        color: rgba(255, 255, 255, 0.75);
      }

      .loadingAssetDone {
        color: rgba(144, 238, 144, 0.95);
      }

      .loadingAssetFailed {
        color: rgba(255, 120, 120, 0.95);
      }

      .loadingAssetCurrent {
        color: #ffdf6e;
      }

      #loadingDevTip {
        display: none;
        margin-top: 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.48);
      }

      #version {
        position: fixed;
        right: 10px;
        bottom: 10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        z-index: 9999;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        #gameShell {
          width: min(94vw, 78vh);
        }

        #topBar {
          margin-top: 0;
          margin-bottom: 8px;
        }

        #gameTitle {
          font-size: clamp(26px, 9vw, 44px);
        }

        #scorePanel {
          font-size: clamp(18px, 6vw, 30px);
        }

        #statusBar {
          min-height: 24px;
          margin-bottom: 6px;
          font-size: 13px;
        }

        #controlButtons {
          width: 100%;
          justify-content: center;
        }

        #pauseBtn,
        #fullscreenBtn,
        #musicBtn {
          min-width: 54px;
          min-height: 54px;
          padding: 8px 12px;
          font-size: 16px;
          border-radius: 14px;
          white-space: normal;
        }

        #startHint {
          top: calc(50% + 52px);
          font-size: 14px;
        }
      }

      @media (orientation: landscape) and (max-height: 640px) {
        body {
          align-items: center;
          justify-content: center;
        }

        #gameShell {
          width: 100vw;
          height: 100svh;
          max-height: none;
          box-sizing: border-box;
          padding: 8px 10px;
          display: grid;
          grid-template-columns: min(72vw, calc(100svh - 76px)) auto;
          grid-template-rows: auto min(72vw, calc(100svh - 76px));
          grid-template-areas:
            "top controls"
            "game controls";
          justify-content: center;
          align-content: center;
          align-items: center;
          column-gap: 10px;
          row-gap: 6px;
        }

        #topBar {
          grid-area: top;
          width: 100%;
          margin: 0;
          gap: 16px;
        }

        #gameTitle {
          font-size: clamp(22px, 6vh, 34px);
          line-height: 1;
          white-space: nowrap;
        }

        #scorePanel {
          font-size: clamp(18px, 5vh, 28px);
          line-height: 1;
          white-space: nowrap;
        }

        #gameArea {
          grid-area: game;
          width: min(72vw, calc(100svh - 76px));
          height: min(72vw, calc(100svh - 76px));
        }

        #bottomBar {
          grid-area: controls;
          width: auto;
          margin: 0;
          align-self: center;
          justify-self: center;
          flex-direction: column;
        }

        #statusBar {
          max-width: 112px;
          min-height: 42px;
          margin-bottom: 8px;
          padding: 7px 8px;
          font-size: 12px;
          line-height: 1.25;
          white-space: normal;
        }

        #controlButtons {
          width: auto;
          flex-direction: column;
          justify-content: center;
          gap: 8px;
        }

        #pauseBtn,
        #fullscreenBtn,
        #musicBtn {
          width: 64px;
          min-height: 54px;
          padding: 8px 10px;
          font-size: 15px;
          line-height: 1.25;
          border-radius: 14px;
          white-space: normal;
        }

        #startBtn,
        #restartBtn {
          padding: 12px 26px;
          font-size: 18px;
        }

        #startHint {
          top: calc(50% + 50px);
          font-size: 13px;
          line-height: 1.45;
        }

        #version {
          right: 8px;
          bottom: 6px;
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <div id="gameShell">
      <div id="topBar">
        <div id="gameTitle">贪吃熊</div>
        <div id="scorePanel">
          分数：<span id="score">0</span> 最高分：<span id="bestScore">0</span>
        </div>
      </div>

      <div id="gameArea">
        <canvas id="game" width="384" height="384"></canvas>
        <button id="startBtn" type="button">开始游戏</button>
        <button id="restartBtn" type="button">重新开始</button>
        <div id="startHint">方向键 / 滑动屏幕控制，P暂停，空格重开</div>
      </div>

      <div id="bottomBar">
        <div id="statusBar">普通模式</div>
        <div id="controlButtons">
          <button id="pauseBtn" type="button">⏸ 暂停</button>
          <button id="fullscreenBtn" type="button">⛶ 全屏</button>
          <button id="musicBtn" type="button">🔇静音</button>
        </div>
      </div>
    </div>

    <div id="loadingOverlay">
      <div id="loadingCard">
        <div id="loadingTitle">🐻 贪吃熊</div>
        <div id="loadingText">正在加载游戏资源...</div>
        <div id="loadingBarWrap"><div id="loadingBar"></div></div>
        <div id="loadingPercent">0%</div>
        <div id="loadingAssetList"></div>
        <div id="loadingDevTip">开发模式：已开启强制加载延迟</div>
      </div>
    </div>

    <div id="version"></div>

    <script>
      const GAME_VERSION = "v1.6.3";

      // ==================== 调试参数 / Game Balance ====================

      // 开发模式
      const DEBUG_LOADING = false; // true：强制显示加载页，方便测试；发布时改成 false
      const DEBUG_LOADING_DELAY = 2000; // 开发模式下，资源加载完成后额外停留时间(ms)

      // 地图
      const size = 32; // 单格大小(px)

      // 游戏节奏
      const speed = 200; // 普通速度，越小越快
      const maxSpeedLevel = 5; // 最大加速层数
      const speedLevelDurations = [0, 5000, 3000, 3000, 3000, 5000]; // 第0项不用，Lv1=5秒，Lv2~4=3秒，MAX=5秒
      const speedLevelDelays = [200, 190, 180, 160, 130, 100]; // 每层速度
      const scoreMultipliers = [1, 1, 2, 2, 3, 4]; // 得分倍率：第0项普通，1~5项波波层数，MAX为4倍
      const speedInfoFontSize = 12; // 状态栏字体大小

      // HR裁员模式
      const hrModeDuration = 5000; // 裁员模式持续时间(ms)
      const hrShrinkOnEat = 0; // 吃到HR时立即减少的身体长度
      const hrShrinkNormal = 1; // 裁员模式吃普通食物减少长度
      const hrShrinkBobo = 1; // 裁员模式吃波波减少长度
      const hrShrinkHehezi = 3; // 裁员模式吃贺贺子减少长度
      const hrShrinkHr = 1; // 裁员模式再次吃HR减少长度，不延长时间
      const hrInfoColor = "#B388FF"; // HR裁员提示颜色

      // 食物得分
      const normalFoodScore = 1; // 普通食物基础得分
      const heheziScore = 2; // 贺贺子基础得分
      const azhuScore = 3; // 阿朱基础得分

      // 阿朱食物
      const azhuBodyCount = 1; // 吃阿朱增加几个阿朱身体
      const outsourceBodyCount = 5; // 吃阿朱增加几个外包身体

      // 死亡反馈
      const deathFreezeTime = 2000; // 死亡后冻结停留时间(ms)
      const deathSlowMotionScale = 0.35; // 死亡瞬间慢动作比例，越小越慢
      const deathOverlayMaxAlpha = 1.0; // 死亡黑色遮罩最大透明度
      const deathShakeDuration = 450; // 撞击后身体震动时长(ms)
      const deathShakeStrength = 4; // 身体震动强度(px)

      // 食物概率（普通模式）

      const normalFoodRate = 0.3; // 普通
      const heheziFoodRate = 0.15; // 贺贺子
      const azhuFoodRate = 0.1; // 阿朱
      const boboFoodRate = 0.25; // 波波
      const hrFoodRate = 0.05; // HR，进入裁员模式
      // Bob = 0.15

      // 食物概率（波波模式）
      const speedModeNormalRate = 0.15; // 普通
      const speedModeHeheziRate = 0.1; // 贺贺子
      const speedModeAzhuRate = 0.05; // 阿朱
      const speedModeBoboRate = 0.3; // 波波
      const speedModeHrRate = 0.1; // HR
      // Bob = 0.3

      // 食物数量
      const normalFoodCount = 3; // 普通模式食物数量
      const speedModeFoodCounts = [3, 4, 6, 8, 10, 15]; // 第0项普通，1~5项波波层数

      // 食物消失
      const foodLifeRandomOffset = 5000; // 食物出生时间随机偏移，避免一起消失
      const bombLifeTime = 6000; // Bob存活时间(ms)
      const bobWarningDuration = 1200; // Bob淡入预警时间(ms)，结束后才会致死
      const bobWarningMinAlpha = 0.18; // Bob刚出现时的最低透明度
      const normalFoodLifeTime = 12000; // 普通食物存在时间(ms)
      const foodDisappearDuration = 800; // 消失动画时长(ms)
      const foodBlinkSpeed = 160; // 闪烁速度
      const foodMinAlpha = 0.15; // 最低透明度

      // 吃东西动画
      const eatingDuration = 200; // 动画时长(ms)
      const eatHeadMinScale = 0.95; // 最小缩放
      const eatHeadScaleRange = 1.1; // 最大放大倍率

      // 食物光效
      const bgMask = 0.35; // 背景遮罩
      const foodPulseSize = 6; // 呼吸幅度
      const foodPulseSpeed = 0.15; // 呼吸速度
      const foodGlow = 15; // 发光强度
      const foodStrokeWidth = 4; // 外圈粗细

      // 飘字
      const popupLife = 80; // 持续时间
      const popupRiseSpeed = 0.7; // 上升速度
      const popupFontSize = 22; // 字体大小
      const popupStrokeWidth = 4; // 描边粗细
      const popupYOffset = 0; // Y轴偏移
      const popupScoreColors = [
        "#FFFFFF",
        "#FFFFFF",
        "#4FC3F7",
        "#4FC3F7",
        "#FFD700",
        "#FFD700",
      ];
      const popupScoreFontSizes = [22, 22, 28, 28, 32, 32];

      // ==================== DOM ====================
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestScoreEl = document.getElementById("bestScore");
      const restartBtn = document.getElementById("restartBtn");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const musicBtn = document.getElementById("musicBtn");
      const statusBar = document.getElementById("statusBar");
      const startHint = document.getElementById("startHint");
      const versionEl = document.getElementById("version");
      const loadingOverlay = document.getElementById("loadingOverlay");
      const loadingText = document.getElementById("loadingText");
      const loadingBar = document.getElementById("loadingBar");
      const loadingPercent = document.getElementById("loadingPercent");
      const loadingAssetList = document.getElementById("loadingAssetList");
      const loadingDevTip = document.getElementById("loadingDevTip");
      versionEl.textContent = GAME_VERSION;
      startBtn.disabled = true;
      startBtn.textContent = "资源加载中 0%";
      loadingDevTip.style.display = DEBUG_LOADING ? "block" : "none";

      // ==================== 常量 ====================
      const count = canvas.width / size;
      const FOOD_NORMAL = "normal";
      const FOOD_SPEED = "speed";
      const FOOD_TRIPLE = "triple";
      const FOOD_BOMB = "bomb";
      const FOOD_HR = "hr";
      const FOOD_AZHU = "azhu";

      // ==================== 资源 ====================
      const images = {
        head: loadImage("head.png"),
        headEat: loadImage("head_eat.png"),
        body: loadImage("body.png"),
        bg: loadImage("background.jpg"),
        bgSpeed: loadImage("background_speed.jpg"),
        bgBomb: loadImage("background_bomb.jpg"),
        bobo: loadImage("bobo.png"),
        hehezi: loadImage("hehezi.png"),
        xiaobai: loadImage("xiaobai.png"),
        xiaomao: loadImage("xiaomao.png"),
        bob: loadImage("bob.png"),
        hr: loadImage("hr.png"),
        azhu: loadImage("azhu.png"),
        outsource: loadImage("outsource.png"),
      };

      const eatSound = new Audio("eat.mp3");
      const gameOverSound = new Audio("gameover.mp3");
      const bgm = new Audio("bgm.mp3");
      bgm.loop = true;
      bgm.volume = 0.4;

      // ==================== 状态 ====================
      let snake = [];
      let prevSnake = [];
      let bodySkins = [];
      let foods = [];
      let score = 0;
      let bestScore = Number(localStorage.getItem("bestScore") || 0);

      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };

      let gameStarted = false;
      let gameOver = false;
      let gamePaused = false;
      let pauseStartTime = 0;
      let bombGameOver = false;
      let deathPending = false;
      let deathStartTime = 0;
      let deathIsBomb = false;
      let musicEnabled = true;
      let assetsLoaded = false;
      musicBtn.textContent = "🔊音乐";

      let animationId = null;
      let moveDelay = speed;
      let lastMoveTime = 0;
      let moveProgress = 1;

      let eatingStartTime = 0;
      let pulseTime = 0;
      let scorePopups = [];

      let speedModeEndTime = 0;
      let speedLevel = 0;

      let hrModeEndTime = 0;
      let lastHrModeTick = 0;

      let headCurrentAngle = -Math.PI / 2;
      let headTargetAngle = -Math.PI / 2;

      let touchStartX = 0;
      let touchStartY = 0;
      let directionChangedThisStep = false;
      bestScoreEl.textContent = bestScore;

      // ==================== 初始化 ====================
      function loadImage(src) {
        const img = new Image();
        img.src = src;
        return img;
      }

      function reset() {
        snake = [{ x: 5, y: 5 }];
        prevSnake = snake.map(copyPoint);
        bodySkins = [];
        foods = [];
        scorePopups = [];

        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        moveDelay = speed;
        moveProgress = 1;
        lastMoveTime = performance.now();

        score = 0;
        gameOver = false;
        gamePaused = false;
        pauseStartTime = 0;
        updatePauseButton();
        bombGameOver = false;
        deathPending = false;
        deathStartTime = 0;
        deathIsBomb = false;
        speedModeEndTime = 0;
        speedLevel = 0;
        hrModeEndTime = 0;
        lastHrModeTick = 0;
        eatingStartTime = 0;
        headCurrentAngle = -Math.PI / 2;
        headTargetAngle = -Math.PI / 2;
        directionChangedThisStep = false;

        scoreEl.textContent = score;
        restartBtn.style.display = "none";
        fillFoods();

        if (!animationId) {
          animationId = requestAnimationFrame(gameFrame);
        }
      }

      async function startGame() {
        if (!assetsLoaded) return;
        if (gameStarted && !gameOver) return;
        startBtn.style.display = "none";
        startHint.style.display = "none";
        gameStarted = true;
        await requestFullscreenIfPossible();
        bgm.play().catch(() => {});
        reset();
      }

      function restartGame() {
        reset();
      }

      function toggleMusic() {
        musicEnabled = !musicEnabled;
        if (musicEnabled) {
          bgm.play().catch(() => {});
          musicBtn.textContent = "🔊音乐";
        } else {
          bgm.pause();
          musicBtn.textContent = "🔇静音";
        }
      }

      function togglePause() {
        if (!gameStarted || gameOver || deathPending || !assetsLoaded) return;

        gamePaused = !gamePaused;

        if (gamePaused) {
          pauseStartTime = Date.now();
          bgm.pause();
        } else {
          lastMoveTime = performance.now();
          if (musicEnabled) bgm.play().catch(() => {});
        }

        updatePauseButton();
      }

      function updatePauseButton() {
        pauseBtn.textContent = gamePaused ? "▶ 继续" : "⏸ 暂停";
      }

      function getGameTime() {
        return gamePaused ? pauseStartTime : Date.now();
      }

      async function requestFullscreenIfPossible() {
        if (!document.fullscreenEnabled || document.fullscreenElement) return;
        try {
          await document.documentElement.requestFullscreen();
        } catch (e) {
          console.log("全屏请求被浏览器拒绝", e);
        }
      }

      async function toggleFullscreen() {
        if (!document.fullscreenEnabled) return;
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch (e) {
          console.log("全屏切换失败", e);
        }
      }

      function updateFullscreenButton() {
        fullscreenBtn.textContent = document.fullscreenElement
          ? "↙ 退出"
          : "⛶ 全屏";
      }

      // ==================== 输入控制 ====================
      function bindTap(button, handler) {
        button.addEventListener("click", handler);
        button.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            e.stopPropagation();
            handler();
          },
          { passive: false },
        );
      }

      bindTap(startBtn, startGame);
      bindTap(restartBtn, restartGame);
      bindTap(pauseBtn, togglePause);
      bindTap(fullscreenBtn, toggleFullscreen);
      bindTap(musicBtn, toggleMusic);

      if (!document.fullscreenEnabled) {
        fullscreenBtn.style.display = "none";
      }
      document.addEventListener("fullscreenchange", updateFullscreenButton);
      updateFullscreenButton();
      updatePauseButton();

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp") setNextDirection(0, -1);
        if (e.key === "ArrowDown") setNextDirection(0, 1);
        if (e.key === "ArrowLeft") setNextDirection(-1, 0);
        if (e.key === "ArrowRight") setNextDirection(1, 0);
        if (e.code === "Space" && gameOver) restartGame();
        if (e.key === "p" || e.key === "P") togglePause();
      });

      document.addEventListener(
        "touchstart",
        (e) => {
          if (isButtonTouch(e)) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        },
        { passive: true },
      );

      document.addEventListener(
        "touchmove",
        (e) => {
          if (isButtonTouch(e)) return;
          if (!gameStarted || gameOver || deathPending) return;
          e.preventDefault();

          const touchMoveX = e.touches[0].clientX;
          const touchMoveY = e.touches[0].clientY;
          const dx = touchMoveX - touchStartX;
          const dy = touchMoveY - touchStartY;
          const minSwipeDistance = 18;

          if (
            Math.abs(dx) < minSwipeDistance &&
            Math.abs(dy) < minSwipeDistance
          )
            return;

          if (Math.abs(dx) > Math.abs(dy)) {
            setNextDirection(Math.sign(dx), 0);
          } else {
            setNextDirection(0, Math.sign(dy));
          }

          touchStartX = touchMoveX;
          touchStartY = touchMoveY;
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          if (isButtonTouch(e)) return;
          if (gameStarted) e.preventDefault();
        },
        { passive: false },
      );

      function isButtonTouch(e) {
        return Boolean(e.target.closest && e.target.closest("button"));
      }

      function setNextDirection(x, y) {
        if (directionChangedThisStep) return;
        if (x !== 0 && dir.x === -x) return;
        if (y !== 0 && dir.y === -y) return;
        if (x === dir.x && y === dir.y) return;

        nextDir = { x, y };
        directionChangedThisStep = true;
      }

      // ==================== 游戏逻辑 ====================
      function isSpeedMode() {
        return speedLevel > 0 && getGameTime() <= speedModeEndTime;
      }

      function isHrMode() {
        return getGameTime() <= hrModeEndTime;
      }

      function startHrMode() {
        if (isHrMode()) return;
        hrModeEndTime = getGameTime() + hrModeDuration;
        lastHrModeTick = getGameTime();
      }

      function pauseSpeedModeDuringHr() {
        if (!isHrMode()) {
          lastHrModeTick = 0;
          return;
        }

        if (speedLevel <= 0) return;

        const now = getGameTime();

        if (lastHrModeTick > 0) {
          speedModeEndTime += now - lastHrModeTick;
        }

        lastHrModeTick = now;
      }

      function getScoreMultiplier() {
        return scoreMultipliers[speedLevel] || 1;
      }

      function isMaxSpeedMode() {
        return speedLevel >= maxSpeedLevel && isSpeedMode();
      }

      function getRainbowColor() {
        const hue = (getGameTime() * 0.18) % 360;
        return `hsl(${hue}, 100%, 62%)`;
      }

      function resolveDrawColor(color) {
        return color === "rainbow" ? getRainbowColor() : color;
      }

      function getMultiplierColor() {
        if (isMaxSpeedMode()) return "rainbow";
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreColors[level];
      }

      function getMultiplierFontSize() {
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreFontSizes[level];
      }

      function getTargetFoodCount() {
        if (!isSpeedMode()) return normalFoodCount;

        return (
          speedModeFoodCounts[speedLevel] || speedModeFoodCounts[maxSpeedLevel]
        );
      }

      function randomFoodType() {
        const r = Math.random();

        if (isSpeedMode()) {
          if (r < speedModeNormalRate) return FOOD_NORMAL;
          if (r < speedModeNormalRate + speedModeBoboRate) return FOOD_SPEED;
          if (r < speedModeNormalRate + speedModeBoboRate + speedModeHeheziRate)
            return FOOD_TRIPLE;
          if (
            r <
            speedModeNormalRate +
              speedModeBoboRate +
              speedModeHeheziRate +
              speedModeHrRate
          )
            return FOOD_HR;
          if (
            r <
            speedModeNormalRate +
              speedModeBoboRate +
              speedModeHeheziRate +
              speedModeHrRate +
              speedModeAzhuRate
          )
            return FOOD_AZHU;
          return FOOD_BOMB;
        }

        if (r < normalFoodRate) return FOOD_NORMAL;
        if (r < normalFoodRate + boboFoodRate) return FOOD_SPEED;
        if (r < normalFoodRate + boboFoodRate + heheziFoodRate)
          return FOOD_TRIPLE;
        if (r < normalFoodRate + boboFoodRate + heheziFoodRate + hrFoodRate)
          return FOOD_HR;
        if (
          r <
          normalFoodRate +
            boboFoodRate +
            heheziFoodRate +
            hrFoodRate +
            azhuFoodRate
        )
          return FOOD_AZHU;
        return FOOD_BOMB;
      }

      function createOneFood() {
        let food;
        do {
          const type = randomFoodType();
          const now = getGameTime();
          food = {
            x: Math.floor(Math.random() * count),
            y: Math.floor(Math.random() * count),
            type,
            createdAt:
              type === FOOD_BOMB
                ? now
                : now - Math.random() * foodLifeRandomOffset,
            warningStartedAt: type === FOOD_BOMB ? now : 0,
          };
        } while (isOccupied(food.x, food.y));
        return food;
      }

      function isOccupied(x, y) {
        return (
          snake.some((p) => p.x === x && p.y === y) ||
          foods.some((f) => f.x === x && f.y === y)
        );
      }

      function getActiveFoodCount() {
        return foods.filter((food) => !food.removingAt).length;
      }

      function fillFoods() {
        const targetCount = getTargetFoodCount();

        if (foods.length < targetCount) {
          while (foods.length < targetCount) {
            foods.push(createOneFood());
          }
        }

        while (getActiveFoodCount() > targetCount) {
          const activeFoods = foods.filter((food) => !food.removingAt);
          markFoodRemoving(activeFoods[activeFoods.length - 1]);
        }
      }

      function markExpiredFoods() {
        const now = getGameTime();

        foods.forEach((food) => {
          if (food.removingAt) return;

          const lifeTime =
            food.type === FOOD_BOMB ? bombLifeTime : normalFoodLifeTime;

          const age = now - food.createdAt;

          if (age >= lifeTime - foodDisappearDuration) {
            markFoodRemoving(food);
          }
        });

        removeFinishedDisappearingFoods();
      }

      function markFoodRemoving(food) {
        if (!food || food.removingAt) return;
        food.removingAt = getGameTime();
      }

      function removeFinishedDisappearingFoods() {
        const now = getGameTime();
        foods = foods.filter(
          (food) =>
            !food.removingAt || now - food.removingAt < foodDisappearDuration,
        );
      }

      function removeTailSegments(count) {
        for (let i = 0; i < count; i++) {
          if (snake.length <= 1) break;
          snake.pop();
        }

        while (bodySkins.length > snake.length - 1) {
          bodySkins.pop();
        }
      }

      function shrinkAfterEating(shrinkCount) {
        removeTailSegments(1 + shrinkCount);
      }

      function addScore(value) {
        score += value;
        scoreEl.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          bestScoreEl.textContent = bestScore;
          localStorage.setItem("bestScore", bestScore);
        }
      }

      function startSpeedMode() {
        speedLevel = Math.min(speedLevel + 1, maxSpeedLevel);
        speedModeEndTime = getGameTime() + getSpeedLevelDuration(speedLevel);
        updateSpeedModeDelay();
        updateModeStatus();
        fillFoods();
      }

      function getSpeedLevelDuration(level) {
        return speedLevelDurations[level] || speedLevelDurations[maxSpeedLevel];
      }

      function checkSpeedModeEnd() {
        if (speedLevel <= 0 || getGameTime() <= speedModeEndTime) return;

        if (speedLevel >= maxSpeedLevel) {
          speedLevel = 0;
        } else {
          speedLevel -= 1;
        }

        if (speedLevel <= 0) {
          speedLevel = 0;
          speedModeEndTime = 0;
          moveDelay = speed;
        } else {
          speedModeEndTime = getGameTime() + getSpeedLevelDuration(speedLevel);
          updateSpeedModeDelay();
        }

        updateModeStatus();
        fillFoods();
      }

      function updateSpeedModeDelay() {
        moveDelay =
          speedLevelDelays[speedLevel] || speedLevelDelays[maxSpeedLevel];
      }

      function updateGameLogic() {
        if (!gameStarted || gameOver || gamePaused) return;

        pauseSpeedModeDuringHr();
        checkSpeedModeEnd();
        markExpiredFoods();
        fillFoods();

        dir = nextDir;
        directionChangedThisStep = false;

        const head = wrapPoint({
          x: snake[0].x + dir.x,
          y: snake[0].y + dir.y,
        });

        const foundFood = foods.find(
          (food) => food.x === head.x && food.y === head.y,
        );

        // Bob淡入预警期内只是危险提示，不会致死，也不会被吃掉。
        const eatenFood =
          foundFood &&
          foundFood.type === FOOD_BOMB &&
          !isBobDangerous(foundFood)
            ? null
            : foundFood;

        // 碰撞检测要放在食物判断之后：
        // 没吃东西时，尾巴这一帧会离开，所以允许蛇头走到当前尾巴格子。
        // 吃到食物时，尾巴不会离开，所以需要检查整条蛇。
        const bodyToCheck = eatenFood ? snake : snake.slice(0, -1);

        if (bodyToCheck.some((p) => p.x === head.x && p.y === head.y)) {
          snake.unshift(head);
          if (!eatenFood) snake.pop();
          startDeath(false);
          return;
        }

        if (eatenFood && eatenFood.type === FOOD_BOMB) {
          snake.unshift(head);
          snake.pop();
          addScorePopup(head.x * size, head.y * size, "危！", "#FF4444");
          startDeath(true);
          return;
        }

        snake.unshift(head);

        if (eatenFood) {
          handleEatenFood(eatenFood, head);
        } else {
          snake.pop();
        }
      }

      function handleEatenFood(food, head) {
        foods = foods.filter((f) => f !== food);
        eatingStartTime = getGameTime();
        playSound(eatSound);

        if (food.type === FOOD_AZHU) {
          if (isHrMode()) {
            const shrinkCount = azhuBodyCount + outsourceBodyCount;
            shrinkAfterEating(shrinkCount);
            addScorePopup(
              head.x * size,
              head.y * size,
              `-${shrinkCount}`,
              hrInfoColor,
              popupFontSize,
            );
            fillFoods();
            return;
          }

          const point = azhuScore * getScoreMultiplier();
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );

          for (let i = 0; i < azhuBodyCount; i++) {
            bodySkins.push("azhu");
          }

          for (let i = 0; i < outsourceBodyCount; i++) {
            bodySkins.push("outsource");
          }

          while (snake.length < bodySkins.length + 1) {
            const tail = snake[snake.length - 1];
            snake.push(copyPoint(tail));
          }

          fillFoods();
          return;
        }

        if (food.type === FOOD_HR) {
          if (!isHrMode()) {
            startHrMode();
            shrinkAfterEating(hrShrinkOnEat);
            addScorePopup(
              head.x * size,
              head.y * size,
              "HR裁员",
              hrInfoColor,
              popupFontSize,
            );
          } else {
            shrinkAfterEating(hrShrinkHr);
            addScorePopup(
              head.x * size,
              head.y * size,
              `-${hrShrinkHr}`,
              hrInfoColor,
              popupFontSize,
            );
          }

          fillFoods();
          return;
        }

        if (isHrMode()) {
          let shrinkCount = hrShrinkNormal;

          if (food.type === FOOD_SPEED) shrinkCount = hrShrinkBobo;
          if (food.type === FOOD_TRIPLE) shrinkCount = hrShrinkHehezi;
          if (food.type === FOOD_AZHU)
            shrinkCount = azhuBodyCount + outsourceBodyCount;

          shrinkAfterEating(shrinkCount);
          addScorePopup(
            head.x * size,
            head.y * size,
            `-${shrinkCount}`,
            hrInfoColor,
            popupFontSize,
          );
          fillFoods();
          return;
        }

        const multiplier = getScoreMultiplier();

        if (food.type === FOOD_NORMAL) {
          const point = normalFoodScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );
          bodySkins.push("body");
        }

        if (food.type === FOOD_SPEED) {
          const point = normalFoodScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );
          bodySkins.push("body");
          startSpeedMode();
        }

        if (food.type === FOOD_TRIPLE) {
          const point = heheziScore * multiplier;
          addScore(point);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
          );
          bodySkins.push("hehezi", "xiaobai", "xiaomao");
        }

        while (snake.length < bodySkins.length + 1) {
          const tail = snake[snake.length - 1];
          snake.push(copyPoint(tail));
        }

        fillFoods();
      }

      function startDeath(isBomb = false) {
        if (deathPending || gameOver) return;

        deathPending = true;
        deathStartTime = getGameTime();
        deathIsBomb = isBomb;
        bombGameOver = false;
        restartBtn.style.display = "none";
        playSound(gameOverSound);
      }

      function finishDeath() {
        deathPending = false;
        bombGameOver = deathIsBomb;
        gameOver = true;
        restartBtn.style.display = "inline-block";
      }

      function gameOverNow(isBomb = false) {
        bombGameOver = isBomb;
        finishDeath();
      }

      // ==================== 绘制 ====================
      function drawGame() {
        drawBackground();

        if (gameOver) {
          drawGameOverText();
          return;
        }

        foods.forEach(drawFood);
        updateModeStatus();
        drawScorePopups();
        drawSnake();

        if (gamePaused) {
          drawPauseOverlay();
          return;
        }

        if (deathPending) {
          drawDeathOverlay();

          if (getGameTime() - deathStartTime >= deathFreezeTime) {
            finishDeath();
          }

          return;
        }

        pulseTime += foodPulseSpeed * 0.25;
      }

      function drawBackground() {
        const bg = bombGameOver
          ? images.bgBomb
          : isSpeedMode()
            ? images.bgSpeed
            : images.bg;
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = `rgba(0,0,0,${bgMask})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawGameOverText() {
        ctx.fillStyle = "white";
        ctx.font = "32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          bombGameOver ? "" : "熊熊很大，尼吃不下~",
          canvas.width / 2,
          canvas.height / 2 - 30,
        );
      }

      function drawDeathOverlay() {
        const elapsed = getGameTime() - deathStartTime;
        const progress = Math.min(elapsed / deathFreezeTime, 1);
        const alpha = deathOverlayMaxAlpha * progress;

        ctx.save();
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function drawPauseOverlay() {
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("已暂停", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "16px sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.fillText(
          "点击继续按钮恢复游戏",
          canvas.width / 2,
          canvas.height / 2 + 24,
        );
        ctx.restore();
      }

      function getDeathShakeOffset() {
        if (!deathPending) return { x: 0, y: 0 };

        const elapsed = getGameTime() - deathStartTime;
        if (elapsed > deathShakeDuration) return { x: 0, y: 0 };

        const strength =
          deathShakeStrength * (1 - elapsed / deathShakeDuration);
        return {
          x: (Math.random() * 2 - 1) * strength,
          y: (Math.random() * 2 - 1) * strength,
        };
      }

      function drawFood(food) {
        const x = food.x * size;
        const y = food.y * size;
        const pulse = Math.sin(pulseTime) * foodPulseSize;
        const alpha = getFoodAlpha(food);
        const ringColor = resolveDrawColor(getFoodRingColor(food));

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = ringColor;
        ctx.shadowBlur = foodGlow;
        ctx.beginPath();
        ctx.arc(x + size / 2, y + size / 2, size / 2 + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = foodStrokeWidth;
        ctx.stroke();
        drawCircleImage(getFoodImage(food.type), x, y);
        ctx.restore();
      }

      function getFoodRingColor(food) {
        if (food.type === FOOD_BOMB) return "#FF4444";
        if (food.type === FOOD_HR || isHrMode()) return hrInfoColor;
        return getMultiplierColor();
      }

      function getFoodAlpha(food) {
        let alpha = 1;

        if (food.type === FOOD_BOMB) {
          alpha *= getBobWarningAlpha(food);
        }

        if (!food.removingAt) return alpha;

        const elapsed = getGameTime() - food.removingAt;
        const fadeAlpha = Math.max(
          1 - elapsed / foodDisappearDuration,
          foodMinAlpha,
        );
        const blinkOn = Math.floor(getGameTime() / foodBlinkSpeed) % 2 === 0;
        return alpha * (blinkOn ? fadeAlpha : foodMinAlpha);
      }

      function getBobWarningAlpha(food) {
        if (food.type !== FOOD_BOMB) return 1;

        const elapsed =
          getGameTime() - (food.warningStartedAt || food.createdAt);
        const progress = Math.min(elapsed / bobWarningDuration, 1);
        return bobWarningMinAlpha + (1 - bobWarningMinAlpha) * progress;
      }

      function isBobDangerous(food) {
        if (!food || food.type !== FOOD_BOMB) return false;
        return (
          getGameTime() - (food.warningStartedAt || food.createdAt) >=
          bobWarningDuration
        );
      }

      function updateModeStatus() {
        if (!statusBar) return;

        if (isHrMode()) {
          const remain = Math.max(
            0,
            Math.ceil((hrModeEndTime - getGameTime()) / 1000),
          );
          statusBar.textContent = `👔 HR裁员中  ${remain}s`;
          statusBar.style.color = hrInfoColor;
          return;
        }

        if (!isSpeedMode()) {
          statusBar.textContent = "普通模式";
          statusBar.style.color = "rgba(255, 255, 255, 0.78)";
          return;
        }

        const remain = Math.max(
          0,
          Math.ceil((speedModeEndTime - getGameTime()) / 1000),
        );
        const multiplier = getScoreMultiplier();

        if (isMaxSpeedMode()) {
          statusBar.textContent = `🔥 MAX 波波！ 倍率 x${multiplier}  ${remain}s`;
          statusBar.style.color = getRainbowColor();
          return;
        }

        statusBar.textContent = `⚡ 波波 Lv.${speedLevel}  倍率 x${multiplier}  ${remain}s后降层`;
        statusBar.style.color = resolveDrawColor(getMultiplierColor());
      }

      function drawScorePopups() {
        scorePopups.forEach((popup) => {
          drawPopup(popup);
          popup.y -= popupRiseSpeed;
          popup.life -= 0.8;
        });
        scorePopups = scorePopups.filter((popup) => popup.life > 0);
      }

      function drawSnake() {
        const shake = getDeathShakeOffset();

        snake.forEach((p, index) => {
          const prev = prevSnake[index] || p;
          const pos = getRenderPosition(p, prev);
          const x = pos.x + shake.x;
          const y = pos.y + shake.y;

          if (index === 0) {
            drawHead(x, y, getDirectionFromTo(prev, p));
          } else {
            drawBodyPart(p, index, x, y);
          }
        });
      }

      function drawHead(x, y, direction) {
        headTargetAngle = getAngleByDirection(direction);
        headCurrentAngle = lerpAngle(headCurrentAngle, headTargetAngle, 0.25);

        const elapsed = getGameTime() - eatingStartTime;
        const isEating = elapsed < eatingDuration;
        const img = isEating ? images.headEat : images.head;
        let drawSize = size;
        let offset = 0;

        if (isEating) {
          const progress = elapsed / eatingDuration;
          const wave = Math.sin(progress * Math.PI);
          drawSize = size * (eatHeadMinScale + wave * eatHeadScaleRange);
          offset = (size - drawSize) / 2;
        }

        if (isMaxSpeedMode()) {
          ctx.save();
          ctx.shadowColor = getRainbowColor();
          ctx.shadowBlur = 25;
          drawRotatedCircleImageByAngle(
            img,
            x + offset,
            y + offset,
            drawSize,
            headCurrentAngle,
          );
          ctx.restore();
          return;
        }

        drawRotatedCircleImageByAngle(
          img,
          x + offset,
          y + offset,
          drawSize,
          headCurrentAngle,
        );
      }

      function drawBodyPart(p, index, x, y) {
        const skinType = bodySkins[index - 1] || "body";
        const prevPart = snake[index - 1];
        const direction = getDirectionFromTo(p, prevPart);
        drawRotatedCircleImage(getBodyImage(skinType), x, y, size, direction);
      }

      function drawCircleImage(img, x, y, drawSize = size) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(
          x + drawSize / 2,
          y + drawSize / 2,
          drawSize / 2,
          0,
          Math.PI * 2,
        );
        ctx.clip();
        ctx.drawImage(img, x, y, drawSize, drawSize);
        ctx.restore();
      }

      function drawRotatedCircleImage(
        img,
        x,
        y,
        drawSize = size,
        direction = { x: 1, y: 0 },
      ) {
        drawRotatedCircleImageByAngle(
          img,
          x,
          y,
          drawSize,
          getAngleByDirection(direction),
        );
      }

      function drawRotatedCircleImageByAngle(
        img,
        x,
        y,
        drawSize = size,
        angle = 0,
      ) {
        ctx.save();
        ctx.translate(x + drawSize / 2, y + drawSize / 2);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.arc(0, 0, drawSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
        ctx.restore();
      }

      function drawPopup(popup) {
        const alpha = popup.life / popup.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = resolveDrawColor(popup.color);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = popupStrokeWidth;
        ctx.font = `bold ${popup.fontSize || popupFontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.strokeText(popup.text, popup.x + size / 2, popup.y + popupYOffset);
        ctx.fillText(popup.text, popup.x + size / 2, popup.y + popupYOffset);
        ctx.restore();
      }

      function addScorePopup(
        x,
        y,
        text,
        color = "#ffffff",
        fontSize = popupFontSize,
      ) {
        scorePopups.push({
          x,
          y,
          text,
          color,
          fontSize,
          life: popupLife,
          maxLife: popupLife,
        });
      }

      // ==================== 工具函数 ====================
      function copyPoint(p) {
        return { x: p.x, y: p.y };
      }

      function wrapPoint(p) {
        return {
          x: (p.x + count) % count,
          y: (p.y + count) % count,
        };
      }

      function getWrappedDelta(to, from) {
        let d = to - from;
        if (d > count / 2) d -= count;
        if (d < -count / 2) d += count;
        return d;
      }

      function getDirectionFromTo(from, to) {
        const dx = getWrappedDelta(to.x, from.x);
        const dy = getWrappedDelta(to.y, from.y);
        return { x: Math.sign(dx), y: Math.sign(dy) };
      }

      function getRenderPosition(p, prev) {
        const dx = getWrappedDelta(p.x, prev.x);
        const dy = getWrappedDelta(p.y, prev.y);
        let x = prev.x + dx * moveProgress;
        let y = prev.y + dy * moveProgress;

        if (x < 0) x += count;
        if (x >= count) x -= count;
        if (y < 0) y += count;
        if (y >= count) y -= count;

        return { x: x * size, y: y * size };
      }

      function getAngleByDirection(direction) {
        if (direction.y === 1) return 0;
        if (direction.x === -1) return Math.PI / 2;
        if (direction.y === -1) return Math.PI;
        if (direction.x === 1) return -Math.PI / 2;
        return headCurrentAngle;
      }

      function lerpAngle(current, target, amount) {
        let diff = target - current;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        return current + diff * amount;
      }

      function getFoodImage(type) {
        if (type === FOOD_SPEED) return images.bobo;
        if (type === FOOD_TRIPLE) return images.hehezi;
        if (type === FOOD_BOMB) return images.bob;
        if (type === FOOD_HR) return images.hr;
        if (type === FOOD_AZHU) return images.azhu;
        return images.body;
      }

      function getBodyImage(type) {
        if (type === "hehezi") return images.hehezi;
        if (type === "xiaobai") return images.xiaobai;
        if (type === "xiaomao") return images.xiaomao;
        if (type === "azhu") return images.azhu;
        if (type === "outsource") return images.outsource;
        return images.body;
      }

      function playSound(sound) {
        if (!musicEnabled) return;
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }

      // ==================== 动画循环 ====================
      function gameFrame(now) {
        if (
          gameStarted &&
          !gameOver &&
          !deathPending &&
          !gamePaused &&
          now - lastMoveTime >= moveDelay
        ) {
          prevSnake = snake.map(copyPoint);
          updateGameLogic();
          lastMoveTime = now;
          moveProgress = 0;
        }

        if (gamePaused) {
          moveProgress = moveProgress;
        } else if (deathPending) {
          moveProgress = Math.min(
            ((now - lastMoveTime) / moveDelay) * deathSlowMotionScale,
            1,
          );
        } else {
          moveProgress = Math.min((now - lastMoveTime) / moveDelay, 1);
        }

        if (gameStarted) drawGame();
        animationId = requestAnimationFrame(gameFrame);
      }

      // ==================== 资源加载 ====================
      const assetDisplayNames = {
        head: "熊头",
        headEat: "吃东西表情",
        body: "普通身体",
        bg: "普通背景",
        bgSpeed: "波波背景",
        bgBomb: "Bob结局背景",
        bobo: "波波",
        hehezi: "贺贺子",
        xiaobai: "小白身体",
        xiaomao: "小毛身体",
        bob: "Bob危险食物",
        hr: "HR裁员食物",
        azhu: "阿朱食物",
        outsource: "外包身体",
      };

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function drawLoadingScreen(progress, currentName = "") {
        ctx.save();
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(255,184,0,0.12)";
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2 - 30, 115, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🐻 贪吃熊", canvas.width / 2, canvas.height / 2 - 58);

        ctx.font = "16px sans-serif";
        ctx.fillText(
          "正在加载游戏资源...",
          canvas.width / 2,
          canvas.height / 2 - 24,
        );

        const barX = 72;
        const barY = canvas.height / 2 + 4;
        const barW = canvas.width - barX * 2;
        const barH = 14;
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        roundRect(barX, barY, barW, barH, 7);
        ctx.fill();
        ctx.fillStyle = "#ffb800";
        roundRect(barX, barY, barW * (progress / 100), barH, 7);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(`${progress}%`, canvas.width / 2, canvas.height / 2 + 45);

        if (currentName) {
          ctx.font = "12px sans-serif";
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fillText(
            `正在加载：${currentName}`,
            canvas.width / 2,
            canvas.height / 2 + 68,
          );
        }

        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function updateLoadingUI(progress, currentName = "", assetStates = {}) {
        startBtn.textContent = `资源加载中 ${progress}%`;
        loadingBar.style.width = `${progress}%`;
        loadingPercent.textContent = `${progress}%`;

        if (progress >= 100) {
          loadingText.textContent = "资源加载完成，准备开始！";
        } else if (currentName) {
          loadingText.textContent = `正在加载：${currentName}`;
        } else {
          loadingText.textContent = "正在加载游戏资源...";
        }

        const rows = Object.entries(assetDisplayNames)
          .map(([key, label]) => {
            const state = assetStates[key] || "pending";
            if (state === "done") {
              return `<div class="loadingAssetDone">✔ ${label}</div>`;
            }
            if (state === "failed") {
              return `<div class="loadingAssetFailed">✘ ${label} 加载失败</div>`;
            }
            if (state === "current") {
              return `<div class="loadingAssetCurrent">⏳ ${label}</div>`;
            }
            return `<div>○ ${label}</div>`;
          })
          .join("");

        loadingAssetList.innerHTML = rows;
        drawLoadingScreen(progress, currentName);
      }

      function preloadImages() {
        const imageList = Object.entries(images);
        const total = imageList.length;
        const assetStates = {};
        let loaded = 0;

        updateLoadingUI(0, "", assetStates);

        return Promise.all(
          imageList.map(
            ([name, img]) =>
              new Promise((resolve) => {
                const displayName = assetDisplayNames[name] || name;
                assetStates[name] = "current";
                updateLoadingUI(
                  Math.round((loaded / total) * 100),
                  displayName,
                  assetStates,
                );

                function finish(success) {
                  loaded += 1;
                  assetStates[name] = success ? "done" : "failed";
                  const progress = Math.round((loaded / total) * 100);
                  updateLoadingUI(progress, displayName, assetStates);
                  resolve();
                }

                if (img.complete && img.naturalWidth > 0) {
                  finish(true);
                  return;
                }

                img.onload = () => finish(true);
                img.onerror = () => {
                  console.warn(`图片加载失败: ${name}`, img.src);
                  finish(false);
                };
              }),
          ),
        );
      }

      preloadImages().then(async () => {
        updateLoadingUI(100);

        if (DEBUG_LOADING) {
          await sleep(DEBUG_LOADING_DELAY);
        } else {
          await sleep(350);
        }

        assetsLoaded = true;
        startBtn.disabled = false;
        startBtn.textContent = "开始游戏";
        loadingOverlay.style.display = "none";
        drawBackground();
      });
    </script>
  </body>
</html>
