<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>打工人生存法则——贪吃经理</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        background: #222;
        color: white;
        text-align: center;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body.gameActive {
        align-items: center;
        justify-content: center;
      }

      body.gameActive #topBar {
        margin-top: 0;
        margin-bottom: 6px;
      }

      #gameShell {
        width: min(92vw, 78vh, 600px);
        max-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #gameArea {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        flex: 0 0 auto;
      }

      canvas {
        background: #111;
        display: block;
        margin: 0 auto;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      button {
        border: none;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #topBar,
      #bottomBar {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #topBar {
        margin-top: 10px;
        margin-bottom: 6px;
        justify-content: center;
      }

      #bottomBar {
        margin-top: 8px;
        margin-bottom: 8px;
        justify-content: center;
        flex-direction: column;
      }

      #scorePanel {
        font-size: 24px;
        font-weight: bold;
      }

      #startHint {
        position: absolute;
        left: 50%;
        top: calc(50% + 54px);
        transform: translateX(-50%);
        width: 86%;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        z-index: 998;
        pointer-events: none;
      }

      #statusPanel {
        width: 100%;
        max-width: 100%;
        margin-bottom: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
      }

      #buffRow {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
      }

      .buffStatus {
        height: 24px;
        box-sizing: border-box;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(0, 0, 0, 0.44);
        color: rgba(255, 255, 255, 0.38);
        font-size: 12px;
        font-weight: bold;
        line-height: 22px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.45);
      }

      .buffStatus.active {
        color: white;
      }

      #teamStatus.active {
        border-color: rgba(77, 208, 225, 0.92);
        background: rgba(77, 208, 225, 0.26);
        box-shadow:
          0 0 10px rgba(77, 208, 225, 0.45),
          inset 0 0 12px rgba(77, 208, 225, 0.2);
      }

      #hrStatus.active {
        border-color: rgba(179, 136, 255, 0.95);
        background: rgba(179, 136, 255, 0.25);
        box-shadow:
          0 0 10px rgba(179, 136, 255, 0.42),
          inset 0 0 12px rgba(179, 136, 255, 0.18);
      }

      #shieldStatus.active {
        border-color: rgba(52, 226, 122, 0.95);
        background: rgba(52, 226, 122, 0.24);
        box-shadow:
          0 0 10px rgba(52, 226, 122, 0.45),
          inset 0 0 12px rgba(52, 226, 122, 0.18);
      }

      #overtimeBar {
        position: relative;
        width: 100%;
        height: 30px;
        box-sizing: border-box;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        background: rgba(0, 0, 0, 0.58);
        overflow: hidden;
        box-shadow:
          0 0 10px rgba(255, 255, 255, 0.12),
          inset 0 0 12px rgba(0, 0, 0, 0.85);
      }

      #overtimeFill {
        position: absolute;
        left: 3px;
        top: 3px;
        bottom: 3px;
        width: calc(100% - 6px);
        border-radius: 999px;
        background: linear-gradient(90deg, #555, #777);
        transform: scaleX(1);
        transform-origin: left center;
        transition:
          transform 0.1s linear,
          background 0.16s linear;
        box-shadow:
          inset 0 2px 5px rgba(255, 255, 255, 0.32),
          0 0 10px rgba(255, 255, 255, 0.12);
      }

      #overtimeText {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        box-sizing: border-box;
        color: white;
        font-size: 14px;
        font-weight: 900;
        line-height: 30px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow:
          0 2px 4px rgba(0, 0, 0, 0.95),
          0 0 4px rgba(0, 0, 0, 0.9);
      }

      #controlButtons {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #pauseBtn,
      #fullscreenBtn,
      #musicBtn,
      #leaderboardBtn {
        padding: 6px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.4);
        color: white;
      }

      #startBtn,
      #restartBtn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 30px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 12px;
        color: white;
        z-index: 999;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      #startBtn {
        background: #4caf50;
      }

      #startBtn:disabled {
        background: #666;
        cursor: default;
        opacity: 0.85;
      }

      #restartBtn {
        display: none;
        background: #ffb800;
        opacity: 0;
        transition: opacity 0.45s ease;
      }

      #loadingOverlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at center,
            rgba(255, 184, 0, 0.18),
            transparent 38%
          ),
          linear-gradient(180deg, #1e1e1e 0%, #101010 100%);
        color: white;
      }

      #loadingCard {
        width: min(82vw, 420px);
        padding: 26px 24px 22px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.42);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      }

      #loadingTitle {
        font-size: 34px;
        font-weight: 900;
        margin-bottom: 10px;
      }

      #loadingText {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.82);
        margin-bottom: 14px;
      }

      #loadingBarWrap {
        width: 100%;
        height: 18px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.16);
        margin-bottom: 12px;
      }

      #loadingBar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4caf50, #ffb800);
        transition: width 0.2s ease;
      }

      #loadingPercent {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      #loadingAssetList {
        display: none;
      }

      .loadingAssetDone {
        color: rgba(144, 238, 144, 0.95);
      }

      .loadingAssetFailed {
        color: rgba(255, 120, 120, 0.95);
      }

      .loadingAssetCurrent {
        color: #ffdf6e;
      }

      #loadingDevTip {
        display: none;
        margin-top: 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.48);
      }

      #version {
        position: fixed;
        right: 10px;
        bottom: 10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        z-index: 9999;
        pointer-events: none;
      }


      #leaderboardBtn {
        padding: 6px 12px;
        border-radius: 10px;
        background: rgba(255, 184, 0, 0.92);
        color: #2b1b00;
        font-weight: 900;
      }

      #leaderboardModal {
        position: fixed;
        inset: 0;
        z-index: 1800;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        padding: 18px;
        box-sizing: border-box;
      }

      #leaderboardCard {
        width: min(92vw, 430px);
        max-height: min(86vh, 680px);
        display: flex;
        flex-direction: column;
        border-radius: 22px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(36, 30, 18, 0.98), rgba(15, 15, 15, 0.98));
        border: 2px solid rgba(255, 184, 0, 0.56);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      }

      #leaderboardHeader {
        padding: 16px 18px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      #leaderboardTitle {
        font-size: 24px;
        font-weight: 900;
        color: #ffcf4a;
        text-align: left;
      }

      #leaderboardCloseBtn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        font-size: 22px;
        font-weight: 900;
      }

      #playerNameRow {
        display: flex;
        gap: 8px;
        padding: 0 18px 12px;
      }

      #playerNameInput {
        flex: 1;
        min-width: 0;
        height: 42px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 12px;
        padding: 0 12px;
        outline: none;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 16px;
      }

      #leaderboardOptions {
        padding: 0 18px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: left;
      }

      .leaderboardOption {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.78);
        line-height: 1.25;
      }

      .leaderboardOption input {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        accent-color: #ffb800;
      }

      #leaderboardList {
        padding: 0 14px 16px;
        overflow: auto;
      }

      .leaderboardItem {
        display: grid;
        grid-template-columns: 42px 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        margin: 6px 0;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        color: white;
        box-sizing: border-box;
      }

      .leaderboardItem.mine {
        background: rgba(255, 184, 0, 0.22);
        outline: 1px solid rgba(255, 184, 0, 0.5);
      }

      .leaderboardRank {
        font-weight: 900;
        color: #ffcf4a;
        font-size: 18px;
      }

      .leaderboardName {
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 800;
      }

      .leaderboardScore {
        font-size: 18px;
        font-weight: 900;
        color: #ffffff;
      }
      .leaderboardMeTag {
        margin-left: 6px;
        color: #ffdf6e;
        font-size: 12px;
        font-weight: 900;
        white-space: nowrap;
      }

      .leaderboardState {
        min-height: 74px;
        margin: 6px 0;
        padding: 18px 12px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.78);
        background: rgba(255, 255, 255, 0.07);
        box-sizing: border-box;
      }

      .leaderboardRetry {
        color: #ffdf6e;
        font-weight: 900;
        text-decoration: underline;
      }

      .leaderboardRankPulse {
        animation: leaderboardRankPulse 0.8s ease both;
      }

      @keyframes leaderboardRankPulse {
        0% { transform: scale(1); }
        35% { transform: scale(1.045); box-shadow: 0 0 18px rgba(255, 184, 0, 0.38); }
        100% { transform: scale(1); }
      }


      #leaderboardActions {
        display: flex;
        gap: 8px;
        padding: 0 18px 18px;
      }

      #submitScoreBtn {
        flex: 1;
        min-height: 46px;
        border-radius: 14px;
        color: white;
        font-weight: 900;
        font-size: 16px;
      }

      #submitScoreBtn {
        background: #ff9800;
      }

      #leaderboardToast {
        min-height: 18px;
        padding: 0 18px 12px;
        color: #ffdf6e;
        font-size: 13px;
      }

      @media (max-width: 640px) {
        #gameShell {
          width: min(94vw, 78vh);
        }

        #topBar {
          margin-top: 0;
          margin-bottom: 8px;
        }

        #scorePanel {
          font-size: clamp(18px, 6vw, 30px);
        }

        #statusPanel {
          margin-bottom: 6px;
          gap: 4px;
        }

        .buffStatus {
          height: 23px;
          font-size: 11px;
          line-height: 21px;
        }

        #overtimeBar {
          height: 28px;
        }

        #overtimeText {
          font-size: 12px;
          line-height: 28px;
        }

        #controlButtons {
          width: 100%;
          justify-content: center;
        }

        #leaderboardActions {
          flex-wrap: wrap;
        }

        #submitScoreBtn {
          min-width: 120px;
        }

        #pauseBtn,
        #fullscreenBtn,
        #musicBtn,
        #leaderboardBtn {
          min-width: 54px;
          min-height: 54px;
          padding: 8px 12px;
          font-size: 16px;
          border-radius: 14px;
          white-space: normal;
        }

        #startHint {
          top: calc(50% + 52px);
          font-size: 14px;
        }
      }

      @media (orientation: landscape) and (max-height: 640px) {
        body {
          align-items: center;
          justify-content: center;
        }

        #gameShell {
          width: 100vw;
          height: 100svh;
          max-height: none;
          box-sizing: border-box;
          padding: 8px 10px;
          display: grid;
          grid-template-columns: min(72vw, calc(100svh - 76px)) auto;
          grid-template-rows: auto auto min(72vw, calc(100svh - 106px));
          grid-template-areas:
            "top controls"
            "status controls"
            "game controls";
          justify-content: center;
          align-content: center;
          align-items: center;
          column-gap: 10px;
          row-gap: 6px;
        }

        #topBar {
          grid-area: top;
          width: 100%;
          margin: 0;
          gap: 16px;
        }

        #scorePanel {
          font-size: clamp(18px, 5vh, 28px);
          line-height: 1;
          white-space: nowrap;
        }

        #statusPanel {
          grid-area: status;
          width: 100%;
          margin: 0;
          gap: 3px;
        }

        #gameArea {
          grid-area: game;
          width: min(72vw, calc(100svh - 106px));
          height: min(72vw, calc(100svh - 106px));
        }

        #bottomBar {
          grid-area: controls;
          width: auto;
          margin: 0;
          align-self: center;
          justify-self: center;
          flex-direction: column;
        }

        .buffStatus {
          height: 21px;
          font-size: 10px;
          line-height: 19px;
        }

        #overtimeBar {
          height: 25px;
        }

        #overtimeText {
          font-size: 11px;
          line-height: 25px;
          padding: 0 6px;
        }

        #controlButtons {
          width: auto;
          flex-direction: column;
          justify-content: center;
          gap: 8px;
        }

        #pauseBtn,
        #fullscreenBtn,
        #musicBtn,
        #leaderboardBtn {
          width: 64px;
          min-height: 54px;
          padding: 8px 10px;
          font-size: 15px;
          line-height: 1.25;
          border-radius: 14px;
          white-space: normal;
        }

        #startBtn,
        #restartBtn {
          padding: 12px 26px;
          font-size: 18px;
        }

        #startHint {
          top: calc(50% + 50px);
          font-size: 13px;
          line-height: 1.45;
        }

        #version {
          right: 8px;
          bottom: 6px;
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <div id="gameShell">
      <div id="topBar">
        <div id="scorePanel">
          分数：<span id="score">0</span> 最高分：<span id="bestScore">0</span>
        </div>
      </div>

      <div id="statusPanel">
        <div id="buffRow">
          <div id="teamStatus" class="buffStatus">🎲 团建 --</div>
          <div id="hrStatus" class="buffStatus">📉 裁员 --</div>
          <div id="shieldStatus" class="buffStatus">🛡 背锅 --</div>
        </div>
        <div id="overtimeBar">
          <div id="overtimeFill"></div>
          <div id="overtimeText">正常上班 工资×1</div>
        </div>
      </div>

      <div id="gameArea">
        <canvas id="game" width="384" height="384"></canvas>
        <button id="startBtn" type="button">开始游戏</button>
        <button id="restartBtn" type="button">重新开始</button>
        <div id="startHint">方向键 / 滑动屏幕控制，P暂停，空格重开</div>
      </div>

      <div id="bottomBar">
        <div id="controlButtons">
          <button id="pauseBtn" type="button">⏸ 暂停</button>
          <button id="fullscreenBtn" type="button">⛶ 全屏</button>
          <button id="musicBtn" type="button">🔇静音</button>
          <button id="leaderboardBtn" type="button">🏆 排行榜</button>
        </div>
      </div>
    </div>

    <div id="loadingOverlay">
      <div id="loadingCard">
        <div id="loadingTitle">👔 打工人生存法则——贪吃经理</div>
        <div id="loadingText">正在加载游戏资源...</div>
        <div id="loadingBarWrap"><div id="loadingBar"></div></div>
        <div id="loadingPercent">0%</div>
        <div id="loadingAssetList"></div>
        <div id="loadingDevTip">开发模式：已开启强制加载延迟</div>
      </div>
    </div>


    <div id="leaderboardModal">
      <div id="leaderboardCard">
        <div id="leaderboardHeader">
          <div id="leaderboardTitle">🏆 打工排行榜</div>
          <button id="leaderboardCloseBtn" type="button">×</button>
        </div>
        <div id="playerNameRow">
          <input id="playerNameInput" maxlength="12" placeholder="输入你的昵称，提交时自动保存" inputmode="text" autocomplete="nickname" />
        </div>
        <div id="leaderboardOptions">
          <label class="leaderboardOption"><input id="autoSubmitBestScoreCheckbox" type="checkbox" checked /> 自动上传最高分</label>
          <label class="leaderboardOption"><input id="suppressLeaderboardPopupCheckbox" type="checkbox" /> 游戏结束后不再弹出排行榜</label>
        </div>
        <div id="leaderboardList"></div>
        <div id="leaderboardToast"></div>
        <div id="leaderboardActions">
          <button id="submitScoreBtn" type="button">提交最高分</button>
        </div>
      </div>
    </div>

    <div id="version"></div>

    <script src="config.js"></script>
    <script src="leaderboard.js"></script>
    <script>
      const GAME_VERSION = (window.CONFIG && CONFIG.VERSION) || "v1.9.1-online-leaderboard";

      // ==================== 调试参数 / Game Balance ====================

      // 开发模式
      const DEBUG_LOADING = false; // true：强制显示加载页，方便测试；发布时改成 false
      const DEBUG_LOADING_DELAY = 5000; // 开发模式下，资源加载完成后额外停留时间(ms)

      // 地图
      const size = 32; // 单格大小(px)

      // 游戏节奏
      const speed = 200; // 普通速度，越小越快
      const maxSpeedLevel = 5; // 加班阶段：0正常，1提提神，2轻度加班，3中度加班，4疯狂加班，5通宵爆肝，5通宵爆肝
      const speedLevelDurations = [0, 7000, 7000, 9000, 7000, 5000]; // 第0项不用，提提神7秒，轻度7秒，中度9秒，疯狂7秒，通宵5秒
      const coffeeExtendTime = 3000; // 吃咖啡先续杯3秒；续杯后超过当前阶段最大时长才升档
      const speedLevelDelays = [240, 200, 190, 175, 150, 125]; // 每阶段速度
      const scoreMultipliers = [1, 1, 2, 2, 3, 4]; // 工资倍率：正常x1，提提神x1，轻度x2，中度x2，疯狂x3，通宵x4
      const speedInfoFontSize = 12; // 状态栏字体大小

      // 裁员模式
      const hrModeDuration = 5000; // 裁员模式持续时间(ms)
      const hrShrinkOnEat = 0; // 吃到裁员通知时立即减少的身体长度
      const hrShrinkNormal = 1; // 裁员模式吸收普通职员减少长度
      const hrInfoColor = "#B388FF"; // 裁员提示颜色

      // 背锅侠模式
      const shieldModeDuration = 3000; // 背锅侠模式持续时间(ms)
      const shieldInfoColor = "#34E27A"; // 背锅侠护盾颜色
      const shieldWarningTime = 1000; // 背锅侠剩余多少毫秒开始闪烁
      const shieldRingRadius = 24; // 背锅侠护盾基础半径(px)
      const shieldRingPulse = 4; // 背锅侠护盾呼吸幅度(px)

      // 团建模式
      const teamModeDuration = 3000; // 团建模式持续时间(ms)
