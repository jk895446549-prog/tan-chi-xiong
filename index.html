          const dx = touchMoveX - touchStartX;
          const dy = touchMoveY - touchStartY;
          const minSwipeDistance = 18;

          if (
            Math.abs(dx) < minSwipeDistance &&
            Math.abs(dy) < minSwipeDistance
          )
            return;

          if (Math.abs(dx) > Math.abs(dy)) {
            setNextDirection(Math.sign(dx), 0);
          } else {
            setNextDirection(0, Math.sign(dy));
          }

          touchStartX = touchMoveX;
          touchStartY = touchMoveY;
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          if (isButtonTouch(e)) return;
          if (gameStarted) e.preventDefault();
        },
        { passive: false },
      );

      function isTypingTarget(target) {
        return Boolean(target && target.closest && target.closest("input, textarea, select"));
      }

      function isButtonTouch(e) {
        return Boolean(
          e.target.closest &&
            e.target.closest("button, input, textarea, select, label, #leaderboardModal"),
        );
      }

      function setNextDirection(x, y) {
        if (directionChangedThisStep) return;
        if (x !== 0 && dir.x === -x) return;
        if (y !== 0 && dir.y === -y) return;
        if (x === dir.x && y === dir.y) return;

        nextDir = { x, y };
        directionChangedThisStep = true;
      }

      // ==================== 游戏逻辑 ====================
      function isSpeedMode() {
        return speedLevel > 0 && getGameTime() <= speedModeEndTime;
      }

      function isHrMode() {
        return getGameTime() <= hrModeEndTime;
      }

      function isShieldMode() {
        return getGameTime() <= shieldModeEndTime;
      }

      function isTeamMode() {
        return getGameTime() <= teamModeEndTime;
      }

      function startShieldMode() {
        shieldModeEndTime = getGameTime() + shieldModeDuration;
      }

      function startTeamMode() {
        teamModeEndTime = getGameTime() + teamModeDuration;
      }

      function startHrMode() {
        if (isHrMode()) return;
        hrModeEndTime = getGameTime() + hrModeDuration;
        lastHrModeTick = getGameTime();
      }

      function pauseSpeedModeDuringHr() {
        if (!isHrMode()) {
          lastHrModeTick = 0;
          return;
        }

        if (speedLevel <= 0) return;

        const now = getGameTime();

        if (lastHrModeTick > 0) {
          speedModeEndTime += now - lastHrModeTick;
        }

        lastHrModeTick = now;
      }

      function getScoreMultiplier() {
        return scoreMultipliers[speedLevel] || 1;
      }

      function isMaxSpeedMode() {
        return speedLevel >= maxSpeedLevel && isSpeedMode();
      }

      function getRainbowColor() {
        const hue = (getGameTime() * 0.18) % 360;
        return `hsl(${hue}, 100%, 62%)`;
      }

      function resolveDrawColor(color) {
        return color === "rainbow" ? getRainbowColor() : color;
      }

      function getMultiplierColor() {
        if (isMaxSpeedMode()) return "rainbow";
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreColors[level];
      }

      function getMultiplierFontSize() {
        const level = Math.min(speedLevel, maxSpeedLevel);
        return popupScoreFontSizes[level];
      }

      function getTargetFoodCount() {
        if (!isSpeedMode()) return normalFoodCount;

        return (
          speedModeFoodCounts[speedLevel] || speedModeFoodCounts[maxSpeedLevel]
        );
      }

      function randomFoodType() {
        const level = Math.min(Math.max(speedLevel, 0), maxSpeedLevel);
        const rates = stageSpawnRates[level] || stageSpawnRates[0];
        const r = Math.random();
        let t = 0;

        t += rates.normal || 0;
        if (r < t) return FOOD_NORMAL;
        t += rates.coffee || 0;
        if (r < t) return FOOD_SPEED;
        t += rates.triple || 0;
        if (r < t) return FOOD_TRIPLE;
        t += rates.azhu || 0;
        if (r < t) return FOOD_AZHU;
        t += rates.ai || 0;
        if (r < t) return FOOD_AI;
        t += rates.intern || 0;
        if (r < t) return FOOD_INTERN;
        t += rates.dog || 0;
        if (r < t) return FOOD_DOG;
        t += rates.layoff || 0;
        if (r < t) return FOOD_HR;
        t += rates.pot || 0;
        if (r < t) return FOOD_POT;
        t += rates.dice || 0;
        if (r < t) return FOOD_DICE;
        return FOOD_BOMB;
      }

      function createOneFood() {
        let food;
        do {
          const type = randomFoodType();
          const now = getGameTime();
          food = {
            x: Math.floor(Math.random() * count),
            y: Math.floor(Math.random() * count),
            type,
            createdAt:
              type === FOOD_BOMB
                ? now
                : now - Math.random() * foodLifeRandomOffset,
            warningStartedAt: type === FOOD_BOMB ? now : 0,
          };
        } while (isOccupied(food.x, food.y));
        return food;
      }

      function isOccupied(x, y) {
        return (
          snake.some((p) => p.x === x && p.y === y) ||
          foods.some((f) => f.x === x && f.y === y)
        );
      }

      function isEmployeeFood(type) {
        return [
          FOOD_NORMAL,
          FOOD_TRIPLE,
          FOOD_AZHU,
          FOOD_AI,
          FOOD_INTERN,
          FOOD_DOG,
        ].includes(type);
      }

      function isItemFood(type) {
        return [FOOD_SPEED, FOOD_HR, FOOD_POT, FOOD_DICE].includes(type);
      }

      function getEmployeeShrinkCount(type) {
        if (type === FOOD_NORMAL) return 1;
        if (type === FOOD_TRIPLE) return 3;
        if (type === FOOD_AZHU) return azhuBodyCount + outsourceBodyCount;
        if (type === FOOD_AI) return 0;
        if (type === FOOD_INTERN) return 1;
        if (type === FOOD_DOG) return 1;
        return 0;
      }

      function getGridDistance(a, b) {
        const dx = Math.abs(getWrappedDelta(a.x, b.x));
        const dy = Math.abs(getWrappedDelta(a.y, b.y));
        return Math.max(dx, dy);
      }

      function absorbNearbyEmployees() {
        if (!isTeamMode() || snake.length <= 0) return;

        const head = snake[0];
        const nearbyEmployees = foods.filter(
          (food) =>
            !food.removingAt &&
            isEmployeeFood(food.type) &&
            getGridDistance(food, head) <= teamAbsorbRange,
        );

        nearbyEmployees.forEach((food) => {
          foods = foods.filter((f) => f !== food);

          teamAbsorbAnimations.push({
            food,
            fromX: food.x * size,
            fromY: food.y * size,
            startedAt: getGameTime(),
            handled: false,
          });
        });
      }

      function updateTeamAbsorbAnimations() {
        if (teamAbsorbAnimations.length === 0) return;

        teamAbsorbAnimations.forEach((anim) => {
          if (anim.handled) return;

          const elapsed = getGameTime() - anim.startedAt;
          if (elapsed < teamAbsorbDuration) return;

          anim.handled = true;
          handleEatenFood(anim.food, snake[0], true);
          teamImpactWaves.push({
            x: snake[0].x * size + size / 2,
            y: snake[0].y * size + size / 2,
            startedAt: getGameTime(),
          });
          addScorePopup(
            snake[0].x * size,
            snake[0].y * size,
            "团建+",
            teamInfoColor,
            popupFontSize,
            "公司团建",
          );
        });

        teamAbsorbAnimations = teamAbsorbAnimations.filter(
          (anim) => getGameTime() - anim.startedAt < teamAbsorbDuration + 80,
        );
      }

      function drawTeamVacuumEffect() {
        if (!isTeamMode() || snake.length <= 0) return;

        const headPos = getRenderPosition(snake[0], prevSnake[0] || snake[0]);
        const cx = headPos.x + size / 2;
        const cy = headPos.y + size / 2;
        const t = getGameTime() * 0.006;
        const radius =
          teamVacuumRingRadius + Math.sin(t * 2.4) * teamVacuumRingPulse;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t);

        for (let i = 0; i < 3; i++) {
          const r = radius + i * 8;
          const alpha = 0.34 - i * 0.08;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0.25 + i * 0.9, Math.PI * 1.55 + i * 0.9);
          ctx.strokeStyle = `rgba(77, 208, 225, ${alpha})`;
          ctx.lineWidth = 3 - i * 0.45;
          ctx.shadowColor = teamInfoColor;
          ctx.shadowBlur = 9;
          ctx.stroke();
        }

        ctx.rotate(-t * 1.8);
        ctx.beginPath();
        ctx.arc(0, 0, 8 + Math.sin(t * 5) * 2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.34)";
        ctx.shadowColor = teamInfoColor;
        ctx.shadowBlur = 14;
        ctx.fill();

        ctx.restore();
      }

      function drawTeamAbsorbTrail(fromX, fromY, toX, toY, progress) {
        const startX = fromX + size / 2;
        const startY = fromY + size / 2;
        const endX = toX + size / 2;
        const endY = toY + size / 2;

        ctx.save();
        ctx.globalAlpha = Math.max(0.15, 0.7 * (1 - progress * 0.55));
        ctx.strokeStyle = teamInfoColor;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = teamInfoColor;
        ctx.shadowBlur = 8;

        for (let i = 0; i < 3; i++) {
          const offset = (i - 1) * 5;
          const midX =
            (startX + endX) / 2 + Math.sin(progress * Math.PI + i) * 12;
          const midY =
            (startY + endY) / 2 -
            14 -
            i * 4 +
            Math.cos(progress * Math.PI + i) * 6;

          ctx.beginPath();
          ctx.moveTo(startX + offset, startY - offset);
          ctx.quadraticCurveTo(midX, midY, endX, endY);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawTeamImpactWaves() {
        if (teamImpactWaves.length === 0) return;

        teamImpactWaves.forEach((wave) => {
          const progress = Math.min(
            (getGameTime() - wave.startedAt) / teamImpactDuration,
            1,
          );
          const radius = 6 + progress * 22;
          const alpha = 1 - progress;

          ctx.save();
          ctx.globalAlpha = alpha * 0.7;
          ctx.beginPath();
          ctx.arc(wave.x, wave.y, radius, 0, Math.PI * 2);
          ctx.strokeStyle = teamInfoColor;
          ctx.lineWidth = 3;
          ctx.shadowColor = teamInfoColor;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        });

        teamImpactWaves = teamImpactWaves.filter(
          (wave) => getGameTime() - wave.startedAt < teamImpactDuration,
        );
      }

      function drawTeamAbsorbAnimations() {
        drawTeamVacuumEffect();

        if (teamAbsorbAnimations.length === 0 || snake.length <= 0) {
          drawTeamImpactWaves();
          return;
        }

        const headPos = getRenderPosition(snake[0], prevSnake[0] || snake[0]);
        const targetX = headPos.x;
        const targetY = headPos.y;

        teamAbsorbAnimations.forEach((anim) => {
          const elapsed = getGameTime() - anim.startedAt;
          const rawProgress = Math.min(elapsed / teamAbsorbDuration, 1);
          const progress = 1 - Math.pow(1 - rawProgress, 3);
          const arcLift = Math.sin(rawProgress * Math.PI) * 14;

          const x = anim.fromX + (targetX - anim.fromX) * progress;
          const y = anim.fromY + (targetY - anim.fromY) * progress - arcLift;
          const scale = 1 - rawProgress * 0.22;

          drawTeamAbsorbTrail(
            anim.fromX,
            anim.fromY,
            targetX,
            targetY,
            rawProgress,
          );

          ctx.save();
          ctx.globalAlpha = 1 - rawProgress * 0.12;
          ctx.translate(x + size / 2, y + size / 2);
          ctx.scale(scale, scale);
          ctx.rotate(Math.sin(rawProgress * Math.PI) * 0.22);
          drawCircleImage(getFoodImage(anim.food.type), -size / 2, -size / 2);
          ctx.restore();
        });

        drawTeamImpactWaves();
      }

      function getActiveFoodCount() {
        return foods.filter((food) => !food.removingAt).length;
      }

      function fillFoods() {
        const targetCount = getTargetFoodCount();

        if (foods.length < targetCount) {
          while (foods.length < targetCount) {
            foods.push(createOneFood());
          }
        }

        while (getActiveFoodCount() > targetCount) {
          const activeFoods = foods.filter((food) => !food.removingAt);
          markFoodRemoving(activeFoods[activeFoods.length - 1]);
        }
      }

      function markExpiredFoods() {
        const now = getGameTime();

        foods.forEach((food) => {
          if (food.removingAt) return;

          const lifeTime =
            food.type === FOOD_BOMB ? bombLifeTime : normalFoodLifeTime;

          const age = now - food.createdAt;

          if (age >= lifeTime - foodDisappearDuration) {
            markFoodRemoving(food);
          }
        });

        removeFinishedDisappearingFoods();
      }

      function markFoodRemoving(food) {
        if (!food || food.removingAt) return;
        food.removingAt = getGameTime();
      }

      function removeFinishedDisappearingFoods() {
        const now = getGameTime();
        foods = foods.filter(
          (food) =>
            !food.removingAt || now - food.removingAt < foodDisappearDuration,
        );
      }

      function removeTailSegments(count) {
        for (let i = 0; i < count; i++) {
          if (snake.length <= 1) break;
          snake.pop();
        }

        while (bodySkins.length > snake.length - 1) {
          bodySkins.pop();
        }
      }

      function shrinkAfterEating(shrinkCount) {
        removeTailSegments(1 + shrinkCount);
      }

      function addScore(value) {
        score += value;
        scoreEl.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          bestScoreEl.textContent = bestScore;
          localStorage.setItem("bestScore", bestScore);
        }
      }

      function startSpeedMode() {
        const now = getGameTime();
        const previousLevel = speedLevel;
        let didLevelUp = false;

        // 咖啡机制：先续杯3秒；只有续杯后超过当前阶段最大持续时间，才升档。
        if (speedLevel <= 0 || !isSpeedMode()) {
          speedLevel = 1;
          didLevelUp = speedLevel > previousLevel;
          speedModeEndTime = now + getSpeedLevelDuration(speedLevel);
        } else {
          const currentLevelDuration = getSpeedLevelDuration(speedLevel);
          const remainingTime = Math.max(0, speedModeEndTime - now);
          const extendedTime = remainingTime + coffeeExtendTime;

          if (
            extendedTime > currentLevelDuration &&
            speedLevel < maxSpeedLevel
          ) {
            speedLevel += 1;
            didLevelUp = speedLevel > previousLevel;
            speedModeEndTime = now + getSpeedLevelDuration(speedLevel);
          } else {
            speedModeEndTime =
              now + Math.min(extendedTime, currentLevelDuration);
          }
        }

        updateSpeedModeDelay();
        updateModeStatus(true);
        fillFoods();
        return didLevelUp;
      }

      function getSpeedLevelDuration(level) {
        return speedLevelDurations[level] || speedLevelDurations[maxSpeedLevel];
      }

      function checkSpeedModeEnd() {
        if (speedLevel <= 0 || getGameTime() <= speedModeEndTime) return;

        if (speedLevel >= maxSpeedLevel) {
          speedLevel = 0;
        } else {
          speedLevel -= 1;
        }

        if (speedLevel <= 0) {
          speedLevel = 0;
          speedModeEndTime = 0;
          moveDelay = speed;
        } else {
          speedModeEndTime = getGameTime() + getSpeedLevelDuration(speedLevel);
          updateSpeedModeDelay();
        }

        updateModeStatus(true);
        fillFoods();
      }

      function updateSpeedModeDelay() {
        moveDelay =
          speedLevelDelays[speedLevel] || speedLevelDelays[maxSpeedLevel];
      }

      function updateGameLogic() {
        if (!gameStarted || gameOver || gamePaused) return;

        pauseSpeedModeDuringHr();
        checkSpeedModeEnd();
        markExpiredFoods();
        fillFoods();

        dir = nextDir;
        directionChangedThisStep = false;

        const head = wrapPoint({
          x: snake[0].x + dir.x,
          y: snake[0].y + dir.y,
        });

        const foundFood = foods.find(
          (food) => food.x === head.x && food.y === head.y,
        );

        // 老板淡入预警期内只是危险提示，不会致死，也不会被吃掉。
        const eatenFood =
          foundFood &&
          foundFood.type === FOOD_BOMB &&
          !isBobDangerous(foundFood)
            ? null
            : foundFood;

        // 碰撞检测要放在食物判断之后：
        // 没吃东西时，尾巴这一帧会离开，所以允许蛇头走到当前尾巴格子。
        // 吃到食物时，尾巴不会离开，所以需要检查整条蛇。
        const bodyToCheck = eatenFood ? snake : snake.slice(0, -1);

        if (
          bodyToCheck.some((p) => p.x === head.x && p.y === head.y) &&
          !isShieldMode()
        ) {
          snake.unshift(head);
          if (!eatenFood) snake.pop();
          startDeath(false);
          return;
        }

        if (eatenFood && eatenFood.type === FOOD_BOMB) {
          snake.unshift(head);
          snake.pop();

          if (isShieldMode()) {
            playSound(sounds.shieldBreak);
            shieldModeEndTime = 0;
            foods = foods.filter((f) => f !== eatenFood);
            addScorePopup(
              head.x * size,
              head.y * size,
              "挡住！",
              shieldInfoColor,
              popupFontSize,
              popupLabelShieldBlock,
            );
            fillFoods();
          } else {
            addScorePopup(
              head.x * size,
              head.y * size,
              "危！",
              "#FF4444",
              popupFontSize,
              getPopupLabel(FOOD_BOMB),
            );
            startDeath(true);
          }

          return;
        }

        snake.unshift(head);

        if (eatenFood) {
          handleEatenFood(eatenFood, head);
        } else {
          snake.pop();
        }

        absorbNearbyEmployees();
      }

      function getPopupLabel(foodType, scoreValue = 0) {
        if (foodType === FOOD_NORMAL) return popupLabelNormal;
        if (foodType === FOOD_TRIPLE) return popupLabelBeauty;
        if (foodType === FOOD_AZHU) return popupLabelOutsource;
        if (foodType === FOOD_AI) return popupLabelAI;
        if (foodType === FOOD_INTERN)
          return scoreValue >= 0 ? popupLabelInternGood : popupLabelInternBad;
        if (foodType === FOOD_DOG) return popupLabelDog;
        if (foodType === FOOD_SPEED) return popupLabelCoffee;
        if (foodType === FOOD_HR) return popupLabelLayoff;
        if (foodType === FOOD_POT) return popupLabelPot;
        if (foodType === FOOD_DICE) return popupLabelDice;
        if (foodType === FOOD_BOMB) return popupLabelBoss;
        return "";
      }

      function handleEatenFood(food, head, fromTeamAbsorb = false) {
        foods = foods.filter((f) => f !== food);
        eatingStartTime = getGameTime();

        // 物品：只负责进入状态，不加分、不加身体。
        if (food.type === FOOD_SPEED) {
          const didLevelUp = startSpeedMode();
          playSound(sounds.coffee);
          if (didLevelUp) playSound(sounds.levelup);
          addScorePopup(
            head.x * size,
            head.y * size,
            "☕",
            getMultiplierColor(),
            popupFontSize,
            getPopupLabel(FOOD_SPEED),
          );
          fillFoods();
          return;
        }

        if (food.type === FOOD_HR) {
          playSound(sounds.layoff);
          startHrMode();
          shrinkAfterEating(hrShrinkOnEat);
          addScorePopup(
            head.x * size,
            head.y * size,
            "📉",
            hrInfoColor,
            popupFontSize,
            getPopupLabel(FOOD_HR),
          );
          fillFoods();
          return;
        }

        if (food.type === FOOD_POT) {
          playSound(sounds.shieldOn);
          startShieldMode();
          addScorePopup(
            head.x * size,
            head.y * size,
            "🛡️",
            shieldInfoColor,
            popupFontSize,
            getPopupLabel(FOOD_POT),
          );
          fillFoods();
          return;
        }

        if (food.type === FOOD_DICE) {
          playSound(sounds.team);
          startTeamMode();
          addScorePopup(
            head.x * size,
            head.y * size,
            "🎲",
            teamInfoColor,
            popupFontSize,
            getPopupLabel(FOOD_DICE),
          );
          fillFoods();
          return;
        }

        // 裁员模式：员工不再加分和加身体，而是减少身体。
        if (isHrMode() && isEmployeeFood(food.type)) {
          const shrinkCount = getEmployeeShrinkCount(food.type);
          shrinkAfterEating(shrinkCount);
          addScorePopup(
            head.x * size,
            head.y * size,
            shrinkCount > 0 ? `-${shrinkCount}` : "AI替代",
            hrInfoColor,
            popupFontSize,
            popupLabelLayoffMode,
          );
          fillFoods();
          return;
        }

        const multiplier = getScoreMultiplier();

        if (food.type === FOOD_NORMAL) {
          const point = normalFoodScore * multiplier;
          addScore(point);
          playSound(sounds.eat);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_NORMAL),
          );
          bodySkins.push("body");
        }

        if (food.type === FOOD_TRIPLE) {
          const point = heheziScore * multiplier;
          addScore(point);
          playSound(sounds.eat);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_TRIPLE),
          );
          bodySkins.push("hehezi", "xiaobai", "xiaomao");
        }

        if (food.type === FOOD_AZHU) {
          const point = azhuScore * multiplier;
          addScore(point);
          playSound(sounds.eat);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_AZHU),
          );

          for (let i = 0; i < azhuBodyCount; i++) {
            bodySkins.push("azhu");
          }

          for (let i = 0; i < outsourceBodyCount; i++) {
            bodySkins.push("outsource");
          }
        }

        if (food.type === FOOD_AI) {
          const point = aiScore * multiplier;
          addScore(point);
          playSound(sounds.eat);
          addScorePopup(
            head.x * size,
            head.y * size,
            `+${point}`,
            getMultiplierColor(),
            getMultiplierFontSize(),
            getPopupLabel(FOOD_AI),
          );
        }

        if (food.type === FOOD_INTERN) {
          const basePoint =
            Math.random() < 0.5 ? internGoodScore : internBadScore;
          const point = basePoint * multiplier;
          addScore(point);
          playSound(point >= 0 ? sounds.eat : sounds.bad);
          addScorePopup(
            head.x * size,
            head.y * size,
            point >= 0 ? `+${point}` : `${point}`,
            point >= 0 ? getMultiplierColor() : "#FF7777",
            getMultiplierFontSize(),
            getPopupLabel(FOOD_INTERN, point),
          );
          bodySkins.push("intern");
        }

        if (food.type === FOOD_DOG) {
          const point = dogScore * multiplier;
          addScore(point);
          playSound(sounds.bad);
          addScorePopup(
            head.x * size,
            head.y * size,
            `${point}`,
            "#FF7777",
            popupFontSize,
            getPopupLabel(FOOD_DOG),
          );
          bodySkins.push("dog");
        }

        while (snake.length < bodySkins.length + 1) {
          const tail = snake[snake.length - 1];
          snake.push(copyPoint(tail));
        }

        fillFoods();
      }

      function startDeath(isBomb = false) {
        if (deathPending || gameOver) return;

        deathPending = true;
        deathStartTime = getGameTime();
        deathIsBomb = isBomb;
        deathFinalMoveProgress = 1; // 死亡时直接定格在撞击后的最后一帧
        deathFrozenBackground = getCurrentBackgroundImage(); // 普通死亡锁定当时背景，避免之后二次变暗/变色
        deathRestartDelay = Math.max(
          deathFreezeTime,
          deathBodyWhitenStart +
            Math.max(0, snake.length - 1) * deathBodyWhitenStep +
            260,
        );
        moveProgress = deathFinalMoveProgress;
        bombGameOver = false;
        restartBtn.style.display = "none";
        restartBtn.style.opacity = "0";
        updateModeStatus(true); // 死亡瞬间立刻刷新到撞击时刻
        statusUiFrozen = true; // 之后不再刷新状态栏，避免按钮出现后跳到另一个阶段
        playSound(isBomb ? sounds.bossDeath : sounds.death);
      }

      function finishDeath() {
        if (gameOver) return;
        deathPending = false;
        bombGameOver = deathIsBomb;
        if (deathIsBomb) {
          // Boss死亡：显示重新开始时切换到Boss失败背景。
          deathFrozenBackground = null;
        }
        gameOver = true;
        moveProgress = deathFinalMoveProgress;
        // 状态栏保持死亡瞬间，不再刷新。
        restartBtn.style.display = "inline-block";
        requestAnimationFrame(() => {
          restartBtn.style.opacity = "1";
        });
        window.GreedyLeaderboard.handleGameOver();
      }

      function gameOverNow(isBomb = false) {
        bombGameOver = isBomb;
        finishDeath();
      }

      // ==================== 绘制 ====================

      function safeDrawImage(img, ...args) {
        if (img && img.complete && img.naturalWidth > 0) {
          try {
            ctx.drawImage(img, ...args);
            return true;
          } catch (e) {
            console.warn("图片绘制失败:", img.__assetSrc || img.src || img, e);
          }
        }

        // 图片缺失时使用占位图形，确保游戏不会崩溃。
        const x = args.length >= 4 ? args[0] : 0;
        const y = args.length >= 4 ? args[1] : 0;
        const w = args.length >= 4 ? args[2] : canvas.width;
        const h = args.length >= 4 ? args[3] : canvas.height;

        ctx.save();
        ctx.fillStyle = "rgba(90, 90, 90, 0.55)";
        ctx.beginPath();
        ctx.arc(
          x + w / 2,
          y + h / 2,
          Math.max(6, Math.min(w, h) / 2),
          0,
          Math.PI * 2,
        );
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
        return false;
      }

      function drawGame() {
        drawBackground();

        if (gameOver) {
          foods.forEach(drawFood);
          drawDeathOverlay(true);
          drawSnake();
          drawGameOverText();
          return;
        }

        if (!deathPending) {
          updateTeamAbsorbAnimations();
        }
        foods.forEach(drawFood);
        if (!deathPending) updateModeStatus();

        if (deathPending) {
          // 黑色遮罩放在蛇身白化层下面，确保死亡后的蛇仍然清楚。
          drawDeathOverlay(false);
          drawSnake();
          drawDeathHeadBurst();

          if (getGameTime() - deathStartTime >= deathRestartDelay) {
            finishDeath();
          }

          return;
        }

        drawSnake();
        drawShieldEffect();
        drawTeamAbsorbAnimations();
        drawScorePopups();

        if (gamePaused) {
          drawPauseOverlay();
          return;
        }

        pulseTime += foodPulseSpeed * 0.25;
      }

      function getCurrentBackgroundImage() {
        return bombGameOver
          ? images.bgBomb
          : isSpeedMode()
            ? images.bgSpeed
            : images.bg;
      }

      function drawBackground() {
        const bg =
          deathFrozenBackground && (deathPending || (gameOver && !bombGameOver))
            ? deathFrozenBackground
            : getCurrentBackgroundImage();
        safeDrawImage(bg, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = `rgba(0,0,0,${bgMask})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawGameOverText() {
        ctx.fillStyle = "white";
        ctx.font = "32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          bombGameOver ? "" : "队伍不好带啊~",
          canvas.width / 2,
          canvas.height / 2 - 76,
        );
      }

      function drawDeathOverlay(frozen = false) {
        const elapsed = frozen
          ? deathFreezeTime
          : getGameTime() - deathStartTime;
        const progress = Math.min(elapsed / deathFreezeTime, 1);
        const alpha = deathOverlayMaxAlpha * progress;

        ctx.save();
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function getDeathElapsed() {
        if (!deathStartTime) return 0;
        return gameOver ? deathRestartDelay : getGameTime() - deathStartTime;
      }

      function getDeathWhitenAlpha(index) {
        if (!deathPending && !gameOver) return 0;
        const elapsed = getDeathElapsed();
        if (index === 0) return 1;
        const start = deathBodyWhitenStart + (index - 1) * deathBodyWhitenStep;
        const progress = Math.min(
          Math.max((elapsed - start) / deathBodyWhitenFadeDuration, 0),
          1,
        );
        return deathBodyWhitenAlpha * progress;
      }

      function drawWhiteImageOverlay(
        img,
        x,
        y,
        drawSize,
        angle,
        alpha,
        shadowBlur = 0,
      ) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.translate(x + drawSize / 2, y + drawSize / 2);
        ctx.rotate(angle);
        ctx.globalAlpha = alpha;
        if (shadowBlur > 0) {
          ctx.shadowColor = deathIsBomb ? "#ffb0a0" : "white";
          ctx.shadowBlur = shadowBlur;
        }
        // Canvas filter 保留图片 alpha，只把不透明头像区域变白。
        ctx.filter = "brightness(0) invert(1)";
        safeDrawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
        ctx.restore();
      }

      function drawDeathWhiteHead(x, y, drawSize, angle, alpha = 1) {
        drawWhiteImageOverlay(
          images.headEat || images.head,
          x,
          y,
          drawSize,
          angle,
          alpha,
          30,
        );
      }

      function drawDeathHeadBurst() {
        if (!deathPending || snake.length <= 0) return;

        const elapsed = getGameTime() - deathStartTime;
        const progress = Math.min(elapsed / deathBurstDuration, 1);
        const fade = Math.max(0, 1 - progress);
        const head = snake[0];
        const prev = prevSnake[0] || head;
        const pos = getRenderPosition(head, prev);
        const drawPositions = getWrappedDrawPositions(pos.x, pos.y);
        const direction = getDirectionFromTo(prev, head);
        const angle = getAngleByDirection(direction);

        drawPositions.forEach((drawPos) => {
          const cx = drawPos.x + size / 2;
          const cy = drawPos.y + size / 2;
          const burstRadius = size * 0.65 + deathBurstMaxRadius * progress;
          const coreRadius =
            size * (1.05 + 0.25 * Math.sin(progress * Math.PI));

          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, burstRadius);
          glow.addColorStop(0, `rgba(255,255,255,${0.95 * fade})`);
          glow.addColorStop(
            0.28,
            deathIsBomb
              ? `rgba(255,165,135,${0.62 * fade})`
              : `rgba(255,245,180,${0.62 * fade})`,
          );
          glow.addColorStop(
            0.62,
            deathIsBomb
              ? `rgba(255,70,70,${0.25 * fade})`
              : `rgba(120,210,255,${0.28 * fade})`,
          );
          glow.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(cx, cy, burstRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = `rgba(255,255,255,${0.9 * fade})`;
          ctx.lineWidth = 3;
          ctx.shadowColor = "white";
          ctx.shadowBlur = 22;
          ctx.beginPath();
          ctx.arc(
            cx,
            cy,
            size * 0.62 + deathBurstMaxRadius * 0.62 * progress,
            0,
            Math.PI * 2,
          );
          ctx.stroke();

          for (let i = 0; i < deathBurstParticleCount; i++) {
            const a = (Math.PI * 2 * i) / deathBurstParticleCount + 0.35;
            const dist = size * 0.35 + deathBurstMaxRadius * 0.75 * progress;
            const px = cx + Math.cos(a) * dist;
            const py = cy + Math.sin(a) * dist;
            const r = 2.2 + (i % 3) * 0.8;
            ctx.fillStyle = `rgba(255,255,255,${0.8 * fade})`;
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();

          // 白化蛇头：只对白头像素生效，PNG透明区域不会被染成白色方块。
          drawDeathWhiteHead(
            drawPos.x,
            drawPos.y,
            size,
            angle,
            0.82 + 0.16 * fade,
          );

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = `rgba(255,255,255,${0.85 * fade})`;
          ctx.lineWidth = 2;
          ctx.shadowColor = "white";
          ctx.shadowBlur = 14;
          for (let i = 0; i < 8; i++) {
            const a = (Math.PI * 2 * i) / 8 + progress * 0.8;
            const inner = coreRadius * 0.45;
            const outer = coreRadius * (1.1 + progress * 1.1);
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
            ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
            ctx.stroke();
          }
          ctx.restore();
        });
      }

      function drawPauseOverlay() {
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("已暂停", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "16px sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.fillText(
          "点击继续按钮恢复游戏",
          canvas.width / 2,
          canvas.height / 2 + 24,
        );
        ctx.restore();
      }

      function getDeathShakeOffset() {
        if (!deathPending) return { x: 0, y: 0 };

        const elapsed = getGameTime() - deathStartTime;
        if (elapsed > deathShakeDuration) return { x: 0, y: 0 };

        const strength =
          deathShakeStrength * (1 - elapsed / deathShakeDuration);
        return {
          x: (Math.random() * 2 - 1) * strength,
          y: (Math.random() * 2 - 1) * strength,
        };
      }

      function drawFood(food) {
        const x = food.x * size;
        const y = food.y * size;
        const pulse = Math.sin(pulseTime) * foodPulseSize;
        const alpha = getFoodAlpha(food);
        const ringColor = resolveDrawColor(getFoodRingColor(food));

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = ringColor;
        ctx.shadowBlur = foodGlow;
        ctx.beginPath();
        ctx.arc(x + size / 2, y + size / 2, size / 2 + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = foodStrokeWidth;
        ctx.stroke();
        drawCircleImage(getFoodImage(food.type), x, y);
        ctx.restore();
      }

      function getFoodRingColor(food) {
        if (food.type === FOOD_BOMB)
          return isShieldMode() ? shieldInfoColor : "#FF4444";
        if (food.type === FOOD_HR) return hrInfoColor;
        if (food.type === FOOD_POT) return shieldInfoColor;
        if (food.type === FOOD_DICE) return teamInfoColor;
        if (food.type === FOOD_SPEED) return getMultiplierColor();
        if (isHrMode() && isEmployeeFood(food.type)) return hrInfoColor;
        return getMultiplierColor();
      }

      function getFoodAlpha(food) {
        let alpha = 1;

        if (food.type === FOOD_BOMB) {
          alpha *= getBobWarningAlpha(food);
        }

        if (!food.removingAt) return alpha;

        const elapsed = getGameTime() - food.removingAt;
        const fadeAlpha = Math.max(
          1 - elapsed / foodDisappearDuration,
          foodMinAlpha,
        );
        const blinkOn = Math.floor(getGameTime() / foodBlinkSpeed) % 2 === 0;
        return alpha * (blinkOn ? fadeAlpha : foodMinAlpha);
      }

      function getBobWarningAlpha(food) {
        if (food.type !== FOOD_BOMB) return 1;

        const elapsed =
          getGameTime() - (food.warningStartedAt || food.createdAt);
        const progress = Math.min(elapsed / bobWarningDuration, 1);
        return bobWarningMinAlpha + (1 - bobWarningMinAlpha) * progress;
      }

      function isBobDangerous(food) {
        if (!food || food.type !== FOOD_BOMB) return false;
        return (
          getGameTime() - (food.warningStartedAt || food.createdAt) >=
          bobWarningDuration
        );
      }

      function getWorkStageName(level) {
        if (level === 1) return "☕ 提提神";
        if (level === 2) return "🔥 轻度加班";
        if (level === 3) return "🔥 中度加班";
        if (level === 4) return "🔥 疯狂加班";
        if (level >= 5) return "🌈 通宵爆肝";
        return "☕ 正常上班";
      }

      function getWorkStageShortName(level) {
        if (level === 1) return "☕提神";
        if (level === 2) return "🔥轻";
        if (level === 3) return "🔥中";
        if (level === 4) return "🔥疯";
        if (level >= 5) return "🌈通宵";
        return "☕正常";
      }

      function updateModeStatus(force = false) {
        if (statusUiFrozen) return;
        const uiNow = performance.now();
        if (!force && uiNow - lastStatusUiUpdateTime < statusUiUpdateInterval) {
          return;
        }
        lastStatusUiUpdateTime = uiNow;

        updateBuffStatusCell(
          teamStatus,
          isTeamMode(),
          "🎲 团建",
          teamModeEndTime,
        );
        updateBuffStatusCell(hrStatus, isHrMode(), "📉 裁员", hrModeEndTime);
        updateBuffStatusCell(
          shieldStatus,
          isShieldMode(),
          "🛡 背锅",
          shieldModeEndTime,
        );
        updateOvertimeBar();
      }

      function updateBuffStatusCell(el, active, label, endTime) {
        if (!el) return;

        if (!active) {
          el.classList.remove("active");
          el.textContent = `${label} --`;
          return;
        }

        const remain = Math.max(0, (endTime - getGameTime()) / 1000);
        el.classList.add("active");
        el.textContent = `${label} ${formatRemain(remain)}`;
      }

      function updateOvertimeBar() {
        if (!overtimeBar || !overtimeFill || !overtimeText) return;

        if (!isSpeedMode()) {
          overtimeText.textContent = "正常上班 工资×1";
          overtimeFill.style.transform = "scaleX(1)";
          setOvertimeBarColor("normal");
          return;
        }

        const duration = getSpeedLevelDuration(speedLevel);
        const remainMs = Math.max(0, speedModeEndTime - getGameTime());
        const remainSec = remainMs / 1000;
        const durationSec = duration / 1000;
        const progress = Math.max(0, Math.min(remainMs / duration, 1));
        const multiplier = getScoreMultiplier();
        const stageName = getWorkStageBarName(speedLevel);

        overtimeText.textContent = `${stageName} 工资×${multiplier} ${formatRemain(remainSec)} / ${formatDuration(durationSec)}`;
        overtimeFill.style.transform = `scaleX(${progress})`;

        if (remainMs <= 1000) {
          setOvertimeBarColor("danger");
        } else if (
          speedLevel < maxSpeedLevel &&
          remainMs + coffeeExtendTime > duration
        ) {
          setOvertimeBarColor("upgrade");
        } else {
          setOvertimeBarColor("extend");
        }
      }

      function setOvertimeBarColor(state) {
        if (!overtimeBar || !overtimeFill) return;
        if (currentOvertimeColorState === state) return;
        currentOvertimeColorState = state;

        const colorMap = {
          normal: {
            border: "rgba(255, 255, 255, 0.28)",
            shadow: "rgba(255, 255, 255, 0.12)",
            fill: "linear-gradient(90deg, #555, #777)",
          },
          extend: {
            border: "rgba(255, 184, 0, 0.86)",
            shadow: "rgba(255, 184, 0, 0.42)",
            fill: "linear-gradient(90deg, #ffdf31, #ffb300)",
          },
          upgrade: {
            border: "rgba(52, 226, 122, 0.92)",
            shadow: "rgba(52, 226, 122, 0.45)",
            fill: "linear-gradient(90deg, #ffe04a, #31d857)",
          },
          danger: {
            border: "rgba(255, 68, 68, 0.95)",
            shadow: "rgba(255, 68, 68, 0.48)",
            fill: "linear-gradient(90deg, #ffcf2e, #ff4444)",
          },
        };

        const colors = colorMap[state] || colorMap.normal;
        overtimeBar.style.borderColor = colors.border;
        overtimeBar.style.boxShadow = `0 0 10px ${colors.shadow}, inset 0 0 12px rgba(0, 0, 0, 0.85)`;
        overtimeFill.style.background = colors.fill;
        overtimeFill.style.boxShadow = `inset 0 2px 5px rgba(255, 255, 255, 0.32), 0 0 10px ${colors.shadow}`;
      }

      function getWorkStageBarName(level) {
        if (level === 1) return "提提神";
        if (level === 2) return "轻度加班";
        if (level === 3) return "中度加班";
        if (level === 4) return "疯狂加班";
        if (level >= 5) return "通宵爆肝";
        return "正常上班";
      }

      function formatRemain(seconds) {
        return `${Math.max(0, seconds).toFixed(1)}s`;
      }

      function formatDuration(seconds) {
        return `${Math.round(seconds)}s`;
      }

      function drawScorePopups() {
        scorePopups.forEach((popup) => {
          drawPopup(popup);
          popup.y -= popupRiseSpeed;
          popup.life -= 0.8;
        });
        scorePopups = scorePopups.filter((popup) => popup.life > 0);
      }

      function drawShieldEffect() {
        if (!isShieldMode() || snake.length <= 0) return;

        const remain = shieldModeEndTime - getGameTime();
        const isWarning = remain <= shieldWarningTime;
        const blink = isWarning
          ? Math.floor(getGameTime() / 120) % 2 === 0
          : true;

        if (!blink) return;

        const headPos = getRenderPosition(snake[0], prevSnake[0] || snake[0]);
        const cx = headPos.x + size / 2;
        const cy = headPos.y + size / 2;
        const t = getGameTime() * 0.007;
        const radius = shieldRingRadius + Math.sin(t * 2.5) * shieldRingPulse;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t);

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.strokeStyle = isWarning
          ? "rgba(52, 226, 122, 0.95)"
          : "rgba(52, 226, 122, 0.68)";
        ctx.lineWidth = isWarning ? 4 : 3;
        ctx.shadowColor = shieldInfoColor;
        ctx.shadowBlur = isWarning ? 22 : 14;
        ctx.stroke();

        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(
            0,
            0,
            radius + 4,
            i * Math.PI * 0.5 + 0.12,
            i * Math.PI * 0.5 + 0.55,
          );
          ctx.strokeStyle = "rgba(180,255,205,0.72)";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawSnake() {
        const shake = getDeathShakeOffset();

        // 胶囊连接底色先画在头像下面，只改变视觉连续性，不改变碰撞逻辑。
        drawBodyConnectors(shake);

        // 先画身体，再画蛇头，确保死亡定格时蛇头永远在最上层。
        for (let index = snake.length - 1; index >= 1; index--) {
          drawSnakeSegment(index, shake);
        }

        if (snake.length > 0) {
          drawSnakeSegment(0, shake);
        }
      }

      function drawSnakeSegment(index, shake) {
        const p = snake[index];
        const prev = prevSnake[index] || p;
        const pos = getRenderPosition(p, prev);
        const x = pos.x + shake.x;
        const y = pos.y + shake.y;
        const drawPositions = getWrappedDrawPositions(x, y);

        drawPositions.forEach((drawPos) => {
          const direction = getDirectionFromTo(prev, p);
          if (index === 0) {
            drawHead(drawPos.x, drawPos.y, direction);
            const headWhiteAlpha = getDeathWhitenAlpha(0);
            if (headWhiteAlpha > 0) {
              drawDeathWhiteHead(
                drawPos.x,
                drawPos.y,
                size,
                getAngleByDirection(direction),
                headWhiteAlpha,
              );
            }
          } else {
            drawBodyPart(p, index, drawPos.x, drawPos.y);
            const bodyWhiteAlpha = getDeathWhitenAlpha(index);
            if (bodyWhiteAlpha > 0) {
              const skinType = bodySkins[index - 1] || "body";
              drawWhiteImageOverlay(
                getBodyImage(skinType),
                drawPos.x,
                drawPos.y,
                size,
                getAngleByDirection(direction),
                bodyWhiteAlpha,
                0,
              );
            }
          }
        });
      }

      function drawBodyConnectors(shake) {
        if (!bodyConnectorEnabled || snake.length <= 1) return;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        for (let index = snake.length - 1; index >= 1; index--) {
          const current = snake[index];
          const previous = snake[index - 1];
          const currentPrev = prevSnake[index] || current;
          const previousPrev = prevSnake[index - 1] || previous;

          const currentPos = getRenderPosition(current, currentPrev);
          const previousPos = getRenderPosition(previous, previousPrev);

          const x1 = currentPos.x + size / 2 + shake.x;
          const y1 = currentPos.y + size / 2 + shake.y;
          let x2 = previousPos.x + size / 2 + shake.x;
          let y2 = previousPos.y + size / 2 + shake.y;

          const adjustedEnd = getShortestCanvasEndPoint(x1, y1, x2, y2);
          x2 = adjustedEnd.x;
          y2 = adjustedEnd.y;

          drawConnectorLineWithWrap(x1, y1, x2, y2);
        }

        ctx.restore();
      }

      function getShortestCanvasEndPoint(x1, y1, x2, y2) {
        if (x2 - x1 > canvas.width / 2) x2 -= canvas.width;
        if (x2 - x1 < -canvas.width / 2) x2 += canvas.width;
        if (y2 - y1 > canvas.height / 2) y2 -= canvas.height;
        if (y2 - y1 < -canvas.height / 2) y2 += canvas.height;
        return { x: x2, y: y2 };
      }

      function drawConnectorLineWithWrap(x1, y1, x2, y2) {
        const offsetsX = [0];
        const offsetsY = [0];
        const margin = bodyConnectorWidth + size;

        if (Math.min(x1, x2) < margin) offsetsX.push(canvas.width);
        if (Math.max(x1, x2) > canvas.width - margin)
          offsetsX.push(-canvas.width);
        if (Math.min(y1, y2) < margin) offsetsY.push(canvas.height);
        if (Math.max(y1, y2) > canvas.height - margin)
          offsetsY.push(-canvas.height);

        offsetsX.forEach((ox) => {
          offsetsY.forEach((oy) => {
            ctx.strokeStyle = bodyConnectorColor;
            ctx.lineWidth = bodyConnectorWidth;
            ctx.shadowColor = "rgba(0,0,0,0.35)";
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.moveTo(x1 + ox, y1 + oy);
            ctx.lineTo(x2 + ox, y2 + oy);
            ctx.stroke();

            ctx.strokeStyle = bodyConnectorHighlight;
            ctx.lineWidth = bodyConnectorInnerWidth;
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(x1 + ox, y1 + oy);
            ctx.lineTo(x2 + ox, y2 + oy);
            ctx.stroke();
          });
        });
      }

      function getWrappedDrawPositions(x, y) {
        const margin = size * 2.2;
        const xPositions = [x];
        const yPositions = [y];

        if (x < margin) xPositions.push(x + canvas.width);
        if (x > canvas.width - margin) xPositions.push(x - canvas.width);
        if (y < margin) yPositions.push(y + canvas.height);
        if (y > canvas.height - margin) yPositions.push(y - canvas.height);

        const positions = [];
        xPositions.forEach((drawX) => {
          yPositions.forEach((drawY) => {
            positions.push({ x: drawX, y: drawY });
          });
        });

        return positions;
      }

      function drawHead(x, y, direction) {
        headTargetAngle = getAngleByDirection(direction);
        headCurrentAngle = lerpAngle(headCurrentAngle, headTargetAngle, 0.25);

        const elapsed = getGameTime() - eatingStartTime;
        const isEating = elapsed < eatingDuration;
        const img = isEating ? images.headEat : images.head;
        let drawSize = size;
        let offset = 0;

        if (isEating) {
          const progress = elapsed / eatingDuration;
          const wave = Math.sin(progress * Math.PI);
          drawSize = size * (eatHeadMinScale + wave * eatHeadScaleRange);
          offset = (size - drawSize) / 2;
        }

        if (isMaxSpeedMode()) {
          ctx.save();
          ctx.shadowColor = getRainbowColor();
          ctx.shadowBlur = 25;
          drawRotatedCircleImageByAngle(
            img,
            x + offset,
            y + offset,
            drawSize,
            headCurrentAngle,
          );
          ctx.restore();
          return;
        }

        drawRotatedCircleImageByAngle(
          img,
          x + offset,
          y + offset,
          drawSize,
          headCurrentAngle,
        );
      }

      function drawBodyPart(p, index, x, y) {
        const skinType = bodySkins[index - 1] || "body";
        const prevPart = snake[index - 1];
        const direction = getDirectionFromTo(p, prevPart);
        drawRotatedCircleImage(getBodyImage(skinType), x, y, size, direction);
      }

      function drawCircleImage(img, x, y, drawSize = size) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(
          x + drawSize / 2,
          y + drawSize / 2,
          drawSize / 2,
          0,
          Math.PI * 2,
        );
        ctx.clip();
        safeDrawImage(img, x, y, drawSize, drawSize);
        ctx.restore();
      }

      function drawRotatedCircleImage(
        img,
        x,
        y,
        drawSize = size,
        direction = { x: 1, y: 0 },
      ) {
        drawRotatedCircleImageByAngle(
          img,
          x,
          y,
          drawSize,
          getAngleByDirection(direction),
        );
      }

      function drawRotatedCircleImageByAngle(
        img,
        x,
        y,
        drawSize = size,
        angle = 0,
      ) {
        ctx.save();
        ctx.translate(x + drawSize / 2, y + drawSize / 2);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.arc(0, 0, drawSize / 2, 0, Math.PI * 2);
        ctx.clip();
        safeDrawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
        ctx.restore();
      }

      function drawPopup(popup) {
        const alpha = popup.life / popup.maxLife;
        const ageProgress = 1 - alpha;
        const popScale = 0.82 + 0.18 * Math.min(ageProgress / 0.18, 1);
        const x = popup.x + size / 2;
        const y = popup.y + popupYOffset;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        ctx.scale(popScale, popScale);

        ctx.fillStyle = resolveDrawColor(popup.color);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = popupStrokeWidth;
        ctx.font = `bold ${popup.fontSize || popupFontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.strokeText(popup.text, 0, 0);
        ctx.fillText(popup.text, 0, 0);

        if (popup.subText) {
          ctx.globalAlpha = alpha * popupSubTextAlpha;
          ctx.fillStyle = popupSubTextColor;
          ctx.strokeStyle = "rgba(0,0,0,0.85)";
          ctx.lineWidth = Math.max(2, popupStrokeWidth - 2);
          ctx.font = `bold ${popupSubTextFontSize}px sans-serif`;
          ctx.strokeText(popup.subText, 0, popupSubTextOffsetY);
          ctx.fillText(popup.subText, 0, popupSubTextOffsetY);
        }

        ctx.restore();
      }

      function addScorePopup(
        x,
        y,
        text,
        color = "#ffffff",
        fontSize = popupFontSize,
        subText = "",
      ) {
        scorePopups.push({
          x,
          y,
          text,
          subText,
          color,
          fontSize,
          life: popupLife,
          maxLife: popupLife,
        });
      }


      // ==================== 联网排行榜：已拆分到 leaderboard.js ====================

      // ==================== 工具函数 ====================
      function copyPoint(p) {
        return { x: p.x, y: p.y };
      }

      function wrapPoint(p) {
        return {
          x: (p.x + count) % count,
          y: (p.y + count) % count,
        };
      }

      function getWrappedDelta(to, from) {
        let d = to - from;
        if (d > count / 2) d -= count;
        if (d < -count / 2) d += count;
        return d;
      }

      function getDirectionFromTo(from, to) {
        const dx = getWrappedDelta(to.x, from.x);
        const dy = getWrappedDelta(to.y, from.y);
        return { x: Math.sign(dx), y: Math.sign(dy) };
      }

      function getRenderPosition(p, prev) {
        const dx = getWrappedDelta(p.x, prev.x);
        const dy = getWrappedDelta(p.y, prev.y);
        let x = prev.x + dx * moveProgress;
        let y = prev.y + dy * moveProgress;

        if (x < 0) x += count;
        if (x >= count) x -= count;
        if (y < 0) y += count;
        if (y >= count) y -= count;

        return { x: x * size, y: y * size };
      }

      function getAngleByDirection(direction) {
        if (direction.y === 1) return 0;
        if (direction.x === -1) return Math.PI / 2;
        if (direction.y === -1) return Math.PI;
        if (direction.x === 1) return -Math.PI / 2;
        return headCurrentAngle;
      }

      function lerpAngle(current, target, amount) {
        let diff = target - current;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        return current + diff * amount;
      }

      function getFoodImage(type) {
        if (type === FOOD_SPEED) return images.coffee;
        if (type === FOOD_TRIPLE) return images.hehezi;
        if (type === FOOD_BOMB) return images.bob;
        if (type === FOOD_HR) return images.layoff;
        if (type === FOOD_AZHU) return images.azhu;
        if (type === FOOD_AI) return images.ai;
        if (type === FOOD_INTERN) return images.intern;
        if (type === FOOD_DOG) return images.dog;
        if (type === FOOD_POT) return images.pot;
        if (type === FOOD_DICE) return images.dice;
        return images.body;
      }

      function getBodyImage(type) {
        if (type === "hehezi") return images.hehezi;
        if (type === "xiaobai") return images.xiaobai;
        if (type === "xiaomao") return images.xiaomao;
        if (type === "azhu") return images.azhu;
        if (type === "outsource") return images.outsource;
        if (type === "intern") return images.intern;
        if (type === "dog") return images.dog;
        return images.body;
      }

      function playSound(sound) {
        if (!musicEnabled || !sound || sound.__ok === false) return;
        try {
          sound.currentTime = 0;
          sound.play().catch(() => {});
        } catch (e) {
          console.warn("音效播放失败:", sound.__assetSrc || sound, e);
        }
      }

      // ==================== 动画循环 ====================
      function gameFrame(now) {
        if (
          gameStarted &&
          !gameOver &&
          !deathPending &&
          !gamePaused &&
          now - lastMoveTime >= moveDelay
        ) {
          prevSnake = snake.map(copyPoint);
          updateGameLogic();
          lastMoveTime = now;
          moveProgress = 0;
        }

        if (gamePaused) {
          moveProgress = moveProgress;
        } else if (deathPending || gameOver) {
          moveProgress = deathFinalMoveProgress;
        } else {
          moveProgress = Math.min((now - lastMoveTime) / moveDelay, 1);
        }

        if (gameStarted) drawGame();
        animationId = requestAnimationFrame(gameFrame);
      }

      // ==================== 资源加载 ====================
      const assetLoadingTips = {
        head: "整理领带中",
        headEat: "正在练习微笑",
        body: "员工打卡中",
        hehezi: "员工打卡中",
        xiaobai: "员工打卡中",
        xiaomao: "员工打卡中",
        azhu: "员工打卡中",
        outsource: "员工打卡中",
        ai: "员工打卡中",
        intern: "员工打卡中",
        dog: "员工打卡中",
        bg: "正在打扫工位",
        bgSpeed: "正在开灯",
        bgBomb: "咖啡机预热中",
        coffee: "咖啡机预热中",
        pot: "正在进行心理建设",
        dice: "整理桌游",
        layoff: "打印机连接中",
        bob: "咖啡机预热中",
      };

      function getLoadingTip(assetKey) {
        return assetLoadingTips[assetKey] || "正在整理办公桌";
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function drawLoadingScreen(progress, currentTip = "") {
        ctx.save();
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(255,184,0,0.12)";
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2 - 76, 115, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          "打工人生存法则",
          canvas.width / 2,
          canvas.height / 2 - 68,
        );
        ctx.font = "bold 24px sans-serif";
        ctx.fillText("贪吃经理", canvas.width / 2, canvas.height / 2 - 42);

        ctx.font = "16px sans-serif";
        ctx.fillText(
          currentTip || "正在整理办公桌",
          canvas.width / 2,
          canvas.height / 2 - 16,
        );

        const barX = 72;
        const barY = canvas.height / 2 + 4;
        const barW = canvas.width - barX * 2;
        const barH = 14;
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        roundRect(barX, barY, barW, barH, 7);
        ctx.fill();
        ctx.fillStyle = "#ffb800";
        roundRect(barX, barY, barW * (progress / 100), barH, 7);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(`${progress}%`, canvas.width / 2, canvas.height / 2 + 45);

        if (currentTip) {
          ctx.font = "12px sans-serif";
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fillText(
            "请稍等，员工马上到岗",
            canvas.width / 2,
            canvas.height / 2 + 68,
          );
        }

        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function updateLoadingUI(progress, assetKey = "") {
        const tip =
          progress >= 100 ? "全员到岗，准备开工！" : getLoadingTip(assetKey);

        startBtn.textContent = `资源加载中 ${progress}%`;
        loadingBar.style.width = `${progress}%`;
        loadingPercent.textContent = `${progress}%`;
        loadingText.textContent = tip;
        loadingAssetList.innerHTML = "";
        drawLoadingScreen(progress, tip);
      }

      function preloadImages() {
        const imageList = Object.entries(images);
        const total = imageList.length;
        const assetStates = {};
        let loaded = 0;

        updateLoadingUI(0, "");

        return Promise.all(
          imageList.map(
            ([name, img]) =>
              new Promise((resolve) => {
                assetStates[name] = "current";
                updateLoadingUI(Math.round((loaded / total) * 100), name);

                function finish(success) {
                  loaded += 1;
                  img.__ok = success;
                  assetStates[name] = success ? "done" : "failed";
                  const progress = Math.round((loaded / total) * 100);
                  updateLoadingUI(progress, name);
                  resolve();
                }

                if (img.complete && img.naturalWidth > 0) {
                  finish(true);
                  return;
                }

                img.onload = () => finish(true);
                img.onerror = () => {
                  console.warn(`图片加载失败: ${name}`, img.src);
                  finish(false);
                };
              }),
          ),
        );
      }

      function preloadAudios() {
        const audioList = Object.entries(sounds).filter(([, audio]) => audio);
        if (audioList.length === 0) return Promise.resolve();

        return Promise.all(
          audioList.map(
            ([name, audio]) =>
              new Promise((resolve) => {
                let done = false;

                function finish(success) {
                  if (done) return;
                  done = true;
                  audio.__ok = success;
                  if (!success)
                    console.warn(`音效加载失败: ${name}`, audio.__assetSrc);
                  resolve();
                }

                if (!audio) {
                  finish(false);
                  return;
                }

                if (audio.readyState >= 2) {
                  finish(true);
                  return;
                }

                audio.addEventListener("canplaythrough", () => finish(true), {
                  once: true,
                });
                audio.addEventListener("loadeddata", () => finish(true), {
                  once: true,
                });
                audio.addEventListener("error", () => finish(false), {
                  once: true,
                });

                // 音频缺失或浏览器不预加载时，不阻塞游戏开始。
                setTimeout(() => finish(audio.__ok !== false), 1200);
                try {
                  audio.load();
                } catch (e) {
                  finish(false);
                }
              }),
          ),
        ).then(() => {
          const okCount = audioList.filter(
            ([, a]) => a && a.__ok !== false,
          ).length;
          console.log(
            `音效资源: ${okCount}/${audioList.length}，即使缺失也会继续运行`,
          );
        });
      }

      Promise.all([preloadImages(), preloadAudios()]).then(async () => {
        updateLoadingUI(100);

        if (DEBUG_LOADING) {
          await sleep(DEBUG_LOADING_DELAY);
        } else {
          await sleep(350);
        }

        assetsLoaded = true;
        startBtn.disabled = false;
        startBtn.textContent = "开始游戏";
        loadingOverlay.style.display = "none";
        updateModeStatus(true);
        drawBackground();
      });
    </script>
  </body>
